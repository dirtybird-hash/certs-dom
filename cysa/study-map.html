<style>
/* Layout: Study Map, Midnight. Top bar (brand, search, theme switch at top right),
   domain chips, then objective rail + topic cards. Dark is the default look. */
:root{
  --bg:#0F1720; --surface:#17222D; --surface-2:#1C2935; --border:#2E4052; --text:#E8EEF3; --muted:#A9B7C4;
  --accent:#5B9DFF; --accent-ink:#0B1220; --link:#7FB2FF; --flowbox:#17222D;
  --trap-bg:#2B2414; --trap-bd:#F5B74A; --trap-tx:#F6E9CF; --trap-lb:#F5B74A;
  --f-head:'Sora','Segoe UI',system-ui,sans-serif; --f-body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
.app[data-mode="light"]{
  --bg:#F5F8FC; --surface:#FFFFFF; --surface-2:#EEF3F9; --border:#D3DCE6; --text:#13202D; --muted:#4A5866;
  --accent:#2F6FE0; --accent-ink:#FFFFFF; --link:#2459B8; --flowbox:#FFFFFF;
  --trap-bg:#FFF5E0; --trap-bd:#D99A1E; --trap-tx:#3A2C0B; --trap-lb:#8A5A00;
  color-scheme:light;
}
html,body{background:#0F1720}
body{margin:0}
.app{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:17px;line-height:1.55;min-height:100vh}
*{box-sizing:border-box}
a{color:var(--link)}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto;min-width:0}
.brand a{font-family:var(--f-head);font-size:12px;color:var(--muted);text-decoration:none}
.brand h1{margin:0;font-family:var(--f-head);font-size:24px;font-weight:800;letter-spacing:-.01em}
.search{flex:1 1 280px;max-width:420px;position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:11px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);color:var(--text)}
.search input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mode{display:flex;border:1.5px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)}
.mode button{font:600 14px var(--f-head);padding:10px 14px;border:0;background:transparent;color:var(--muted);cursor:pointer;display:flex;gap:6px;align-items:center;min-height:44px}
.mode button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.mode button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.doms{display:flex;flex-wrap:wrap;gap:8px}
.doms button{font:700 14px var(--f-head);padding:9px 15px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;min-height:42px}
.doms button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.body{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.rail{flex:1 1 240px;max-width:300px;display:flex;flex-direction:column;gap:6px}
.rail button{text-align:left;font:inherit;font-size:15px;line-height:1.35;padding:10px 12px;border-radius:10px;border:1.5px solid transparent;background:transparent;color:var(--text);cursor:pointer;display:flex;gap:10px}
.rail button b{font-family:var(--f-mono);font-size:13px;color:var(--link);flex:0 0 auto;padding-top:2px}
.rail button[aria-current="true"]{background:var(--surface);border-color:var(--accent)}
.rail button:focus-visible{outline:2px solid var(--accent)}
.rail .n{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.main{flex:999 1 600px;min-width:0;display:flex;flex-direction:column;gap:22px}
.ohead{display:flex;flex-direction:column;gap:8px;border-bottom:2px solid var(--border);padding-bottom:16px}
.ohead .k{font:700 13px var(--f-head);letter-spacing:.08em;color:var(--link)}
.ohead h2{margin:0;font-family:var(--f-head);font-size:28px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.ohead .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:6px;font:700 14px var(--f-head);padding:10px 16px;border-radius:12px;text-decoration:none;min-height:42px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec{border:1.5px solid var(--border);color:var(--text);background:var(--surface)}
.group{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;scroll-margin-top:16px}
.card.lead{border-color:var(--accent)}
.card h3{margin:0;font-family:var(--f-head);font-size:21px;font-weight:700;line-height:1.25}
.card h3 .full{display:block;font-family:var(--f-body);font-weight:600;font-size:15px;color:var(--muted);margin-top:3px}
.rows{display:grid;grid-template-columns:132px minmax(0,1fr);gap:8px 16px}
.rows .lb{font:700 12px var(--f-head);letter-spacing:.07em;text-transform:uppercase;color:var(--link);padding-top:4px}
.rows p{margin:0}
.kids{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.kids .card{background:var(--surface-2);padding:16px 18px}
.kids .card h3{font-size:18px}
.kids .rows{grid-template-columns:1fr;gap:2px}
.kids .rows p{margin-bottom:8px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.flow .bx{flex:1 1 140px;background:var(--flowbox);border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.35}
.flow .bx.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.flow .ar{color:var(--link);font:700 20px var(--f-head)}
.trap{background:var(--trap-bg);border:1.5px solid var(--trap-bd);border-radius:12px;padding:12px 14px;color:var(--trap-tx)}
.trap b{display:block;font:700 12px var(--f-head);letter-spacing:.08em;color:var(--trap-lb);margin-bottom:2px}
code{font-family:var(--f-mono);font-size:.86em;background:var(--surface-2);border:1px solid var(--border);border-radius:5px;padding:1px 5px;overflow-wrap:anywhere}
.deep{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:15px;color:var(--muted)}
.deep a{font-weight:600}
.hits{font:600 14px var(--f-head);color:var(--muted)}
.empty{border:1.5px dashed var(--border);border-radius:16px;padding:22px;color:var(--muted)}
.foot{font-size:13px;color:var(--muted);border-top:1px solid var(--border);padding-top:14px}
@media (max-width:760px){.kids{grid-template-columns:1fr}.rows{grid-template-columns:1fr;gap:2px}.rows .lb{padding-top:6px}.rail{max-width:none}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>

<script>
var DATA = [{"o": "1.1", "title": "Explain the importance of system and network architecture concepts in security operations.", "items": [{"id": "11-log-ingestion", "t": "Log ingestion", "what": "Getting logs from every system into one central place, parsed into common fields.", "does": "Lets one search or correlation rule cover firewalls, servers, endpoints and cloud at once.", "where": "Logs travel from sources to a collector and on to the SIEM.", "flow": ["Hosts, firewalls, cloud", "Agents / syslog / APIs", "*Collector or SIEM"], "kids": [{"id": "11-log-ingestion-time-synchronization", "t": "Time synchronization", "what": "Every system agreeing on the time, using NTP.", "does": "Keeps events in the right order so correlation rules fire and timelines make sense.", "where": "Hosts sync to internal NTP servers (UDP 123), which sync to a trusted source; store timestamps in UTC.", "trap": "Events from two systems don&rsquo;t line up, or a correlation rule never fires? Suspect time sync first."}, {"id": "11-log-ingestion-logging-levels", "t": "Logging levels", "what": "How much detail a source records. Syslog uses 0 Emergency, 1 Alert, 2 Critical, 3 Error, 4 Warning, 5 Notice, 6 Informational, 7 Debug.", "does": "Sets the trade-off between detail and volume. Choosing level 4 keeps 0 through 4.", "trap": "Lower number means more severe. Debug (7) is the noisiest, not the most urgent."}]}, {"id": "11-operating-system-os-concepts", "t": "Operating system (OS) concepts", "what": "How Windows and Linux store settings, run programs and protect themselves.", "does": "Tells you what normal looks like, so changes made by an attacker stand out.", "kids": [{"id": "11-operating-system-os-concepts-windows-registry", "t": "Windows Registry", "what": "Windows&rsquo; central configuration database.", "does": "Holds system, user and program settings, including where malware hides persistence.", "where": "Hives such as HKLM (machine) and HKCU (current user). Run keys under <code>Software/Microsoft/Windows/CurrentVersion/Run<\/code> start programs at logon. Edited with <code>regedit<\/code>."}, {"id": "11-operating-system-os-concepts-system-hardening", "t": "System hardening", "what": "Reducing a system&rsquo;s attack surface below its default build.", "does": "Removes unused software and services, closes ports, enforces a secure baseline, patches and turns on logging.", "where": "Applied with CIS Benchmarks, Group Policy, or configuration management tools."}, {"id": "11-operating-system-os-concepts-file-structure", "t": "File structure", "what": "How the OS organizes folders and files.", "does": "Knowing the layout tells you where to look for evidence and where attackers stage files.", "where": "Linux: <code>/etc<\/code> config, <code>/var/log<\/code> logs, <code>/home<\/code> users, <code>/tmp<\/code> temporary. Windows: <code>C:/Windows/System32<\/code>, user profiles, <code>%TEMP%<\/code>.", "kids": [{"id": "11-file-structure-configuration-file-locations", "t": "Configuration file locations", "what": "Where settings are stored as files.", "does": "Changes here are evidence of tampering or misconfiguration.", "where": "Linux: <code>/etc/passwd<\/code>, <code>/etc/shadow<\/code>, <code>/etc/ssh/sshd_config<\/code>, <code>/etc/crontab<\/code>. Windows: the Registry, plus the hosts file in <code>System32/drivers/etc<\/code>."}]}, {"id": "11-operating-system-os-concepts-system-processes", "t": "System processes", "what": "Programs running on a host.", "does": "Knowing normal processes, their parents and paths exposes impostors.", "where": "Windows: Task Manager, <code>tasklist<\/code>. Linux: <code>ps<\/code>, <code>top<\/code>.", "trap": "Right name, wrong folder or wrong parent (svchost.exe started by Word) is a malicious process."}, {"id": "11-operating-system-os-concepts-hardware-architectu", "t": "Hardware architecture", "what": "The physical building blocks: CPU, memory, storage, firmware, TPM.", "does": "Hardware features enable protections such as Secure Boot, TPM-backed encryption, DEP and secure enclaves.", "where": "On the motherboard and in firmware (UEFI)."}]}, {"id": "11-infrastructure-concepts", "t": "Infrastructure concepts", "what": "The ways compute is delivered: physical servers, virtual machines, containers and serverless functions.", "does": "Changes what you manage, what can go wrong and what evidence exists.", "kids": [{"id": "11-infrastructure-concepts-serverless", "t": "Serverless", "what": "Code run by a cloud provider on demand, with no server for you to manage.", "does": "Runs a function when triggered, then stops. You secure the code and its permissions.", "where": "In the provider&rsquo;s cloud (AWS Lambda, Azure Functions). Evidence is the provider&rsquo;s logs; there is no host to image."}, {"id": "11-infrastructure-concepts-virtualization", "t": "Virtualization", "what": "Running several complete operating systems on one physical host through a hypervisor.", "does": "Isolates workloads and lets you snapshot a VM for forensics.", "where": "Type 1 hypervisors run on bare metal (ESXi, Hyper-V); Type 2 run on top of an OS (VirtualBox).", "trap": "VM escape is the key risk: breaking out of a guest to reach the host."}, {"id": "11-infrastructure-concepts-containerization", "t": "Containerization", "what": "Packaging an app with its dependencies so it runs the same anywhere, sharing the host&rsquo;s kernel.", "does": "Starts fast and scales easily; containers are usually short-lived.", "where": "Docker hosts and orchestrators such as Kubernetes.", "trap": "Containers share the host kernel, so isolation is weaker than VMs. Evidence disappears when a container is rebuilt; send logs off the host."}]}, {"id": "11-network-architecture", "t": "Network architecture", "what": "How networks are laid out and where they live.", "does": "Decides how far an attacker can move and where you can watch traffic.", "kids": [{"id": "11-network-architecture-on-premises", "t": "On-premises", "what": "Infrastructure you own and run in your own buildings.", "does": "Full control and full responsibility for every security layer.", "where": "Your data center or server rooms."}, {"id": "11-network-architecture-cloud", "t": "Cloud", "what": "Infrastructure rented from a provider.", "does": "Responsibility is shared: the provider secures the platform, you secure what you put on it.", "where": "The provider&rsquo;s data centers (AWS, Azure, GCP)."}, {"id": "11-network-architecture-hybrid", "t": "Hybrid", "what": "A mix of on-premises and cloud joined together.", "does": "Adds the connection and duplicate tooling as new risk; gaps appear at the seams.", "where": "Both places, linked by VPN or dedicated circuits."}, {"id": "11-network-architecture-network-segmentation", "t": "Network segmentation", "what": "Splitting a network into zones with controlled paths between them.", "does": "Limits lateral movement and narrows audit scope, such as isolating cardholder systems.", "where": "Enforced with VLANs, subnets, firewalls and a screened subnet (DMZ) for public servers."}, {"id": "11-network-architecture-zero-trust", "t": "Zero trust", "what": "A model that never trusts a request because of where it comes from.", "does": "Verifies identity, device health and context on every request and gives least privilege per session.", "where": "A policy decision point decides; a policy enforcement point (gateway, proxy, agent) allows or blocks.", "trap": "Trusting a user because they are on the internal network is the opposite of zero trust.", "flow": ["User / device", "*Policy enforcement point", "Policy decision point checks", "Resource"]}, {"id": "11-network-architecture-secure-access-service-edge-", "t": "Secure access service edge (SASE)", "what": "Networking and security delivered together as one cloud service.", "does": "Combines SD-WAN with cloud security (SWG, CASB, ZTNA, firewall) close to wherever users are.", "where": "In the provider&rsquo;s cloud points of presence."}, {"id": "11-network-architecture-software-defined-networking", "t": "Software-defined networking (SDN)", "what": "Separating the network&rsquo;s control plane (decides paths) from the data plane (forwards packets).", "does": "Lets you change routing and segmentation centrally in software, even during an incident.", "where": "A central controller programs switches through APIs.", "trap": "SDN is about separating control and data planes; a cloud-delivered security stack is SASE."}]}, {"id": "11-identity-and-access-management-iam", "t": "Identity and access management (IAM)", "what": "Controlling who someone is and what they can do.", "does": "Covers accounts, authentication, authorization and access reviews.", "where": "Identity providers such as Active Directory and Entra ID; cloud IAM policies.", "kids": [{"id": "11-identity-and-access-management-iam-multifactor-a", "t": "Multifactor authentication (MFA)", "what": "Login using two or more different factor types: something you know, have or are.", "does": "Stops most attacks that rely on stolen passwords.", "trap": "A password plus a security question is still one factor (both are something you know)."}, {"id": "11-identity-and-access-management-iam-single-sign-o", "t": "Single sign-on (SSO)", "what": "One login that gives access to many applications in the same organization.", "does": "Fewer passwords and one strong login; but one stolen session opens everything.", "where": "An identity provider issues tokens that each app trusts."}, {"id": "11-identity-and-access-management-iam-federation", "t": "Federation", "what": "Trust between separate organizations so one can vouch for another&rsquo;s users.", "does": "Users sign in with their home identity to a partner&rsquo;s service. Uses SAML or OpenID Connect.", "trap": "SSO is within one organization; federation crosses organizations."}, {"id": "11-identity-and-access-management-iam-privileged-ac", "t": "Privileged access management (PAM)", "what": "Controls for admin and other powerful accounts.", "does": "Vaults credentials, grants admin rights only when needed, records sessions and rotates passwords.", "where": "A PAM vault and session gateway in front of servers."}, {"id": "11-identity-and-access-management-iam-passwordless", "t": "Passwordless", "what": "Signing in with no password: FIDO2 security keys, passkeys, biometrics.", "does": "Removes the shared secret, so phishing and password spraying stop working."}, {"id": "11-identity-and-access-management-iam-cloud-access-", "t": "Cloud access security broker (CASB)", "what": "A control point between users and cloud apps.", "does": "Finds shadow IT, enforces policy and applies DLP to SaaS.", "where": "Inline as a proxy, or connected to cloud apps by API."}]}, {"id": "11-encryption", "t": "Encryption", "what": "Scrambling data so only key holders can read it.", "does": "Protects data in transit and at rest.", "kids": [{"id": "11-encryption-public-key-infrastructure-pki", "t": "Public key infrastructure (PKI)", "what": "The system of certificate authorities, certificates and keys that proves identities.", "does": "Issues, renews and revokes certificates so strangers can trust each other&rsquo;s keys.", "where": "Root CA (offline) signs intermediate CAs, which sign server and user certificates. Revocation via CRL or OCSP.", "flow": ["*Root CA", "Intermediate CA", "Server / user certificate"]}, {"id": "11-encryption-secure-sockets-layer-ssl-inspection", "t": "Secure sockets layer (SSL) inspection", "what": "Decrypting encrypted traffic at a proxy or firewall to inspect it, then re-encrypting it.", "does": "Lets security tools see malware and data leaks hidden inside HTTPS.", "where": "On a next-generation firewall or proxy; clients must trust its certificate.", "trap": "The protocol being inspected today is TLS. Privacy-sensitive sites (banking, health) are usually exempted."}]}, {"id": "11-sensitive-data-protection", "t": "Sensitive data protection", "what": "Finding, classifying and guarding data that would cause harm if exposed.", "does": "Meets legal duties and reduces breach impact.", "kids": [{"id": "11-sensitive-data-protection-data-loss-prevention-d", "t": "Data loss prevention (DLP)", "what": "Tools that spot sensitive data and stop it leaving.", "does": "Blocks, warns or logs when card numbers, PII or confidential files are emailed, uploaded or copied.", "where": "Endpoint agents, email and web gateways, and cloud (often through a CASB).", "trap": "Stopping data being sent out wants DLP. Encryption only protects it after it is stolen."}, {"id": "11-sensitive-data-protection-personally-identifiabl", "t": "Personally identifiable information (PII)", "what": "Information that identifies a person, alone or combined.", "does": "Triggers privacy laws such as GDPR and breach-notification duties."}, {"id": "11-sensitive-data-protection-cardholder-data-chd", "t": "Cardholder data (CHD)", "what": "Payment card data: card number with name, expiry and service code.", "does": "Governed by PCI DSS; full track data, CVV and PIN must never be stored after authorization."}]}]}, {"o": "1.2", "title": "Given a scenario, analyze indicators of potentially malicious activity.", "items": [{"id": "12-network-related", "t": "Network-related", "what": "Signs of an attack seen in network traffic.", "does": "Point to scanning, command and control, spread or theft.", "where": "Seen in NetFlow, firewall and proxy logs, IDS alerts and packet captures.", "kids": [{"id": "12-network-related-bandwidth-consumption", "t": "Bandwidth consumption", "what": "Unusually heavy use of network capacity.", "does": "Can mean data being stolen, cryptomining or a DoS."}, {"id": "12-network-related-beaconing", "t": "Beaconing", "what": "Small, regular check-ins from a host to one outside address.", "does": "Malware asking its command server for instructions.", "trap": "Regular timing is the clue, not size. A beacon can be tiny."}, {"id": "12-network-related-irregular-peer-to-peer", "t": "Irregular peer-to-peer", "what": "Workstations talking directly to each other.", "does": "Suggests lateral movement or a worm, since PCs normally talk to servers."}, {"id": "12-network-related-rogue-devices-on-the-network", "t": "Rogue devices on the network", "what": "Hardware that isn&rsquo;t authorized, such as an unknown laptop or wireless access point.", "does": "Can bridge attackers in or capture traffic. Spotted by NAC, DHCP logs or wireless scans."}, {"id": "12-network-related-scans-sweeps", "t": "Scans/sweeps", "what": "Probing many ports on one host (scan) or one port on many hosts (sweep).", "does": "Reconnaissance. Seen from inside, it usually means someone already has a foothold."}, {"id": "12-network-related-unusual-traffic-spikes", "t": "Unusual traffic spikes", "what": "Sudden departures from the normal traffic baseline.", "does": "Can signal DoS, exfiltration or a misconfiguration; needs a baseline to judge."}, {"id": "12-network-related-activity-on-unexpected-ports", "t": "Activity on unexpected ports", "what": "Services on non-standard ports, or a port carrying the wrong protocol.", "does": "Attackers hide command and control or tunnels this way."}]}, {"id": "12-host-related", "t": "Host-related", "what": "Signs of compromise on a single computer.", "does": "Point to malware, persistence or misuse on that machine.", "where": "Seen in EDR, Event Viewer, Task Manager, file and registry monitoring.", "kids": [{"id": "12-host-related-processor-consumption", "t": "Processor consumption", "what": "Sustained high CPU with no user activity.", "does": "Often cryptomining or password cracking."}, {"id": "12-host-related-memory-consumption", "t": "Memory consumption", "what": "Unexplained memory growth.", "does": "Can mean injected code or a malicious process; capture memory before rebooting."}, {"id": "12-host-related-drive-capacity-consumption", "t": "Drive capacity consumption", "what": "Disk space disappearing quickly.", "does": "Data being staged for theft or logs being flooded."}, {"id": "12-host-related-unauthorized-software", "t": "Unauthorized software", "what": "Programs nobody approved.", "does": "Remote-access tools, hacking tools or malware; application allowlisting prevents it."}, {"id": "12-host-related-malicious-processes", "t": "Malicious processes", "what": "Processes doing harm, often disguised as system ones.", "does": "Check name, path, parent and signature together."}, {"id": "12-host-related-unauthorized-changes", "t": "Unauthorized changes", "what": "Settings or files changed without an approved change record.", "does": "Points to tampering; file integrity monitoring (FIM) catches it."}, {"id": "12-host-related-unauthorized-privileges", "t": "Unauthorized privileges", "what": "Accounts with more rights than they should have.", "does": "Sign of privilege escalation or a backdoor admin account."}, {"id": "12-host-related-data-exfiltration", "t": "Data exfiltration", "what": "Data being moved out of the organization without permission.", "does": "Large or after-hours outbound transfers, archives in temp folders, uploads to unusual sites."}, {"id": "12-host-related-abnormal-os-process-behavior", "t": "Abnormal OS process behavior", "what": "A legitimate process acting out of character.", "does": "For example Word starting PowerShell, or a browser making connections it never makes."}, {"id": "12-host-related-file-system-changes-or-anomalies", "t": "File system changes or anomalies", "what": "New, renamed, hidden or altered files.", "does": "Dropped malware, web shells, encrypted files from ransomware."}, {"id": "12-host-related-registry-changes-or-anomalies", "t": "Registry changes or anomalies", "what": "New or modified Registry values.", "does": "Often persistence in Run keys or services."}, {"id": "12-host-related-unauthorized-scheduled-tasks", "t": "Unauthorized scheduled tasks", "what": "Scheduled tasks or cron jobs nobody created.", "does": "Persistence that relaunches malware at logon or on a timer.", "where": "Windows Task Scheduler (<code>schtasks<\/code>); Linux <code>crontab<\/code>."}]}, {"id": "12-application-related", "t": "Application-related", "what": "Signs of attack seen in how applications behave.", "does": "Point to exploitation of apps or misuse of accounts.", "where": "Seen in application, web server and database logs.", "kids": [{"id": "12-application-related-anomalous-activity", "t": "Anomalous activity", "what": "App use that departs from normal.", "does": "Odd times, unusual volumes or functions a user never uses."}, {"id": "12-application-related-introduction-of-new-accounts", "t": "Introduction of new accounts", "what": "Accounts appearing unexpectedly, especially admin ones.", "does": "Attacker persistence or privilege escalation."}, {"id": "12-application-related-unexpected-output", "t": "Unexpected output", "what": "An app returning things it shouldn&rsquo;t, such as database errors or other users&rsquo; data.", "does": "Sign of injection or broken access control."}, {"id": "12-application-related-unexpected-outbound-communic", "t": "Unexpected outbound communication", "what": "An app or server connecting out to places it never contacts.", "does": "Command and control, or a web shell phoning home."}, {"id": "12-application-related-service-interruption", "t": "Service interruption", "what": "An app crashing or becoming unavailable.", "does": "Could be DoS, exploitation attempts or ransomware."}, {"id": "12-application-related-application-logs", "t": "Application logs", "what": "Records an application writes about its own activity.", "does": "Source for errors, logins and transactions during an investigation.", "where": "Web server access and error logs, database logs, app-specific logs."}]}, {"id": "12-other", "t": "Other", "what": "Indicators that don&rsquo;t fit network, host or application.", "does": "Mostly attacks on people.", "kids": [{"id": "12-other-social-engineering-attacks", "t": "Social engineering attacks", "what": "Manipulating people into giving access or information.", "does": "Phishing, pretexting, vishing and tailgating bypass technical controls."}, {"id": "12-other-obfuscated-links", "t": "Obfuscated links", "what": "Links disguised to hide where they really go.", "does": "URL shorteners, lookalike characters and misleading link text lead to phishing or malware sites.", "trap": "Check the real destination (hover or expand it), not the text shown."}]}]}, {"o": "1.3", "title": "Given a scenario, use appropriate tools or techniques to determine malicious activity.", "items": [{"id": "13-packet-capture", "t": "Packet capture", "what": "Recording the actual network traffic.", "does": "Shows exactly what crossed the wire, not just that a connection happened.", "where": "Captured on a host, a SPAN port or a network tap; saved as .pcap files.", "kids": [{"id": "13-packet-capture-wireshark", "t": "Wireshark", "what": "A graphical packet analyzer.", "does": "Dissects protocols, filters traffic and reassembles streams (Follow TCP Stream).", "where": "Desktop app on the analyst&rsquo;s machine; opens .pcap files."}, {"id": "13-packet-capture-tcpdump", "t": "tcpdump", "what": "A command-line packet capture tool.", "does": "Captures and filters traffic and writes it to a file: <code>tcpdump -i eth0 port 22 -w ssh.pcap<\/code>.", "where": "Linux and Unix servers, often over SSH."}]}, {"id": "13-log-analysis-correlation", "t": "Log analysis/correlation", "what": "Reviewing logs and linking related events across sources.", "does": "Turns many separate entries into one picture of an attack.", "kids": [{"id": "13-log-analysis-correlation-security-information-an", "t": "Security information and event management (SIEM)", "what": "Software that gathers logs from every system into one searchable place.", "does": "Collects, normalizes, correlates, alerts and keeps history.", "where": "A central server or cloud service fed by agents, syslog (514, or 6514 with TLS) and APIs.", "trap": "SIEM detects and alerts. SOAR acts.", "flow": ["Sources", "Agents / syslog / APIs", "*SIEM", "SOAR / analyst"]}, {"id": "13-log-analysis-correlation-security-orchestration-", "t": "Security orchestration, automation, and response (SOAR)", "what": "A platform that runs response steps automatically through playbooks.", "does": "Enriches alerts, isolates hosts, blocks IPs and opens tickets in seconds.", "where": "Connected to the SIEM, EDR, firewall and ticketing through APIs."}]}, {"id": "13-endpoint-security", "t": "Endpoint security", "what": "Protection running on each device.", "does": "Detects and stops threats on the host itself.", "kids": [{"id": "13-endpoint-security-endpoint-detection-and-respons", "t": "Endpoint detection and response (EDR)", "what": "An agent that records and analyzes activity on each endpoint.", "does": "Detects suspicious behavior, keeps a history of processes and connections, and can isolate the host.", "where": "Agent on every endpoint, reporting to a central console.", "trap": "EDR catches behavior that signature antivirus misses (fileless and living-off-the-land attacks)."}]}, {"id": "13-domain-name-service-dns-and-internet-protocol-ip", "t": "Domain name service (DNS) and Internet Protocol (IP) reputation", "what": "Checking whether a domain or IP has a bad history.", "does": "Helps decide quickly if an address in an alert is malicious.", "kids": [{"id": "13-domain-name-service-dns-and-internet-protocol-ip-2", "t": "WHOIS", "what": "Registration records for domains and IP blocks.", "does": "Shows owner, registrar and creation date. A domain registered days ago is suspicious.", "where": "Command line <code>whois example.com<\/code> or web lookups."}, {"id": "13-domain-name-service-dns-and-internet-protocol-ip-3", "t": "AbuseIPDB", "what": "A community database of reported malicious IP addresses.", "does": "Shows how often and why an IP was reported.", "where": "Website and API."}]}, {"id": "13-file-analysis", "t": "File analysis", "what": "Examining a suspicious file to judge whether it is malicious.", "does": "Identifies malware without, or before, running it.", "kids": [{"id": "13-file-analysis-strings", "t": "Strings", "what": "A tool that pulls readable text out of a binary.", "does": "Reveals URLs, IPs, commands and file paths inside a sample.", "where": "Linux <code>strings<\/code>; Sysinternals Strings on Windows."}, {"id": "13-file-analysis-virustotal", "t": "VirusTotal", "what": "A site that scans a file or hash with dozens of antivirus engines.", "does": "Gives a quick verdict and history.", "where": "Website and API.", "trap": "Submit the hash first. Uploading a sensitive file shares it publicly."}]}, {"id": "13-sandboxing", "t": "Sandboxing", "what": "Running a suspicious file in an isolated environment.", "does": "Watches what it does (files, registry, network) without risking real systems.", "where": "An isolated VM or a cloud sandbox service.", "kids": [{"id": "13-sandboxing-joe-sandbox", "t": "Joe Sandbox", "what": "A commercial malware analysis sandbox.", "does": "Runs samples and produces a detailed behavior report.", "where": "Cloud service or on-premises."}, {"id": "13-sandboxing-cuckoo-sandbox", "t": "Cuckoo Sandbox", "what": "An open-source automated malware sandbox.", "does": "Detonates samples in VMs and reports behavior.", "where": "Self-hosted on your own analysis machine."}]}, {"id": "13-pattern-recognition", "t": "Pattern recognition", "what": "Spotting known shapes of malicious activity in data.", "does": "Lets you recognize an attack from its pattern even without a signature.", "kids": [{"id": "13-pattern-recognition-command-and-control-c2", "t": "Command and control (C2)", "what": "The channel an attacker uses to control compromised hosts.", "does": "Beaconing at regular intervals, odd DNS (long random subdomains), traffic to new or random-looking domains."}]}, {"id": "13-interpreting-suspicious-commands", "t": "Interpreting suspicious commands", "what": "Reading command lines and deciding if they are malicious.", "does": "Catches attackers using built-in tools: encoded PowerShell, downloads into memory, new admin accounts, reverse shells.", "where": "Seen in command-line logging (Windows Event 4688, PowerShell 4104), EDR and shell history."}, {"id": "13-email-analysis", "t": "Email analysis", "what": "Checking emails for signs of phishing and spoofing.", "does": "Confirms whether a message is genuine and where it really came from.", "kids": [{"id": "13-email-analysis-header", "t": "Header", "what": "The routing and metadata lines of an email.", "does": "Shows the real path and sender. Read Received lines bottom-up; compare From, Reply-To and Return-Path."}, {"id": "13-email-analysis-impersonation", "t": "Impersonation", "what": "Pretending to be a trusted sender.", "does": "Display-name spoofing and lookalike domains trick users into trusting the message."}, {"id": "13-email-analysis-domainkeys-identified-mail-dkim", "t": "DomainKeys Identified Mail (DKIM)", "what": "A digital signature added to outgoing mail.", "does": "Proves the message came from the domain and wasn&rsquo;t changed.", "where": "Signature in the header; public key in DNS."}, {"id": "13-email-analysis-domain-based-message-authenticati", "t": "Domain-based Message Authentication, Reporting, and Conformance (DMARC)", "what": "A domain&rsquo;s policy for mail that fails SPF or DKIM checks.", "does": "Tells receivers to do nothing, quarantine or reject, and where to send reports.", "where": "A DNS TXT record at <code>_dmarc.domain<\/code>."}, {"id": "13-email-analysis-sender-policy-framework-spf", "t": "Sender Policy Framework (SPF)", "what": "A list of servers allowed to send mail for a domain.", "does": "Lets receivers reject mail from unlisted servers.", "where": "A DNS TXT record on the domain.", "trap": "SPF checks the sending server, DKIM checks the signature, DMARC says what to do when they fail."}, {"id": "13-email-analysis-embedded-links", "t": "Embedded links", "what": "Links inside the email body.", "does": "May lead to phishing pages; the shown text can differ from the real URL."}]}, {"id": "13-hashing", "t": "Hashing", "what": "Creating a fixed fingerprint of a file with SHA-256 or similar.", "does": "Identifies known malware and proves a file hasn&rsquo;t changed.", "where": "<code>Get-FileHash<\/code> in PowerShell, <code>sha256sum<\/code> on Linux."}, {"id": "13-user-behavior-analysis", "t": "User behavior analysis", "what": "Comparing what accounts do against their normal patterns.", "does": "Finds compromised accounts and insiders.", "where": "UEBA features in SIEM and identity platforms.", "kids": [{"id": "13-user-behavior-analysis-abnormal-account-activity", "t": "Abnormal account activity", "what": "An account behaving unusually.", "does": "Odd login times, unusual data access, sudden privilege use."}, {"id": "13-user-behavior-analysis-impossible-travel", "t": "Impossible travel", "what": "Logins from places too far apart for the time between them.", "does": "One of the sessions is not the real user.", "trap": "A VPN exit node can cause a false alarm; check before acting."}]}, {"id": "13-programming-languages-scripting", "t": "Programming languages/scripting", "what": "Code and data formats an analyst must be able to read.", "does": "Lets you understand scripts, logs and tool output during investigations.", "kids": [{"id": "13-programming-languages-scripting-javascript-objec", "t": "JavaScript Object Notation (JSON)", "what": "A text format of name/value pairs in braces.", "does": "Used for API data, cloud logs and SIEM events."}, {"id": "13-programming-languages-scripting-extensible-marku", "t": "Extensible Markup Language (XML)", "what": "A tagged text data format.", "does": "Used for SAML assertions, Windows event exports and some APIs; target of XXE attacks."}, {"id": "13-programming-languages-scripting-python", "t": "Python", "what": "A general-purpose scripting language.", "does": "Used to automate analysis and build tools; also used by attackers for reverse shells."}, {"id": "13-programming-languages-scripting-powershell", "t": "PowerShell", "what": "Windows&rsquo; shell and scripting language.", "does": "Automates admin work; attackers abuse it for in-memory downloads and encoded commands."}, {"id": "13-programming-languages-scripting-shell-script", "t": "Shell script", "what": "Scripts for Unix shells such as bash.", "does": "Automates Linux tasks; attackers use them to download and run payloads."}, {"id": "13-programming-languages-scripting-regular-expressi", "t": "Regular expressions", "what": "Patterns for matching text.", "does": "Find IPs, emails or encoded commands in logs, and power SIEM and DLP rules."}]}]}, {"o": "1.4", "title": "Compare and contrast threat-intelligence and threat-hunting concepts.", "items": [{"id": "14-threat-actors", "t": "Threat actors", "what": "The people and groups behind attacks.", "does": "Knowing their motives and skills predicts what they will target and how.", "kids": [{"id": "14-threat-actors-advanced-persistent-threat-apt", "t": "Advanced persistent threat (APT)", "what": "A skilled, well-funded group that gets in and stays hidden for a long time.", "does": "Steals data or spies over months; often state-backed."}, {"id": "14-threat-actors-hacktivists", "t": "Hacktivists", "what": "Attackers driven by a political or social cause.", "does": "Defacements, leaks and DDoS to make a point."}, {"id": "14-threat-actors-organized-crime", "t": "Organized crime", "what": "Criminal groups attacking for money.", "does": "Ransomware, fraud and data theft for sale."}, {"id": "14-threat-actors-nation-state", "t": "Nation-state", "what": "Attackers working for a government.", "does": "Espionage and sabotage with large resources."}, {"id": "14-threat-actors-script-kiddie", "t": "Script kiddie", "what": "Low-skill attackers using other people&rsquo;s tools.", "does": "Opportunistic attacks for curiosity or status."}, {"id": "14-threat-actors-insider-threat", "t": "Insider threat", "what": "Risk from people inside the organization.", "does": "They already have access, so perimeter controls don&rsquo;t stop them.", "kids": [{"id": "14-insider-threat-intentional", "t": "Intentional", "what": "An insider harming the organization on purpose.", "does": "Theft or sabotage; detected with monitoring, least privilege and DLP."}, {"id": "14-insider-threat-unintentional", "t": "Unintentional", "what": "An insider causing harm by mistake.", "does": "Clicking a phishing link or misdirecting data; reduced with training and guardrails."}]}, {"id": "14-threat-actors-supply-chain", "t": "Supply chain", "what": "Attacks that come through a trusted supplier.", "does": "Compromised software updates, service providers or hardware reach you through trust."}]}, {"id": "14-tactics-techniques-and-procedures-ttp", "t": "Tactics, techniques, and procedures (TTP)", "what": "How an attacker operates: goals (tactics), methods (techniques) and specific steps (procedures).", "does": "Detections built on behavior last longer than ones built on hashes or IPs.", "where": "Catalogued in MITRE ATT&amp;CK."}, {"id": "14-confidence-levels", "t": "Confidence levels", "what": "How much you can trust a piece of intelligence.", "does": "Decides whether to act on it.", "kids": [{"id": "14-confidence-levels-timeliness", "t": "Timeliness", "what": "Is it still current?", "does": "Old indicators may now belong to innocent owners."}, {"id": "14-confidence-levels-relevancy", "t": "Relevancy", "what": "Does it apply to your sector and technology?", "does": "Intelligence about systems you don&rsquo;t run is noise."}, {"id": "14-confidence-levels-accuracy", "t": "Accuracy", "what": "Is it correct and confirmed?", "does": "Wrong intelligence causes false alarms or blocks good traffic."}]}, {"id": "14-collection-methods-and-sources", "t": "Collection methods and sources", "what": "Where threat intelligence comes from.", "does": "A mix of sources gives better coverage.", "kids": [{"id": "14-collection-methods-and-sources-open-source", "t": "Open source", "what": "Freely available public intelligence (OSINT).", "does": "Broad and free, but noisy and visible to attackers too.", "kids": [{"id": "14-open-source-social-media", "t": "Social media", "what": "Public posts and accounts.", "does": "Early warnings, leaked data and attacker chatter."}, {"id": "14-open-source-blogs-forums", "t": "Blogs/forums", "what": "Researcher write-ups and community discussions.", "does": "Detailed analyses and indicators."}, {"id": "14-open-source-government-bulletins", "t": "Government bulletins", "what": "Advisories from agencies such as CISA.", "does": "Authoritative alerts, including the Known Exploited Vulnerabilities catalog."}, {"id": "14-open-source-computer-emergency-response-team-cer", "t": "Computer emergency response team (CERT)", "what": "National or sector teams that coordinate response.", "does": "Publish advisories and coordinate fixes."}, {"id": "14-open-source-cybersecurity-incident-response-team", "t": "Cybersecurity incident response team (CSIRT)", "what": "An organization&rsquo;s incident response team.", "does": "Shares findings from incidents it handles."}, {"id": "14-open-source-deep-dark-web", "t": "Deep/dark web", "what": "Hidden sites and markets.", "does": "Shows stolen data for sale and planned attacks."}]}, {"id": "14-collection-methods-and-sources-closed-source", "t": "Closed source", "what": "Intelligence that is paid for or restricted.", "does": "More targeted and timely.", "kids": [{"id": "14-closed-source-paid-feeds", "t": "Paid feeds", "what": "Commercial threat intelligence subscriptions.", "does": "Curated indicators and reports."}, {"id": "14-closed-source-information-sharing-organizations", "t": "Information sharing organizations", "what": "Industry groups such as ISACs.", "does": "Members share threats specific to their sector."}, {"id": "14-closed-source-internal-sources", "t": "Internal sources", "what": "Your own logs, incidents and telemetry.", "does": "The most relevant intelligence because it is about your environment."}]}]}, {"id": "14-threat-intelligence-sharing", "t": "Threat intelligence sharing", "what": "Getting intelligence to the teams that can use it.", "does": "Intelligence that stays with the intel team changes nothing.", "kids": [{"id": "14-threat-intelligence-sharing-incident-response", "t": "Incident response", "what": "The team handling incidents.", "does": "Uses intelligence to scope and contain attacks faster."}, {"id": "14-threat-intelligence-sharing-vulnerability-manage", "t": "Vulnerability management", "what": "The team running scanning and patching.", "does": "Uses it to prioritize vulnerabilities being exploited now."}, {"id": "14-threat-intelligence-sharing-risk-management", "t": "Risk management", "what": "The function assessing business risk.", "does": "Uses it to judge likelihood realistically."}, {"id": "14-threat-intelligence-sharing-security-engineering", "t": "Security engineering", "what": "The team building defenses.", "does": "Uses it to design controls against real attacker methods."}, {"id": "14-threat-intelligence-sharing-detection-and-monito", "t": "Detection and monitoring", "what": "The SOC watching for threats.", "does": "Turns intelligence into detection rules and watchlists."}]}, {"id": "14-threat-hunting", "t": "Threat hunting", "what": "Proactively searching for attackers already hiding in your network.", "does": "Finds what automated alerts missed. It starts with a hypothesis.", "where": "Uses SIEM, EDR and network data.", "flow": ["*Hypothesis", "Collect data", "Analyze", "Find and remove", "New detections"], "kids": [{"id": "14-threat-hunting-indicators-of-compromise-ioc", "t": "Indicators of compromise (IoC)", "what": "Evidence that a compromise has happened: hashes, IPs, domains, file names.", "does": "Gives hunters and tools something concrete to look for.", "kids": [{"id": "14-indicators-of-compromise-ioc-collection", "t": "Collection", "what": "Gathering IoCs.", "does": "From incidents, feeds and sharing groups."}, {"id": "14-indicators-of-compromise-ioc-analysis", "t": "Analysis", "what": "Checking IoCs for quality and relevance.", "does": "Removes stale or irrelevant indicators."}, {"id": "14-indicators-of-compromise-ioc-application", "t": "Application", "what": "Putting IoCs to use.", "does": "Loads them into SIEM, EDR, firewalls and DNS filters."}]}, {"id": "14-threat-hunting-focus-areas", "t": "Focus areas", "what": "Where hunts concentrate.", "does": "Places where attackers hide or where damage would be worst.", "kids": [{"id": "14-focus-areas-configurations-misconfigurations", "t": "Configurations/misconfigurations", "what": "Weak or drifted settings.", "does": "What attackers exploit to get in or stay in."}, {"id": "14-focus-areas-isolated-networks", "t": "Isolated networks", "what": "Segments that get little monitoring.", "does": "Attackers hide where nobody looks."}, {"id": "14-focus-areas-business-critical-assets-and-process", "t": "Business-critical assets and processes", "what": "The systems that matter most.", "does": "Where a compromise would hurt most."}]}, {"id": "14-threat-hunting-active-defense", "t": "Active defense", "what": "Raising the attacker&rsquo;s cost inside your own network.", "does": "Deception, decoys and making attacker progress slow and noisy.", "trap": "Active defense stays inside your own network. Attacking back at attacker systems is illegal."}, {"id": "14-threat-hunting-honeypot", "t": "Honeypot", "what": "A decoy system with no real purpose, there to attract attackers.", "does": "Any interaction is suspicious; lets you study attacker TTPs safely.", "where": "Placed in the DMZ or internal network, isolated from real data."}]}]}, {"o": "1.5", "title": "Explain the importance of efficiency and process improvement in security operations.", "items": [{"id": "15-standardize-processes", "t": "Standardize processes", "what": "Writing down one agreed way to handle each common task.", "does": "Makes responses consistent, reduces mistakes and shows what can be automated.", "kids": [{"id": "15-standardize-processes-identification-of-tasks-su", "t": "Identification of tasks suitable for automation", "what": "Picking which tasks a machine should do.", "does": "Automates the routine work so analysts focus on judgment.", "kids": [{"id": "15-identification-of-tasks-suitable-for-automation-", "t": "Repeatable/do not require human interaction", "what": "Tasks with the same steps every time and no judgment call.", "does": "Best candidates: enrichment lookups, ticket creation, blocking known-bad indicators."}]}, {"id": "15-standardize-processes-team-coordination-to-manag", "t": "Team coordination to manage and facilitate automation", "what": "Security, IT and engineering agreeing on what to automate.", "does": "Prevents automation that breaks systems or acts on false positives."}]}, {"id": "15-streamline-operations", "t": "Streamline operations", "what": "Removing wasted effort from the SOC.", "does": "Speeds up response and reduces analyst fatigue.", "kids": [{"id": "15-streamline-operations-automation-and-orchestrati", "t": "Automation and orchestration", "what": "Automation does one task; orchestration links tasks across tools into a workflow.", "does": "Turns many manual steps into one consistent response.", "kids": [{"id": "15-automation-and-orchestration-security-orchestrat", "t": "Security orchestration, automation, and response (SOAR)", "what": "A platform that runs playbooks across security tools.", "does": "Responds to alerts in seconds and records every step.", "where": "Connected to SIEM, EDR, firewall and ticketing through APIs."}]}, {"id": "15-streamline-operations-orchestrating-threat-intel", "t": "Orchestrating threat intelligence data", "what": "Feeding intelligence into tools automatically.", "does": "Gives analysts context without manual lookups.", "kids": [{"id": "15-orchestrating-threat-intelligence-data-data-enri", "t": "Data enrichment", "what": "Adding context to an alert automatically.", "does": "Attaches reputation, location, WHOIS and history to IPs and domains."}, {"id": "15-orchestrating-threat-intelligence-data-threat-fe", "t": "Threat feed combination", "what": "Merging several intelligence feeds.", "does": "Better coverage, and indicators seen in several feeds are more trustworthy."}]}, {"id": "15-streamline-operations-minimize-human-engagement", "t": "Minimize human engagement", "what": "Letting machines do the repetitive work.", "does": "Frees analysts for investigations that need judgment."}]}, {"id": "15-technology-and-tool-integration", "t": "Technology and tool integration", "what": "Connecting security tools so they share data and actions.", "does": "Removes manual copying between consoles.", "kids": [{"id": "15-technology-and-tool-integration-application-prog", "t": "Application programming interface (API)", "what": "A defined way for one program to ask another for data or actions.", "does": "How SOAR, SIEM and EDR talk to each other.", "where": "Usually REST over HTTPS returning JSON."}, {"id": "15-technology-and-tool-integration-webhooks", "t": "Webhooks", "what": "A program calling a URL to notify another the moment something happens.", "does": "Pushes events instantly instead of waiting to be polled."}, {"id": "15-technology-and-tool-integration-plugins", "t": "Plugins", "what": "Add-ons that extend a tool from inside.", "does": "Adds integrations or features the tool didn&rsquo;t ship with."}]}, {"id": "15-single-pane-of-glass", "t": "Single pane of glass", "what": "One console showing data from many tools.", "does": "Analysts stop switching screens and miss less; the trade-off is a single point of failure for visibility."}]}, {"o": "2.1", "title": "Given a scenario, implement vulnerability scanning methods and concepts.", "items": [{"id": "21-asset-discovery", "t": "Asset discovery", "what": "Finding every device, service and application you own before you scan it for weaknesses.", "does": "Builds the inventory that scanning, patching and risk scoring depend on. You can&rsquo;t protect what you don&rsquo;t know exists.", "where": "Discovery runs from a scanner on the network, from agents on hosts, and from cloud provider APIs that list instances.", "trap": "Asset discovery comes first. A question asking for the first step of a vulnerability program usually wants an inventory, not a scan.", "kids": [{"id": "21-asset-discovery-map-scans", "t": "Map scans", "what": "A sweep across address ranges to find which hosts are alive and which ports they have open.", "does": "Draws a map of the network: live IPs, open ports, running services.", "where": "Run from a scanner host, for example <code>nmap -sn 10.0.0.0/24<\/code> for live hosts only."}, {"id": "21-asset-discovery-device-fingerprinting", "t": "Device fingerprinting", "what": "Working out what a device is (OS, vendor, version) from how it answers probes.", "does": "Compares responses such as TTL values, TCP window sizes and service banners against known patterns.", "where": "Nmap <code>-O<\/code> (OS) and <code>-sV<\/code> (service versions); the MAC vendor prefix (OUI) also hints at the maker."}]}, {"id": "21-special-considerations", "t": "Special considerations", "what": "The business limits you plan scans around so a scan doesn&rsquo;t cause the outage it is meant to prevent.", "does": "Decides when, how hard and where you scan, and what rules you must follow.", "kids": [{"id": "21-special-considerations-scheduling", "t": "Scheduling", "what": "Choosing when scans run.", "does": "Puts heavy scans in quiet hours or maintenance windows and sets how often each asset class is scanned."}, {"id": "21-special-considerations-operations", "t": "Operations", "what": "The effect a scan has on day-to-day work.", "does": "Avoids scans that interrupt production, for example by locking accounts or crashing fragile services."}, {"id": "21-special-considerations-performance", "t": "Performance", "what": "The load a scan puts on hosts and the network.", "does": "Throttles scan speed and concurrent hosts so links and servers stay responsive."}, {"id": "21-special-considerations-sensitivity-levels", "t": "Sensitivity levels", "what": "How aggressive the scan&rsquo;s checks are.", "does": "Higher sensitivity finds more but adds false positives and risk; lowering it reduces noise.", "trap": "Too many false positives? Lower the sensitivity, then validate what remains."}, {"id": "21-special-considerations-segmentation", "t": "Segmentation", "what": "Networks split into zones by firewalls and VLANs.", "does": "Means one scanner may not reach every zone, so you place scanners or agents inside each segment."}, {"id": "21-special-considerations-regulatory-requirements", "t": "Regulatory requirements", "what": "Rules from laws and standards that set scanning duties.", "does": "Can require a schedule and a scan type; PCI DSS, for example, requires quarterly internal and external scans and an approved scanning vendor (ASV) for the external ones."}]}, {"id": "21-internal-vs-external-scanning", "t": "Internal vs. external scanning", "what": "Internal scans run from inside your network; external scans come from the internet toward your public addresses.", "does": "Internal shows what an insider or an attacker who already got in could reach. External shows what anyone online can see.", "trap": "An external scan only sees what the firewall exposes. Missing internal findings in an external report is expected, not a failure.", "flow": ["Internet scanner", "*Firewall / public IPs", "Internal network", "Internal scanner"]}, {"id": "21-agent-vs-agentless", "t": "Agent vs. agentless", "what": "Agent scanning installs software on each host; agentless scanning probes hosts over the network.", "does": "Agents report from inside the host even when it is off the network (laptops, remote sites, cloud). Agentless needs nothing installed but only sees what the network exposes.", "where": "Agents live on the endpoint and report to a management server. Agentless scans run from a central scanner.", "trap": "Remote laptops, limited bandwidth or hosts that are rarely on the corporate network point to agent-based scanning."}, {"id": "21-credentialed-vs-non-credentialed", "t": "Credentialed vs. non-credentialed", "what": "A credentialed scan logs in to the target; a non-credentialed scan only looks from the outside.", "does": "Credentialed scans see installed software, patch levels and settings, so they find more with fewer false positives. Non-credentialed scans show the attacker&rsquo;s view and use fewer resources.", "where": "Credentials are stored in the scanner (Nessus, OpenVAS) and used over SMB/WMI on Windows or SSH on Linux.", "trap": "Your scan finds far more than someone else&rsquo;s scan of the same hosts? Yours was credentialed."}, {"id": "21-passive-vs-active", "t": "Passive vs. active", "what": "Active scanning sends probes to targets. Passive scanning only listens to traffic that is already flowing.", "does": "Active finds more but can disrupt fragile devices. Passive is safe for sensitive networks but only sees what talks.", "where": "Passive sensors sit on a SPAN port or network tap.", "trap": "For ICS and SCADA, prefer passive monitoring; active scans can crash controllers."}, {"id": "21-static-vs-dynamic", "t": "Static vs. dynamic", "what": "Static analysis examines code or a file without running it. Dynamic analysis runs it and watches what happens.", "does": "Static finds flaws early and points to the exact line. Dynamic finds runtime and configuration problems the code alone doesn&rsquo;t show.", "kids": [{"id": "21-static-vs-dynamic-reverse-engineering", "t": "Reverse engineering", "what": "Taking compiled software or malware apart to understand how it works.", "does": "Shows hidden behavior, flaws or indicators when you have no source code.", "where": "Done with disassemblers and debuggers (Ghidra, IDA, GDB, Immunity Debugger) in an isolated lab."}, {"id": "21-static-vs-dynamic-fuzzing", "t": "Fuzzing", "what": "Sending large amounts of malformed or random input to a program.", "does": "Triggers crashes and unexpected behavior that reveal input-handling bugs such as buffer overflows and injection.", "where": "Runs against a test copy of the app; Burp Intruder and ZAP Fuzzer do it for web apps."}]}, {"id": "21-critical-infrastructure", "t": "Critical infrastructure", "what": "Systems that run physical processes: power, water, manufacturing, transport.", "does": "Needs special care because an outage affects safety and the physical world, and many devices are old and fragile.", "kids": [{"id": "21-critical-infrastructure-operational-technology-o", "t": "Operational technology (OT)", "what": "Hardware and software that monitors and controls physical equipment.", "does": "Keeps machines and processes running; availability and safety come before confidentiality.", "where": "On plant floors and field sites, ideally separated from the IT network."}, {"id": "21-critical-infrastructure-industrial-control-syste", "t": "Industrial control systems (ICS)", "what": "The control side of OT: PLCs, HMIs and the networks connecting them.", "does": "Turns sensor readings into commands that open valves or start motors.", "where": "Uses industrial protocols such as Modbus and DNP3, which have little or no built-in security."}, {"id": "21-critical-infrastructure-supervisory-control-and-", "t": "Supervisory control and data acquisition (SCADA)", "what": "An ICS that supervises equipment spread over large areas.", "does": "Collects data from remote sites and sends commands from a central control room.", "where": "Pipelines, power grids and water systems, linked over long-distance networks.", "trap": "Scanning SCADA or ICS: active scans can disrupt them and standard tools miss OT flaws. Scan carefully or passively."}]}, {"id": "21-security-baseline-scanning", "t": "Security baseline scanning", "what": "Checking systems against an approved secure configuration.", "does": "Reports every setting that drifted from the baseline: weak passwords allowed, unneeded services, missing hardening.", "where": "Baselines come from CIS Benchmarks or internal standards; SCAP-based tools automate the check."}, {"id": "21-industry-frameworks", "t": "Industry frameworks", "what": "Published standards that tell you what to scan for and how secure systems should be.", "does": "Give scans a yardstick and give audits something to measure against.", "kids": [{"id": "21-industry-frameworks-pci-dss", "t": "PCI DSS", "full": "Payment Card Industry Data Security Standard", "what": "The card industry&rsquo;s security standard for anyone storing, processing or sending cardholder data.", "does": "Requires quarterly internal and external scans, external ones by an approved scanning vendor, plus rescans after fixes."}, {"id": "21-industry-frameworks-cis-benchmarks", "t": "CIS benchmarks", "full": "Center for Internet Security", "what": "Free, consensus-built hardening guides for operating systems, cloud and applications.", "does": "Give exact recommended settings that baseline scans compare against."}, {"id": "21-industry-frameworks-owasp", "t": "OWASP", "full": "Open Web Application Security Project (now Open Worldwide)", "what": "A nonprofit focused on web application security.", "does": "Publishes the Top 10 web risks, the Testing Guide, ASVS and the ZAP scanner."}, {"id": "21-industry-frameworks-iso-27000-series", "t": "ISO 27000 series", "full": "International Organization for Standardization", "what": "International standards for running an information security management system.", "does": "ISO 27001 sets the certifiable requirements; ISO 27002 lists the controls, including vulnerability management."}]}]}, {"o": "2.2", "title": "Given a scenario, analyze output from vulnerability assessment tools.", "items": [{"id": "22-network-scanning-and-mapping", "t": "Network scanning and mapping", "what": "Tools that find hosts and the relationships between them.", "does": "Show what is on the network and how it connects, before deeper testing.", "kids": [{"id": "22-network-scanning-and-mapping-angry-ip-scanner", "t": "Angry IP Scanner", "what": "A fast, free GUI scanner for IP ranges.", "does": "Lists live hosts, hostnames and open ports quickly.", "where": "Runs on the analyst&rsquo;s workstation (Windows, Linux, macOS)."}, {"id": "22-network-scanning-and-mapping-maltego", "t": "Maltego", "what": "An OSINT link-analysis tool.", "does": "Draws graphs connecting domains, people, emails and infrastructure from public data.", "where": "A desktop app pulling from online data sources (\"transforms\")."}]}, {"id": "22-web-application-scanners", "t": "Web application scanners", "what": "Tools that test websites and web apps for flaws.", "does": "Find injection, XSS, misconfiguration and outdated components that network scanners miss.", "kids": [{"id": "22-web-application-scanners-burp-suite", "t": "Burp Suite", "what": "An intercepting proxy and web testing toolkit from PortSwigger.", "does": "Proxy captures and edits requests; Repeater resends one by hand; Intruder sends payloads in bulk; Scanner (paid edition) finds flaws automatically.", "where": "Sits between your browser and the web app as a local proxy, usually on 127.0.0.1:8080.", "trap": "Modify a request and send it with payloads to see the response: that is Intruder.", "flow": ["Browser", "*Burp proxy", "Web app"]}, {"id": "22-web-application-scanners-zed-attack-proxy-zap", "t": "Zed Attack Proxy (ZAP)", "what": "OWASP&rsquo;s free, open-source intercepting proxy and scanner.", "does": "Does Burp&rsquo;s core jobs for free: intercept, spider, fuzz, and active and passive scans.", "where": "A local proxy on the tester&rsquo;s machine."}, {"id": "22-web-application-scanners-arachni", "t": "Arachni", "what": "An open-source web application scanner framework (no longer maintained).", "does": "Crawls a site and tests forms, links, JSON and XML input for many web vulnerabilities.", "where": "Command line or a web interface on the tester&rsquo;s machine."}, {"id": "22-web-application-scanners-nikto", "t": "Nikto", "what": "A command-line web server scanner.", "does": "Finds dangerous files, outdated server versions, default content and risky settings. Noisy, so it trips IDS.", "where": "Runs from a terminal: <code>nikto -h https://target<\/code>.", "trap": "Nikto finds web server weaknesses; it is not a SQL injection tool. Your job with its output is to confirm real issues and clear false positives."}]}, {"id": "22-vulnerability-scanners", "t": "Vulnerability scanners", "what": "Tools that check hosts against a database of known vulnerabilities.", "does": "Match versions and settings to CVEs and give each finding a severity, usually a CVSS score.", "kids": [{"id": "22-vulnerability-scanners-nessus", "t": "Nessus", "what": "Tenable&rsquo;s commercial vulnerability scanner.", "does": "Runs plugin-based checks, credentialed or not, and reports CVEs with severity and fixes.", "where": "A scanner server you manage through a web interface (port 8834)."}, {"id": "22-vulnerability-scanners-openvas", "t": "OpenVAS", "what": "The open-source vulnerability scanner from Greenbone.", "does": "Network vulnerability checks fed by a community feed of tests.", "where": "A Linux scanner managed through the Greenbone web interface."}]}, {"id": "22-debuggers", "t": "Debuggers", "what": "Tools that run a program step by step so you can see its memory and registers.", "does": "Let you find exactly where and why software fails, and how malware behaves.", "kids": [{"id": "22-debuggers-immunity-debugger", "t": "Immunity Debugger", "what": "A free Windows debugger with a Python API.", "does": "Used for exploit development and malware analysis, for example watching a buffer overflow overwrite the instruction pointer.", "where": "Runs on a Windows analysis machine."}, {"id": "22-debuggers-gnu-debugger-gdb", "t": "GNU Debugger (GDB)", "what": "The open-source command-line debugger for Linux and Unix programs.", "does": "Breakpoints, stepping, register and memory dumps: <code>break main<\/code>, <code>run<\/code>, <code>info registers<\/code>.", "where": "Runs in a Linux terminal: <code>gdb ./program<\/code>."}]}, {"id": "22-multipurpose", "t": "Multipurpose", "what": "Tools that cover several assessment jobs.", "does": "Combine discovery, scanning, exploitation or reconnaissance.", "kids": [{"id": "22-multipurpose-nmap", "t": "Nmap", "what": "The standard network scanner.", "does": "Finds live hosts, open ports, service versions (<code>-sV<\/code>) and OS (<code>-O<\/code>); NSE scripts add checks.", "where": "Command line on the scanning host.", "trap": "<code>open|filtered<\/code> means no response came back, so Nmap can&rsquo;t tell which."}, {"id": "22-multipurpose-metasploit-framework-msf", "t": "Metasploit Framework (MSF)", "what": "An exploitation framework with thousands of modules.", "does": "Validates whether a vulnerability is really exploitable; also has scanners and post-exploitation modules.", "where": "Run from <code>msfconsole<\/code>, usually on Kali."}, {"id": "22-multipurpose-recon-ng", "t": "Recon-ng", "what": "A modular OSINT reconnaissance framework.", "does": "Collects hosts, IPs, contacts, email addresses and social media data about a target.", "where": "Command line on Kali, with modules that query online sources."}]}, {"id": "22-cloud-infrastructure-assessment-tools", "t": "Cloud infrastructure assessment tools", "what": "Tools that check cloud accounts for insecure settings.", "does": "Find open storage, weak identity policies and missing logging in AWS, Azure and GCP.", "kids": [{"id": "22-cloud-infrastructure-assessment-tools-scout-suit", "t": "Scout Suite", "what": "An open-source multi-cloud configuration auditor.", "does": "Produces a report of risky settings; items marked <b>Danger<\/b> (red) need immediate attention.", "where": "Runs from the analyst&rsquo;s machine using read-only cloud API credentials."}, {"id": "22-cloud-infrastructure-assessment-tools-prowler", "t": "Prowler", "what": "An open-source cloud security and compliance checker, strongest on AWS.", "does": "Runs hundreds of best-practice and compliance checks (CIS, PCI) against an account.", "where": "Command line using cloud API credentials."}, {"id": "22-cloud-infrastructure-assessment-tools-pacu", "t": "Pacu", "what": "An AWS exploitation framework.", "does": "Attacks an AWS account during an authorized test, the offensive counterpart to Scout Suite and Prowler.", "where": "Command line using AWS keys.", "trap": "Auditing cloud settings: Scout Suite or Prowler. Exploiting AWS in a pen test: Pacu."}]}]}, {"o": "2.3", "title": "Given a scenario, analyze data to prioritize vulnerabilities.", "items": [{"id": "23-common-vulnerability-scoring-system-cvss-interpr", "t": "Common Vulnerability Scoring System (CVSS) interpretation", "what": "A standard 0&ndash;10 score for how severe a vulnerability is, written as a vector such as <code>AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H<\/code>.", "does": "Turns a vulnerability&rsquo;s traits into a number so findings can be compared. Bands: 0.1&ndash;3.9 Low, 4.0&ndash;6.9 Medium, 7.0&ndash;8.9 High, 9.0&ndash;10 Critical.", "where": "Scores come from NVD and vendors and appear on every scanner finding.", "trap": "The base score describes the flaw, not your network. A 9.8 on an isolated test box can matter less than a 7.5 on an internet-facing server.", "kids": [{"id": "23-common-vulnerability-scoring-system-cvss-interpr-2", "t": "Attack vectors (AV)", "what": "How close the attacker must be.", "does": "Network (N, from anywhere), Adjacent (A, same local network), Local (L, logged on), Physical (P, hands on the device). Network is worst."}, {"id": "23-common-vulnerability-scoring-system-cvss-interpr-3", "t": "Attack complexity (AC)", "what": "How hard the attack is to pull off.", "does": "Low (L) works reliably; High (H) needs special conditions the attacker can&rsquo;t control."}, {"id": "23-common-vulnerability-scoring-system-cvss-interpr-4", "t": "Privileges required (PR)", "what": "What access the attacker needs first.", "does": "None (N), Low (L) or High (H). None is worst."}, {"id": "23-common-vulnerability-scoring-system-cvss-interpr-5", "t": "User interaction (UI)", "what": "Whether a user must do something, such as click a link.", "does": "None (N) or Required (R). None is worst."}, {"id": "23-common-vulnerability-scoring-system-cvss-interpr-6", "t": "Scope (S)", "what": "Whether the attack can reach beyond the vulnerable component.", "does": "Unchanged (U) stays inside; Changed (C) affects other components, such as a VM escape reaching the host."}, {"id": "23-common-vulnerability-scoring-system-cvss-interpr-7", "t": "Impact (C, I, A)", "what": "How much damage a successful attack does.", "does": "Rated High, Low or None for each of confidentiality, integrity and availability.", "kids": [{"id": "23-impact-c-i-a-confidentiality", "t": "Confidentiality", "what": "Data being read by someone who shouldn&rsquo;t.", "does": "C:H means the attacker can read everything the component holds."}, {"id": "23-impact-c-i-a-integrity", "t": "Integrity", "what": "Data or systems being changed.", "does": "I:H means the attacker can modify anything."}, {"id": "23-impact-c-i-a-availability", "t": "Availability", "what": "The service staying up.", "does": "A:H means the attacker can take it down completely."}]}]}, {"id": "23-validation", "t": "Validation", "what": "Checking whether a scanner finding is real.", "does": "Separates real problems from noise before anyone spends time fixing them.", "kids": [{"id": "23-validation-true-false-positives", "t": "True/false positives", "what": "A positive is an alert. True positive: real problem. False positive: alert with no real problem.", "does": "False positives waste time and erode trust in the tool.", "trap": "After a plugin update, a new finding on every host of one app is probably a false positive. Verify before fixing or exempting it."}, {"id": "23-validation-true-false-negatives", "t": "True/false negatives", "what": "A negative is silence. True negative: nothing there. False negative: a real problem that was missed.", "does": "False negatives are the dangerous ones because nobody looks."}]}, {"id": "23-context-awareness", "t": "Context awareness", "what": "Judging a finding by where the asset sits and who can reach it.", "does": "Raises or lowers priority beyond the CVSS base score.", "kids": [{"id": "23-context-awareness-internal", "t": "Internal", "what": "Reachable only from inside your network.", "does": "Lower exposure, but still a target once an attacker gets in."}, {"id": "23-context-awareness-external", "t": "External", "what": "Reachable from the internet.", "does": "Highest exposure; usually fixed first."}, {"id": "23-context-awareness-isolated", "t": "Isolated", "what": "Air-gapped or on a separate segment with no path in.", "does": "Lowest exposure; often fixed later or handled with a documented exception."}]}, {"id": "23-exploitability-weaponization", "t": "Exploitability/weaponization", "what": "Whether working attack code exists and how easy it is to use.", "does": "A flaw with a public exploit or one already used in attacks jumps the queue.", "where": "Check CISA&rsquo;s Known Exploited Vulnerabilities (KEV) catalog and EPSS, which estimates the chance of exploitation."}, {"id": "23-asset-value", "t": "Asset value", "what": "How important the affected system or data is to the business.", "does": "The higher the asset value, the higher the priority to fix.", "where": "Recorded in the asset inventory and business impact analysis."}, {"id": "23-zero-day", "t": "Zero-day", "what": "A vulnerability with no patch yet, often already being exploited.", "does": "Forces compensating controls (isolate, block, monitor, WAF rules) until a fix exists.", "trap": "Signature-based tools can&rsquo;t detect a zero-day. Answers about unknown threats want behavior-based detection."}]}, {"o": "2.4", "title": "Given a scenario, recommend controls to mitigate attacks and software vulnerabilities.", "items": [{"id": "24-cross-site-scripting-xss", "t": "Cross-site scripting (XSS)", "what": "Attacker script that runs in another user&rsquo;s browser because a site displayed unescaped input.", "does": "Steals session cookies, rewrites the page or acts as the victim.", "where": "Happens on the web page; the script runs in the victim&rsquo;s browser.", "trap": "Fix: output encoding plus input validation, and a Content Security Policy. A WAF helps but isn&rsquo;t the root fix.", "flow": ["Attacker input", "*Vulnerable page", "Victim browser runs script"], "kids": [{"id": "24-cross-site-scripting-xss-reflected", "t": "Reflected", "what": "The script is in the request (often a link) and bounces straight back in the response.", "does": "Hits only whoever clicks the crafted link."}, {"id": "24-cross-site-scripting-xss-persistent-stored", "t": "Persistent (stored)", "what": "The script is saved on the server, such as in a comment, and served to everyone who views it.", "does": "Hits every visitor, so it is more dangerous than reflected."}]}, {"id": "24-overflow-vulnerabilities", "t": "Overflow vulnerabilities", "what": "Writing more data than a memory area or number can hold.", "does": "Corrupts nearby memory; can crash the program or let an attacker run code.", "trap": "Controls: bounds checking and input validation, safe functions, DEP, ASLR, stack canaries, memory-safe languages.", "kids": [{"id": "24-overflow-vulnerabilities-buffer", "t": "Buffer", "what": "Copying input past the end of a fixed-size buffer.", "does": "Overwrites adjacent memory; the general category."}, {"id": "24-overflow-vulnerabilities-integer", "t": "Integer", "what": "Arithmetic that goes past a number type&rsquo;s maximum and wraps around.", "does": "Produces a tiny or negative size that later causes a buffer overflow."}, {"id": "24-overflow-vulnerabilities-heap", "t": "Heap", "what": "Overflow in memory allocated at run time.", "does": "Corrupts other objects or heap metadata."}, {"id": "24-overflow-vulnerabilities-stack", "t": "Stack", "what": "Overflow in a function&rsquo;s local buffer on the stack.", "does": "Overwrites the saved return address so execution jumps to attacker code. Stack canaries detect it."}]}, {"id": "24-data-poisoning", "t": "Data poisoning", "what": "Feeding bad data into what a system learns from, such as a machine learning model&rsquo;s training set.", "does": "Makes the model misclassify on purpose, for example letting malware pass as clean.", "where": "In training data pipelines and feedback loops.", "trap": "Control: protect and validate training data sources and monitor the model for drift."}, {"id": "24-broken-access-control", "t": "Broken access control", "what": "Users can act outside their permissions.", "does": "Lets someone view other users&rsquo; data or reach admin functions, for example by changing an ID in the URL (IDOR).", "trap": "Control: check authorization on the server for every request; deny by default."}, {"id": "24-cryptographic-failures", "t": "Cryptographic failures", "what": "Data not protected by encryption, or protected badly.", "does": "Exposes data through cleartext protocols, weak algorithms (MD5, DES), hard-coded keys or bad key handling.", "trap": "Control: TLS 1.2+ in transit, strong encryption at rest, keys in a vault or HSM, never in code."}, {"id": "24-injection-flaws", "t": "Injection flaws", "what": "Untrusted input treated as part of a command or query.", "does": "Lets the attacker change what the interpreter runs: SQL, OS commands, LDAP, XML.", "trap": "SQL injection fix: parameterized queries (prepared statements), plus input validation and least-privilege database accounts.", "flow": ["User input", "*Query built from input", "Database runs attacker SQL"]}, {"id": "24-cross-site-request-forgery-csrf", "t": "Cross-site request forgery (CSRF)", "what": "A trick that makes a logged-in user&rsquo;s browser send a request they didn&rsquo;t intend.", "does": "Performs actions as the victim, such as a transfer or password change.", "where": "Starts on an attacker&rsquo;s page; the browser sends the victim&rsquo;s cookies to the real site.", "trap": "Fix: anti-CSRF tokens (unpredictable, per request) and SameSite cookies.", "flow": ["Victim logged in", "Visits attacker page", "*Browser sends forged request", "Real site obeys"]}, {"id": "24-directory-traversal", "t": "Directory traversal", "what": "Using <code>../<\/code> in a file path to escape the intended folder.", "does": "Reads files outside the web root, such as <code>/etc/passwd<\/code>.", "trap": "Fix: validate and canonicalize paths; allow only known file names; run the service with least privilege."}, {"id": "24-insecure-design", "t": "Insecure design", "what": "Security flaws built into how the application was planned, not just bugs in code.", "does": "A perfect implementation is still unsafe, for example a password reset that relies on guessable questions.", "trap": "Fix: threat modeling and secure design reviews early in the SDLC."}, {"id": "24-security-misconfiguration", "t": "Security misconfiguration", "what": "Insecure settings: defaults left on, verbose errors, open storage, unneeded features enabled.", "does": "Gives attackers easy information or access without any software bug.", "trap": "Fix: hardened baselines, automated configuration checks, remove what you don&rsquo;t use."}, {"id": "24-end-of-life-or-outdated-components", "t": "End-of-life or outdated components", "what": "Software or libraries that are old or no longer supported by the vendor.", "does": "Leaves known vulnerabilities with no patch coming.", "trap": "Fix: upgrade. If you can&rsquo;t, isolate it and add compensating controls. Never move it into the DMZ."}, {"id": "24-identification-an
