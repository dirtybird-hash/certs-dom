d-authentication-failures", "t": "Identification and authentication failures", "what": "Weak proof of who a user is.", "does": "Allows credential stuffing, brute force and session hijacking.", "trap": "Fix: MFA, lockout and rate limiting, secure session handling, no default passwords."}, {"id": "24-server-side-request-forgery-ssrf", "t": "Server-side request forgery (SSRF)", "what": "Tricking a server into making requests on the attacker&rsquo;s behalf.", "does": "Reaches internal systems the attacker can&rsquo;t, such as the cloud metadata service at <code>169.254.169.254<\/code>.", "trap": "Fix: allowlist destinations, validate URLs, block internal and metadata addresses, require IMDSv2 in AWS.", "flow": ["Attacker", "*Vulnerable server", "Internal service or metadata"]}, {"id": "24-remote-code-execution-rce", "t": "Remote code execution (RCE)", "what": "An attacker can run their own code on a system over the network.", "does": "Gives full control: install malware, steal data, move to other systems.", "trap": "The worst outcome. Network-reachable RCE with no privileges or user interaction scores around 9.8 and is patched first."}, {"id": "24-privilege-escalation", "t": "Privilege escalation", "what": "Gaining more access than you were given.", "does": "Vertical: user to admin or root. Horizontal: one user to another user&rsquo;s data.", "where": "Through kernel bugs, misconfigured sudo or services, weak file permissions, stolen tokens.", "trap": "Fix: patch, least privilege, remove unneeded admin rights, monitor for new admin accounts."}, {"id": "24-local-file-inclusion-lfi-remote-file-inclusion-r", "t": "Local file inclusion (LFI)/remote file inclusion (RFI)", "what": "A web app loads a file named in user input.", "does": "LFI reads or runs a file already on the server; RFI loads a file from the attacker&rsquo;s server and runs it.", "where": "A parameter such as <code>?page=<\/code> in a PHP app.", "trap": "Fix: allowlist files, never pass input to include functions, and disable remote includes (<code>allow_url_include=Off<\/code>)."}]}, {"o": "2.5", "title": "Explain concepts related to vulnerability response, handling, and management.", "items": [{"id": "25-compensating-control", "t": "Compensating control", "what": "An alternative control used when the preferred one isn&rsquo;t possible.", "does": "Brings risk down to an acceptable level, for example isolating a server that can&rsquo;t be patched.", "trap": "If the ideal fix is too costly or impossible, the answer is a compensating control."}, {"id": "25-control-types", "t": "Control types", "what": "Ways of grouping security controls by who carries them out and what they do.", "does": "Helps you pick the right kind of control for a gap.", "kids": [{"id": "25-control-types-managerial", "t": "Managerial", "what": "Policies, risk assessments and planning: decisions on paper.", "does": "Directs the program, for example a security policy or awareness training plan."}, {"id": "25-control-types-operational", "t": "Operational", "what": "Day-to-day procedures carried out by people.", "does": "For example guards, backups and change procedures."}, {"id": "25-control-types-technical", "t": "Technical", "what": "Controls enforced by hardware or software.", "does": "For example firewalls, encryption and MFA."}, {"id": "25-control-types-preventative", "t": "Preventative", "what": "Stops an incident before it happens.", "does": "For example a locked door, a firewall rule or MFA."}, {"id": "25-control-types-detective", "t": "Detective", "what": "Finds an incident while or after it happens.", "does": "For example IDS, log review and cameras."}, {"id": "25-control-types-responsive", "t": "Responsive", "what": "Acts when an incident is detected.", "does": "For example an IPS blocking traffic or a SOAR playbook isolating a host."}, {"id": "25-control-types-corrective", "t": "Corrective", "what": "Repairs damage and restores normal operation.", "does": "For example restoring from backup or reimaging."}]}, {"id": "25-patching-and-configuration", "t": "Patching and configuration", "what": "The process for fixing vulnerabilities safely.", "does": "Moves fixes from release to production without breaking things.", "flow": ["Test", "Implement", "Validate", "Rollback if needed"], "kids": [{"id": "25-patching-and-configuration-testing", "t": "Testing", "what": "Trying the patch first.", "does": "Catches breakage in a sandbox or staging copy before it reaches production."}, {"id": "25-patching-and-configuration-implementation", "t": "Implementation", "what": "Deploying the patch.", "does": "Rolls it out through change control in a maintenance window, often in waves."}, {"id": "25-patching-and-configuration-rollback", "t": "Rollback", "what": "Undoing a patch that causes problems.", "does": "Returns to the last working state; plan it before you deploy."}, {"id": "25-patching-and-configuration-validation", "t": "Validation", "what": "Confirming the fix worked.", "does": "A follow-up scan no longer reports the finding. A ticket marked done doesn&rsquo;t count."}]}, {"id": "25-maintenance-windows", "t": "Maintenance windows", "what": "Agreed times when changes and reboots are allowed.", "does": "Limits business disruption from patching.", "trap": "Short or missing windows are an inhibitor to remediation."}, {"id": "25-exceptions", "t": "Exceptions", "what": "A documented, approved decision not to fix a finding for now.", "does": "Records the risk owner, reason, compensating controls and a review or expiry date.", "trap": "An exception is not ignoring a finding. It needs approval and a review date."}, {"id": "25-risk-management-principles", "t": "Risk management principles", "what": "The four ways to respond to a risk.", "does": "Each risk gets one, chosen by cost compared with impact.", "kids": [{"id": "25-risk-management-principles-accept", "t": "Accept", "what": "Live with the risk.", "does": "Used when fixing costs more than the risk; documented and approved."}, {"id": "25-risk-management-principles-transfer", "t": "Transfer", "what": "Shift the financial impact to someone else.", "does": "For example cyber insurance or contracts with a provider."}, {"id": "25-risk-management-principles-avoid", "t": "Avoid", "what": "Stop doing the risky activity.", "does": "For example retire the vulnerable service entirely."}, {"id": "25-risk-management-principles-mitigate", "t": "Mitigate", "what": "Reduce the likelihood or impact.", "does": "For example patch, harden or add controls."}]}, {"id": "25-policies-governance-and-service-level-objectives", "t": "Policies, governance, and service-level objectives (SLOs)", "what": "The rules and targets that drive remediation.", "does": "Policies set deadlines by severity; governance decides who approves; SLOs are the internal target times, such as criticals fixed within 7 days."}, {"id": "25-prioritization-and-escalation", "t": "Prioritization and escalation", "what": "Deciding what to fix first and when to raise it higher.", "does": "Uses severity, exploitability, exposure and asset value; overdue or critical items are escalated to management."}, {"id": "25-attack-surface-management", "t": "Attack surface management", "what": "Continuously finding and shrinking everything an attacker could target.", "does": "Keeps an up-to-date view of exposed assets and closes what isn&rsquo;t needed.", "kids": [{"id": "25-attack-surface-management-edge-discovery", "t": "Edge discovery", "what": "Finding internet-facing assets at your network edge.", "does": "Reveals forgotten servers, open ports and shadow IT."}, {"id": "25-attack-surface-management-passive-discovery", "t": "Passive discovery", "what": "Finding assets without touching them.", "does": "Uses DNS records, certificate transparency logs and internet scan data such as Shodan."}, {"id": "25-attack-surface-management-security-controls-test", "t": "Security controls testing", "what": "Checking that controls actually work.", "does": "For example confirming a firewall really blocks what the policy says."}, {"id": "25-attack-surface-management-penetration-testing-an", "t": "Penetration testing and adversary emulation", "what": "Authorized attacks by testers.", "does": "Pen testing exploits weaknesses; adversary emulation copies a real threat actor&rsquo;s TTPs (from ATT&amp;CK)."}, {"id": "25-attack-surface-management-bug-bounty", "t": "Bug bounty", "what": "A program that pays outside researchers for valid vulnerability reports.", "does": "Adds many testers under agreed rules of engagement."}, {"id": "25-attack-surface-management-attack-surface-reducti", "t": "Attack surface reduction", "what": "Removing what isn&rsquo;t needed.", "does": "Close unused ports, remove services, segment networks, patch."}]}, {"id": "25-secure-coding-best-practices", "t": "Secure coding best practices", "what": "Habits that keep vulnerabilities out of code.", "does": "Prevents the 2.4 flaws at the source.", "kids": [{"id": "25-secure-coding-best-practices-input-validation", "t": "Input validation", "what": "Checking input against what is allowed before using it.", "does": "Blocks injection, overflows and traversal. Prefer allowlists, done on the server."}, {"id": "25-secure-coding-best-practices-output-encoding", "t": "Output encoding", "what": "Escaping data before it is displayed or passed on.", "does": "Stops XSS by turning <code>&lt;script&gt;<\/code> into harmless text."}, {"id": "25-secure-coding-best-practices-session-management", "t": "Session management", "what": "Handling session tokens safely.", "does": "Random tokens, Secure and HttpOnly cookies, timeouts and a new token after login."}, {"id": "25-secure-coding-best-practices-authentication", "t": "Authentication", "what": "Verifying users properly.", "does": "MFA, hashed and salted passwords, lockout, no hard-coded credentials."}, {"id": "25-secure-coding-best-practices-data-protection", "t": "Data protection", "what": "Keeping sensitive data safe.", "does": "Encrypt in transit and at rest, minimize what is stored, mask what is displayed."}, {"id": "25-secure-coding-best-practices-parameterized-queri", "t": "Parameterized queries", "what": "Queries where input is passed as data, never joined into the SQL text.", "does": "The main fix for SQL injection."}]}, {"id": "25-secure-software-development-life-cycle-sdlc", "t": "Secure software development life cycle (SDLC)", "what": "Building security into every phase of software development.", "does": "Requirements include security, design gets threat modeling, code gets reviews and SAST, testing gets DAST and fuzzing, and releases get scans.", "trap": "Security requirements are set in the first phase, requirements gathering.", "flow": ["Requirements", "Design", "Build", "Test", "Deploy", "Maintain"]}, {"id": "25-threat-modeling", "t": "Threat modeling", "what": "A structured look at what could attack a system and how.", "does": "Finds threats and attack paths early so controls are designed in. Methods include STRIDE and attack-vector analysis.", "where": "Done during design, using diagrams of data flows and trust boundaries."}]}, {"o": "3.1", "title": "Explain concepts related to attack methodology frameworks.", "items": [{"id": "31-cyber-kill-chains", "t": "Cyber kill chains", "what": "A model of the stages an attack moves through, from Lockheed Martin.", "does": "Shows where a defense can break the chain; stopping any stage stops the attack.", "trap": "Weaponization (building the payload) happens on the attacker&rsquo;s side, so you have no logs of it. Installation means persistence; exploitation is code running once.", "flow": ["Recon", "Weaponization", "Delivery", "Exploitation", "Installation", "*Command and control", "Actions on objectives"]}, {"id": "31-diamond-model-of-intrusion-analysis", "t": "Diamond Model of Intrusion Analysis", "what": "A model that describes one intrusion event with four connected points: adversary, capability, infrastructure and victim.", "does": "Lets you pivot: from a known C2 server (infrastructure) to the malware (capability) or to other victims.", "where": "The four points: Adversary (who and why), Capability (malware, exploits, TTPs), Infrastructure (C2 servers, domains, IPs), Victim (people and systems targeted).", "trap": "C2 servers are infrastructure, not capability. Motive belongs with the adversary."}, {"id": "31-mitre-attck", "t": "MITRE ATT&amp;CK", "what": "A free knowledge base of real attacker tactics and techniques, each with an ID such as T1059.", "does": "Gives a common language to map detections, incidents and threat intelligence.", "where": "Online at attack.mitre.org; the ATT&amp;CK Navigator shows coverage."}, {"id": "31-open-source-security-testing-methodology-manual-", "t": "Open Source Security Testing Methodology Manual (OSSTMM)", "what": "A manual for testing security in general, published by ISECOM.", "does": "Covers testing of people, physical, wireless, telecom and data networks with measurable results.", "trap": "A general, broad security assessment points to OSSTMM; web applications only point to the OWASP Testing Guide."}, {"id": "31-owasp-testing-guide", "t": "OWASP Testing Guide", "what": "OWASP&rsquo;s methodology for testing web applications.", "does": "Lists test cases for authentication, sessions, input validation, configuration and business logic.", "trap": "The Testing Guide says how to test; ASVS lists the requirements an app must meet; the Top 10 lists the biggest risks."}]}, {"o": "3.2", "title": "Given a scenario, perform incident response activities.", "items": [{"id": "32-detection-and-analysis", "t": "Detection and analysis", "what": "Spotting a possible incident and working out what happened.", "does": "Confirms whether it is a real incident, how serious it is and how far it reaches.", "kids": [{"id": "32-detection-and-analysis-ioc", "t": "IoC", "full": "Indicator of compromise", "what": "Evidence that a compromise has occurred, such as a malicious hash, IP or domain.", "does": "Confirms an incident and helps find other affected systems."}, {"id": "32-detection-and-analysis-evidence-acquisitions", "t": "Evidence acquisitions", "what": "Collecting data from affected systems in a way that holds up later.", "does": "Preserves what happened for analysis and possible legal action.", "trap": "Collect the most volatile evidence first. Powering off loses RAM.", "flow": ["*RAM and CPU state", "Network and processes", "Disk", "Logs and backups"], "kids": [{"id": "32-evidence-acquisitions-chain-of-custody", "t": "Chain of custody", "what": "A record of who handled evidence, when, where and why.", "does": "Proves the evidence wasn&rsquo;t tampered with, so it stays admissible.", "where": "A custody form that travels with the evidence."}, {"id": "32-evidence-acquisitions-validating-data-integrity", "t": "Validating data integrity", "what": "Proving evidence hasn&rsquo;t changed.", "does": "Hash the original and the copy (SHA-256); matching hashes prove they are identical."}, {"id": "32-evidence-acquisitions-preservation", "t": "Preservation", "what": "Keeping evidence in its original state.", "does": "Use write blockers, work on copies, store securely."}, {"id": "32-evidence-acquisitions-legal-hold", "t": "Legal hold", "what": "A directive to keep relevant data and stop it being deleted.", "does": "Suspends normal retention and deletion, often quietly, before litigation.", "where": "Applied on email, file servers and cloud storage.", "trap": "&ldquo;Preserve evidence before notifying the employee&rdquo; is a legal hold."}]}, {"id": "32-detection-and-analysis-data-and-log-analysis", "t": "Data and log analysis", "what": "Reviewing logs and data to rebuild events.", "does": "Shows what happened before, during and after the incident.", "where": "SIEM, log viewers, EDR timelines.", "trap": "&ldquo;What led up to the incident&rdquo; means logs."}]}, {"id": "32-containment-eradication-and-recovery", "t": "Containment, eradication, and recovery", "what": "Stopping the damage, removing the attacker, and returning to normal.", "does": "Limits harm, cleans systems and restores service.", "flow": ["*Contain", "Eradicate", "Recover"], "kids": [{"id": "32-containment-eradication-and-recovery-scope", "t": "Scope", "what": "How far the incident reaches: which systems, accounts and data.", "does": "Decides how wide containment must be."}, {"id": "32-containment-eradication-and-recovery-impact", "t": "Impact", "what": "How much harm the incident causes.", "does": "Measured in downtime, recovery time, data loss and cost; drives priority."}, {"id": "32-containment-eradication-and-recovery-isolation", "t": "Isolation", "what": "Cutting an affected system off from the network.", "does": "Stops spread and C2 while keeping the system on for evidence.", "where": "Through EDR network containment, switch port shutdown or a quarantine VLAN.", "trap": "Ransomware on a PC: isolate it, don&rsquo;t power it off."}, {"id": "32-containment-eradication-and-recovery-remediation", "t": "Remediation", "what": "Fixing what let the attack in.", "does": "Patching, removing persistence, resetting credentials."}, {"id": "32-containment-eradication-and-recovery-re-imaging", "t": "Re-imaging", "what": "Wiping a system and reinstalling from a known-good image.", "does": "Returns it to a clean, trusted state."}, {"id": "32-containment-eradication-and-recovery-compensatin", "t": "Compensating controls", "what": "Temporary alternative controls during recovery.", "does": "Reduce risk while the permanent fix is pending, such as extra monitoring or blocking rules."}]}]}, {"o": "3.3", "title": "Explain the preparation and post-incident activity phases of the incident management life cycle.", "items": [{"id": "33-preparation", "t": "Preparation", "what": "Everything done before an incident so the team can respond well.", "does": "Sets up plans, tools, people and practice. It is the first phase.", "flow": ["*Preparation", "Detection and analysis", "Containment, eradication, recovery", "Post-incident activity"], "kids": [{"id": "33-preparation-incident-response-plan", "t": "Incident response plan", "what": "The written plan for handling incidents.", "does": "Defines roles, communication, escalation and phases."}, {"id": "33-preparation-tools", "t": "Tools", "what": "The kit responders need ready.", "does": "Forensic tools, write blockers, clean media, contact lists, out-of-band communication."}, {"id": "33-preparation-playbooks", "t": "Playbooks", "what": "Step-by-step guides for specific incident types.", "does": "Make responses to ransomware or phishing consistent; SOAR can automate them."}, {"id": "33-preparation-tabletop", "t": "Tabletop", "what": "A discussion exercise walking through a scenario.", "does": "Tests the plan and roles without touching systems.", "trap": "A new team with an approved plan should run a tabletop next."}, {"id": "33-preparation-training", "t": "Training", "what": "Teaching staff their incident roles.", "does": "Keeps responders ready and users reporting quickly."}, {"id": "33-preparation-business-continuity-bc-disaster-reco", "t": "Business continuity (BC)/disaster recovery (DR)", "what": "Plans to keep the business running (BC) and to restore IT after a disaster (DR).", "does": "Use targets such as RTO (time to restore) and RPO (how much data may be lost)."}]}, {"id": "33-post-incident-activity", "t": "Post-incident activity", "what": "Work done after the incident is resolved.", "does": "Learns from the incident and improves defenses.", "kids": [{"id": "33-post-incident-activity-forensic-analysis", "t": "Forensic analysis", "what": "Detailed examination of evidence.", "does": "Establishes exactly what happened and supports legal action."}, {"id": "33-post-incident-activity-root-cause-analysis", "t": "Root cause analysis", "what": "Finding the underlying reason the incident was possible.", "does": "Fixes the cause, not just the symptom, so it doesn&rsquo;t happen again."}, {"id": "33
