<head>

<meta name="color-scheme" content="light dark">
<meta name="description" content="Term-and-definition matching game for Security+ Domain 4.">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Domain 4 Match</title>
</head>
<body>
<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface-2:#eef1f2; --border:#dbe0e3;
  --text:#171b1f; --text-muted:#5a6570;
  --accent:#8a6210; --accent-ink:#ffffff;
  --hl-blue:#2f5fd6; --hl-blue-bg:#eaf0fd;
  --hl-green:#1f8a5c; --hl-green-bg:#e7f4ee;
  --bad:#c23b3b; --bad-bg:#fbe9e9;
  --cable-1:#0d7b86; --cable-2:#2f5fd6; --cable-3:#a9791c;
  --cable-4:#b3437c; --cable-5:#a9791c; --cable-6:#6d4bc4;
  --shadow:0 1px 2px rgba(20,24,28,.06),0 4px 14px rgba(20,24,28,.06);
  --shadow-lift:0 6px 22px rgba(20,24,28,.16);
  --radius:12px;
  --font-display:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --font-body:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1216; --surface:#151c22; --surface-2:#1b242b; --border:#2b363e;
    --text:#e7edf1; --text-muted:#93a2ac;
    --accent:#e0b24d; --accent-ink:#2a1e05;
    --hl-blue:#7ea2ff; --hl-blue-bg:#161f34;
    --hl-green:#55d69a; --hl-green-bg:#12291f;
    --bad:#f0817c; --bad-bg:#331616;
    --cable-1:#3fd0dd; --cable-2:#7ea2ff; --cable-3:#e0b24d;
    --cable-4:#ea86b8; --cable-5:#e0b24d; --cable-6:#a98cf0;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.35);
    --shadow-lift:0 10px 30px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1216; --surface:#151c22; --surface-2:#1b242b; --border:#2b363e;
  --text:#e7edf1; --text-muted:#93a2ac;
  --accent:#e0b24d; --accent-ink:#2a1e05;
  --hl-blue:#7ea2ff; --hl-blue-bg:#161f34;
  --hl-green:#55d69a; --hl-green-bg:#12291f;
  --bad:#f0817c; --bad-bg:#331616;
  --cable-1:#3fd0dd; --cable-2:#7ea2ff; --cable-3:#e0b24d;
  --cable-4:#ea86b8; --cable-5:#e0b24d; --cable-6:#a98cf0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.35);
  --shadow-lift:0 10px 30px rgba(0,0,0,.55);
}
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);margin:0;}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:14px 56px;}
h1{font-family:var(--font-display);font-weight:600;letter-spacing:-0.01em;}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  border-bottom:1px solid var(--border);}
.topbar-inner{max-width:860px;margin:0 auto;padding:12px 16px 10px;display:flex;flex-direction:column;gap:9px;}
.backlink{font-family:var(--font-display);font-size:11.5px;letter-spacing:.03em;color:var(--text-muted);
  text-decoration:none;display:inline-flex;align-items:center;gap:6px;align-self:flex-start;}
.backlink:hover{color:var(--accent);}
.backlink .arr{transition:transform .14s ease;}
.backlink:hover .arr{transform:translateX(-3px);}
.backlink:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px;}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.brand h1{font-size:18px;margin:0;}
.brand .sub{font-size:12px;color:var(--text-muted);font-family:var(--font-display);}
.tabs{display:flex;gap:4px;overflow-x:auto;}
.tab{font-family:var(--font-display);font-size:12.5px;letter-spacing:.02em;text-transform:uppercase;
  background:none;border:none;color:var(--text-muted);padding:8px 12px;cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap;}
.tab.active{color:var(--text);border-bottom-color:var(--accent);}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
.controlrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.sizegroup{display:flex;gap:3px;background:var(--surface-2);border-radius:8px;padding:3px;}
.sizebtn{font-family:var(--font-display);font-size:11.5px;background:none;border:none;color:var(--text-muted);
  padding:6px 10px;border-radius:6px;cursor:pointer;}
.sizebtn.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow);}
.newround{font-family:var(--font-display);font-size:12px;background:var(--accent);color:var(--accent-ink);
  border:none;border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap;}
.newround:active{opacity:.85;}

/* ---------- HUD ---------- */
.hud{display:flex;flex-direction:column;gap:8px;padding:16px 0 18px;}
.track{height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden;}
.track .bar{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--cable-2),var(--accent));
  transition:width .35s cubic-bezier(.3,1.2,.5,1);}
.hudstats{display:flex;align-items:center;gap:14px;font-family:var(--font-display);font-size:12px;
  color:var(--text-muted);flex-wrap:wrap;}
.hudstats .num{color:var(--text);font-variant-numeric:tabular-nums;}
.streak{color:var(--cable-5);opacity:0;transform:translateY(3px);transition:opacity .2s,transform .2s;}
.streak.show{opacity:1;transform:none;}
.streak.hot{color:var(--cable-4);}

/* ---------- board ---------- */
.board{position:relative;display:grid;grid-template-columns:minmax(0,0.82fr) minmax(0,1.18fr);
  gap:clamp(30px,8vw,72px);}
.cables{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible;}
.col{display:grid;gap:10px;position:relative;z-index:1;}

.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:13px 14px;text-align:left;color:var(--text);font-family:var(--font-body);
  display:flex;align-items:center;min-height:56px;cursor:pointer;
  transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease, opacity .3s ease;}
.card.term{font-family:var(--font-display);font-size:13.5px;font-weight:500;touch-action:pan-y;}
.card.def{font-size:13px;line-height:1.45;}
.card:hover{border-color:var(--text-muted);}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.port{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--surface);
  border:2px solid var(--border);top:50%;transition:all .16s ease;}
.card.term .port{right:-6px;transform:translateY(-50%);}
.card.def .port{left:-6px;transform:translateY(-50%);}
.card.term:hover .port{border-color:var(--accent);}

.card.armed{border-color:var(--accent);box-shadow:var(--shadow-lift);transform:translateY(-1px);}
.card.armed .port{border-color:var(--accent);background:var(--accent);transform:translateY(-50%) scale(1.25);}
.card.dragging{border-color:var(--accent);box-shadow:var(--shadow-lift);}
.card.hot{border-color:var(--accent);box-shadow:var(--shadow-lift);transform:translateY(-1px);}
.card.hot .port{border-color:var(--accent);background:var(--accent);transform:translateY(-50%) scale(1.35);}
.card.wrong{border-color:var(--bad);background:var(--bad-bg);animation:shake .34s;}
.card.locked{opacity:.62;cursor:default;box-shadow:none;background:var(--surface-2);}
.card.locked:hover{border-color:var(--border);transform:none;}
.card.locked .port{background:var(--pair-color);border-color:var(--pair-color);}
.card.justlocked{animation:pop .4s cubic-bezier(.3,1.4,.5,1);}

@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-5px);}
  40%{transform:translateX(5px);}60%{transform:translateX(-3px);}80%{transform:translateX(3px);}}
@keyframes pop{0%{transform:scale(1);}35%{transform:scale(1.035);}100%{transform:scale(1);}}
@keyframes dash{to{stroke-dashoffset:-24;}}
@keyframes cablepulse{0%,100%{opacity:.18;}50%{opacity:.5;}}

/* ---------- cables ---------- */
.cable{fill:none;stroke-linecap:round;}
.cable.core{stroke-width:2.4;}
.cable.halo{stroke-width:8;opacity:.18;}
.cable.live{stroke:var(--accent);stroke-width:2.4;stroke-dasharray:7 7;animation:dash .55s linear infinite;}
.cable.badline{stroke:var(--bad);stroke-width:2.4;}
.c1{stroke:var(--cable-1);} .c2{stroke:var(--cable-2);} .c3{stroke:var(--cable-3);}
.c4{stroke:var(--cable-4);} .c5{stroke:var(--cable-5);} .c6{stroke:var(--cable-6);}
.cable.halo.finale{animation:cablepulse .9s ease-in-out;}

/* ---------- completion ---------- */
.done{display:none;text-align:center;padding:46px 16px 20px;}
.done.show{display:block;}
.done .kicker{font-family:var(--font-display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-muted);}
.done .time{font-family:var(--font-display);font-size:44px;font-weight:600;color:var(--accent);
  margin:8px 0 2px;font-variant-numeric:tabular-nums;}
.done .best{font-family:var(--font-display);font-size:12.5px;color:var(--cable-3);min-height:18px;}
.done .line{font-size:13.5px;color:var(--text-muted);margin:16px 0 24px;}
.again{font-family:var(--font-display);font-size:13px;background:var(--accent);color:var(--accent-ink);
  border:none;border-radius:10px;padding:12px 22px;cursor:pointer;}

.hint{font-family:var(--font-display);font-size:11.5px;color:var(--text-muted);padding-top:18px;text-align:center;}

@media (max-width:560px){
  .brand h1{font-size:16px;}
  .card{min-height:50px;padding:11px 11px;}
  .card.term{font-size:12.5px;}
  .card.def{font-size:12px;line-height:1.4;}
  .done .time{font-size:36px;}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
}

/* ---- mobile polish: larger tap targets, tighter tab row ---- */
@media (max-width:520px){
  .tab{padding:11px 9px;}
  .sizebtn{padding:11px 12px;}
  .newround{padding:12px 16px;}
  .chip{padding:10px 13px;}
  .backlink{padding:6px 2px 6px 0;}
  button.ghost,button.primary,.again{padding:13px 18px;}
}
@media (hover:none){
  .card:hover,.topic:hover,.domtab:hover{transform:none;}
}
</style>

<div class="topbar">
  <div class="topbar-inner">
    <a class="backlink" href="index.html"><span class="arr">&larr;</span> Security+ Toolkit</a>
    <div class="brand">
      <h1>Domain 4 Match</h1>
      <span class="sub">patch each term to its definition</span>
    </div>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="controlrow">
      <div class="sizegroup" id="sizegroup"></div>
      <button class="newround" id="newround" type="button">New round</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="hud">
    <div class="track"><div class="bar" id="bar"></div></div>
    <div class="hudstats">
      <span>Patched <span class="num" id="stat-count">0/8</span></span>
      <span>Time <span class="num" id="stat-time">0:00</span></span>
      <span>Attempts <span class="num" id="stat-moves">0</span></span>
      <span class="streak" id="stat-streak">streak &times;2</span>
      <span id="stat-best-wrap" hidden>Best <span class="num" id="stat-best">&mdash;</span></span>
    </div>
  </div>

  <div class="board" id="board">
    <svg class="cables" id="cables" aria-hidden="true"></svg>
    <div class="col" id="col-terms"></div>
    <div class="col" id="col-defs"></div>
  </div>

  <p class="hint" id="hint">Drag a term across to its definition &mdash; or tap one, then the other.</p>

  <div class="done" id="done">
    <div class="kicker">Panel patched</div>
    <div class="time" id="done-time">0:00</div>
    <div class="best" id="done-best"></div>
    <div class="line" id="done-line"></div>
    <button class="again" id="playagain" type="button">Play again</button>
  </div>
</div>

<script>
(function(){
"use strict";

var TAB_ORDER = ["all","4.1","4.2","4.3","4.4","4.5","4.6","4.7","4.8","4.9","gotchas"];
var TAB_LABEL = {"all":"All","4.1":"4.1","4.2":"4.2","4.3":"4.3","4.4":"4.4","4.5":"4.5","4.6":"4.6","4.7":"4.7","4.8":"4.8","4.9":"4.9","gotchas":"Gotchas"};
var SIZES = [6,8,10];

var PAIRS = [
/* ---------- 4.1 Security Techniques ---------- */
{id:"a1",obj:"4.1",term:"Secure baseline",def:"The agreed security settings every instance of a system should carry"},
{id:"a2",obj:"4.1",term:"Maintain (baseline)",def:"Audit for drift and update the standard as things change"},
{id:"a3",obj:"4.1",term:"Hardening",def:"Reducing attack surface beyond the default configuration"},
{id:"a4",obj:"4.1",term:"Site survey",def:"Examines existing APs, channels and interference around a wireless install"},
{id:"a5",obj:"4.1",term:"Heat map",def:"Visual map of wireless signal strength across a floor plan"},
{id:"a6",obj:"4.1",term:"MDM",def:"Central policy, app control and remote wipe for mobile devices"},
{id:"a7",obj:"4.1",term:"BYOD",def:"The employee owns the device used for work"},
{id:"a8",obj:"4.1",term:"COPE",def:"Company-owned device with personal use allowed"},
{id:"a9",obj:"4.1",term:"CYOD",def:"Company-owned device, but the user picks the model"},
{id:"a10",obj:"4.1",term:"SAE",def:"WPA3 key exchange that defeats offline handshake cracking"},
{id:"a11",obj:"4.1",term:"GCMP",def:"WPA3's encryption mode, giving confidentiality plus integrity"},
{id:"a12",obj:"4.1",term:"WPA3-Enterprise",def:"Individual credentials checked through 802.1X and RADIUS"},
{id:"a13",obj:"4.1",term:"RADIUS",def:"The common AAA protocol behind Wi-Fi, VPN and device logins"},
{id:"a14",obj:"4.1",term:"Accounting (AAA)",def:"The record of a session: when, how long, how much data"},
{id:"a15",obj:"4.1",term:"EAP-TLS",def:"802.1X method using certificates on both client and server"},
{id:"a16",obj:"4.1",term:"Input validation",def:"Rejecting any input that doesn't match the expected format"},
{id:"a17",obj:"4.1",term:"Secure cookie",def:"Cookie that is only ever sent over HTTPS"},
{id:"a18",obj:"4.1",term:"Static code analysis",def:"Scanning source code for flaws without running it"},
{id:"a19",obj:"4.1",term:"Code signing",def:"Proves who published software and that it hasn't changed"},
{id:"a20",obj:"4.1",term:"Sandboxing",def:"Running code in isolation with access only to what it needs"},
/* ---------- 4.2 Asset Management ---------- */
{id:"b1",obj:"4.2",term:"Procurement process",def:"Formal buying that lets security vet assets before they're deployed"},
{id:"b2",obj:"4.2",term:"Asset ownership",def:"The person or team accountable for an asset"},
{id:"b3",obj:"4.2",term:"Inventory",def:"The authoritative record of what you own and where it is"},
{id:"b4",obj:"4.2",term:"Enumeration",def:"Actively discovering what's really on the network"},
{id:"b5",obj:"4.2",term:"Sanitization",def:"Removing data unrecoverably while the device stays usable"},
{id:"b6",obj:"4.2",term:"Degaussing",def:"Magnetic erasure &mdash; useless on SSDs"},
{id:"b7",obj:"4.2",term:"Certificate of destruction",def:"A vendor's proof that media was destroyed"},
{id:"b8",obj:"4.2",term:"Data retention",def:"How long data must be kept before disposal"},
/* ---------- 4.3 Vulnerability Management ---------- */
{id:"c1",obj:"4.3",term:"Vulnerability scan",def:"Finds known weaknesses without exploiting them"},
{id:"c2",obj:"4.3",term:"Fuzzing",def:"Malformed input thrown at a running app to find crashes"},
{id:"c3",obj:"4.3",term:"Package monitoring",def:"Tracking dependencies for tampering and known vulnerabilities"},
{id:"c4",obj:"4.3",term:"OSINT",def:"Threat information gathered from public sources"},
{id:"c5",obj:"4.3",term:"ISAC",def:"Sector group whose members share threat indicators"},
{id:"c6",obj:"4.3",term:"Dark web monitoring",def:"Watching hidden markets for your stolen data and credentials"},
{id:"c7",obj:"4.3",term:"Penetration test",def:"Simulated attack that actually exploits vulnerabilities"},
{id:"c8",obj:"4.3",term:"Rules of engagement",def:"The pen test's written scope, limits and contacts"},
{id:"c9",obj:"4.3",term:"Pivoting",def:"Using a compromised host as a relay to reach systems behind it"},
{id:"c10",obj:"4.3",term:"Bug bounty",def:"Reward paid to outsiders for reporting valid vulnerabilities"},
{id:"c11",obj:"4.3",term:"CVE",def:"The unique public identifier for a known vulnerability"},
{id:"c12",obj:"4.3",term:"CVSS",def:"A 0&ndash;10 severity score for a vulnerability"},
{id:"c13",obj:"4.3",term:"Exposure factor",def:"Percentage of an asset's value lost if exploited"},
{id:"c14",obj:"4.3",term:"Environmental variables",def:"Context such as internet exposure that changes priority"},
{id:"c15",obj:"4.3",term:"Risk tolerance",def:"How much risk the organization accepts while a fix is tested"},
{id:"c16",obj:"4.3",term:"Compensating control",def:"A substitute protection when you can't patch"},
{id:"c17",obj:"4.3",term:"Exception",def:"Formal, approved acceptance of a vulnerability's risk for now"},
{id:"c18",obj:"4.3",term:"Rescanning",def:"Scanning again to confirm a fix actually worked"},
/* ---------- 4.4 Alerting & Monitoring ---------- */
{id:"d1",obj:"4.4",term:"Log aggregation",def:"Collecting logs from many sources into one searchable place"},
{id:"d2",obj:"4.4",term:"Alert tuning",def:"Cutting false positives without creating false negatives"},
{id:"d3",obj:"4.4",term:"Quarantine",def:"Isolating an affected system while it's investigated"},
{id:"d4",obj:"4.4",term:"Archiving",def:"Keeping logs long term for late-discovered breaches"},
{id:"d5",obj:"4.4",term:"SCAP",def:"NIST's common language that lets find-and-fix be automated"},
{id:"d6",obj:"4.4",term:"CIS Benchmarks",def:"Published best-practice configurations per platform"},
{id:"d7",obj:"4.4",term:"Agentless",def:"Runs temporarily with nothing installed to maintain"},
{id:"d8",obj:"4.4",term:"SIEM",def:"Central logs with correlation across sources and alerting"},
{id:"d9",obj:"4.4",term:"SNMP trap",def:"A device pushing an alert unprompted, on UDP 162"},
{id:"d10",obj:"4.4",term:"NetFlow",def:"Records of who talked to whom and how much, not the contents"},
/* ---------- 4.5 Enterprise Capabilities ---------- */
{id:"e1",obj:"4.5",term:"Implicit deny",def:"Anything no rule allowed is dropped"},
{id:"e2",obj:"4.5",term:"First match wins",def:"Why specific firewall rules go above general ones"},
{id:"e3",obj:"4.5",term:"Screened subnet",def:"Segment for internet-facing servers, kept apart from the internal network"},
{id:"e4",obj:"4.5",term:"Stateful firewall",def:"Tracks connections and allows return traffic automatically"},
{id:"e5",obj:"4.5",term:"Agent-based web filter",def:"Filtering on the device itself, so it works on any network"},
{id:"e6",obj:"4.5",term:"Content categorization",def:"Policy written per website category, not per site"},
{id:"e7",obj:"4.5",term:"Reputation filtering",def:"Blocking sites whose risk score falls below a threshold"},
{id:"e8",obj:"4.5",term:"DNS filtering",def:"Refusing to resolve malicious domains, for every application"},
{id:"e9",obj:"4.5",term:"Group Policy",def:"Windows/AD central configuration pushed as GPOs"},
{id:"e10",obj:"4.5",term:"SELinux",def:"Mandatory access control confining every Linux process"},
{id:"e11",obj:"4.5",term:"SFTP",def:"File transfer over SSH on port 22"},
{id:"e12",obj:"4.5",term:"LDAPS",def:"Directory access over TLS on port 636"},
{id:"e13",obj:"4.5",term:"SPF",def:"DNS record listing servers allowed to send a domain's mail"},
{id:"e14",obj:"4.5",term:"DKIM",def:"Mail server signature checked against a public key in DNS"},
{id:"e15",obj:"4.5",term:"DMARC",def:"Policy for failed SPF/DKIM checks, plus reports to the owner"},
{id:"e16",obj:"4.5",term:"File integrity monitoring",def:"Alerts when files that shouldn't change are modified"},
{id:"e17",obj:"4.5",term:"Endpoint DLP",def:"Stops sensitive data being copied to USB or uploaded from a device"},
{id:"e18",obj:"4.5",term:"NAC posture check",def:"Verifying device health before letting it on the network"},
{id:"e19",obj:"4.5",term:"Dissolvable agent",def:"Runs at connect, checks the device, then removes itself"},
{id:"e20",obj:"4.5",term:"EDR",def:"Endpoint detection with automated response and root-cause analysis"},
{id:"e21",obj:"4.5",term:"XDR",def:"Detection correlated across endpoint, network, cloud and email"},
{id:"e22",obj:"4.5",term:"User behavior analytics",def:"Flags deviations from each user's normal behaviour"},
/* ---------- 4.6 Identity & Access Management ---------- */
{id:"f1",obj:"4.6",term:"De-provisioning",def:"Removing access promptly when someone leaves or moves"},
{id:"f2",obj:"4.6",term:"Privilege creep",def:"Collecting access with each role change and never losing any"},
{id:"f3",obj:"4.6",term:"Identity proofing",def:"Confirming someone is who they claim before issuing credentials"},
{id:"f4",obj:"4.6",term:"Attestation",def:"Periodic sign-off that each person's access is still correct"},
{id:"f5",obj:"4.6",term:"Federation",def:"Trusting identities managed by another organization"},
{id:"f6",obj:"4.6",term:"LDAP",def:"Protocol for querying directories, built on X.500"},
{id:"f7",obj:"4.6",term:"SAML",def:"XML assertions from an identity provider for web SSO"},
{id:"f8",obj:"4.6",term:"OAuth",def:"Delegated authorization via tokens, without sharing the password"},
{id:"f9",obj:"4.6",term:"MAC",def:"Access by labels and clearances users can't change"},
{id:"f10",obj:"4.6",term:"DAC",def:"The resource owner decides who gets access"},

var SVGNS = "http://www.w3.org/2000/svg";
function CERTMIG(o,n){try{if(localStorage.getItem(n)===null){var v=localStorage.getItem(o);if(v!==null)localStorage.setItem(n,v);}}catch(e){}}
var STORE_KEY = "secplus:domain4match:v1";CERTMIG("domain4match:v1","secplus:domain4match:v1");

/* ---------- elements ---------- */
var boardEl = document.getElementById("board");
var svgEl = document.getElementById("cables");
var termsCol = document.getElementById("col-terms");
var defsCol = document.getElementById("col-defs");
var tabsEl = document.getElementById("tabs");
var sizeEl = document.getElementById("sizegroup");
var barEl = document.getElementById("bar");
var statCount = document.getElementById("stat-count");
var statTime = document.getElementById("stat-time");
var statMoves = document.getElementById("stat-moves");
var statStreak = document.getElementById("stat-streak");
var statBestWrap = document.getElementById("stat-best-wrap");
var statBest = document.getElementById("stat-best");
var doneEl = document.getElementById("done");
var hintEl = document.getElementById("hint");

/* ---------- state ---------- */
var activeTab = "all";
var roundSize = 8;
var roundPairs = [];
var termEls = {};
var defEls = {};
var links = [];          /* {pairId, core, halo} */
var linked = 0;
var moves = 0;
var streak = 0;
var bestStreak = 0;
var startTime = null;
var timerHandle = null;
var armedTerm = null;
var drag = null;
var suppressClick = false;
var best = loadBest();

function loadBest(){
  try{ var raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : {}; }
  catch(e){ return {}; }
}
function saveBest(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(best)); }catch(e){}
}
function bestKey(){ return activeTab + ":" + roundSize; }

function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; }
  return a;
}
function poolForTab(tab){
  if(tab === "all") return PAIRS.filter(function(p){ return p.obj !== "gotchas"; });
  return PAIRS.filter(function(p){ return p.obj === tab; });
}
function fmtTime(ms){
  var s = Math.floor(ms/1000), m = Math.floor(s/60);
  s = s % 60;
  return m + ":" + (s<10?"0":"") + s;
}

/* ---------- chrome ---------- */
function buildTabs(){
  tabsEl.innerHTML = "";
  TAB_ORDER.forEach(function(k){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "tab" + (activeTab === k ? " active" : "");
    b.textContent = TAB_LABEL[k];
    b.setAttribute("role","tab");
    b.addEventListener("click", function(){
      if(activeTab === k) return;
      activeTab = k;
      startRound();
    });
    tabsEl.appendChild(b);
  });
}
function buildSizes(){
  sizeEl.innerHTML = "";
  SIZES.forEach(function(n){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "sizebtn" + (roundSize === n ? " active" : "");
    b.textContent = n + " pairs";
    b.addEventListener("click", function(){
      if(roundSize === n) return;
      roundSize = n;
      startRound();
    });
    sizeEl.appendChild(b);
  });
}

/* ---------- round ---------- */
function startRound(){
  buildTabs();
  buildSizes();
  clearInterval(timerHandle);
  timerHandle = null;
  startTime = null;
  linked = 0; moves = 0; streak = 0; bestStreak = 0;
  armedTerm = null; drag = null; suppressClick = false;
  links = [];
  svgEl.innerHTML = "";
  doneEl.classList.remove("show");
  boardEl.style.display = "";
  hintEl.style.display = "";

  var pool = shuffle(poolForTab(activeTab).slice());
  roundPairs = pool.slice(0, Math.min(roundSize, pool.length));

  statTime.textContent = "0:00";
  statMoves.textContent = "0";
  statStreak.classList.remove("show","hot");
  updateProgress();

  var bk = best[bestKey()];
  if(bk){
    statBestWrap.hidden = false;
    statBest.textContent = fmtTime(bk.timeMs);
  } else {
    statBestWrap.hidden = true;
  }

  renderBoard();
}

function renderBoard(){
  termsCol.innerHTML = "";
  defsCol.innerHTML = "";
  termEls = {}; defEls = {};

  var terms = shuffle(roundPairs.slice());
  var defs = shuffle(roundPairs.slice());

  terms.forEach(function(p){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "card term";
    b.dataset.pair = p.id;
    b.innerHTML = '<span>' + p.term + '</span><span class="port"></span>';
    wireTerm(b, p.id);
    termsCol.appendChild(b);
    termEls[p.id] = b;
  });

  defs.forEach(function(p){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "card def";
    b.dataset.pair = p.id;
    b.innerHTML = '<span class="port"></span><span>' + p.def + '</span>';
    b.addEventListener("click", function(){
      if(armedTerm) attempt(armedTerm, p.id);
    });
    defsCol.appendChild(b);
    defEls[p.id] = b;
  });
}

function updateProgress(){
  statCount.textContent = linked + "/" + roundPairs.length;
  barEl.style.width = (roundPairs.length ? (linked / roundPairs.length) * 100 : 0) + "%";
}

function startTimerIfNeeded(){
  if(startTime) return;
  startTime = Date.now();
  timerHandle = setInterval(function(){
    statTime.textContent = fmtTime(Date.now() - startTime);
  }, 250);
}

/* ---------- geometry ---------- */
function portPoint(el, side){
  var r = el.getBoundingClientRect();
  var b = boardEl.getBoundingClientRect();
  return { x: (side === "right" ? r.right : r.left) - b.left, y: r.top + r.height/2 - b.top };
}
function pathD(p1, p2){
  var dx = Math.max(34, Math.abs(p2.x - p1.x) * 0.42);
  return "M" + p1.x + "," + p1.y + " C" + (p1.x + dx) + "," + p1.y +
         " " + (p2.x - dx) + "," + p2.y + " " + p2.x + "," + p2.y;
}
function makePath(cls){
  var p = document.createElementNS(SVGNS, "path");
  p.setAttribute("class", cls);
  svgEl.appendChild(p);
  return p;
}
function redrawLinks(){
  links.forEach(function(l){
    var t = termEls[l.pairId], d = defEls[l.pairId];
    if(!t || !d) return;
    var dStr = pathD(portPoint(t, "right"), portPoint(d, "left"));
    l.core.setAttribute("d", dStr);
    l.halo.setAttribute("d", dStr);
    l.core.style.strokeDasharray = "";
    l.core.style.strokeDashoffset = "";
  });
}
if(window.ResizeObserver){
  new ResizeObserver(function(){ redrawLinks(); }).observe(boardEl);
} else {
  window.addEventListener("resize", redrawLinks);
}

/* ---------- interaction ---------- */
function disarm(){
  if(armedTerm && termEls[armedTerm]) termEls[armedTerm].classList.remove("armed");
  armedTerm = null;
}
function clearHot(){
  var hot = defsCol.querySelector(".card.hot");
  if(hot) hot.classList.remove("hot");
}

function wireTerm(el, pairId){
  el.addEventListener("pointerdown", function(ev){
    suppressClick = false;
    if(el.classList.contains("locked")) return;
    drag = { pairId: pairId, el: el, x0: ev.clientX, y0: ev.clientY, active: false, path: null };
    try{ el.setPointerCapture(ev.pointerId); }catch(e){}
  });

  el.addEventListener("pointermove", function(ev){
    if(!drag || drag.el !== el) return;
    var dist = Math.abs(ev.clientX - drag.x0) + Math.abs(ev.clientY - drag.y0);
    if(!drag.active){
      if(dist < 8) return;
      drag.active = true;
      disarm();
      startTimerIfNeeded();
      el.classList.add("dragging");
      drag.path = makePath("cable live");
    }
    ev.preventDefault();
    var b = boardEl.getBoundingClientRect();
    var from = portPoint(el, "right");
    var to = { x: ev.clientX - b.left, y: ev.clientY - b.top };
    drag.path.setAttribute("d", pathD(from, to));

    clearHot();
    var over = document.elementFromPoint(ev.clientX, ev.clientY);
    var card = over && over.closest ? over.closest(".card.def") : null;
    if(card && !card.classList.contains("locked")) card.classList.add("hot");
  });

  function endDrag(ev){
    if(!drag || drag.el !== el) return;
    var wasActive = drag.active;
    var path = drag.path;
    el.classList.remove("dragging");
    clearHot();

    if(wasActive){
      suppressClick = true;
      var over = document.elementFromPoint(ev.clientX, ev.clientY);
      var card = over && over.closest ? over.closest(".card.def") : null;
      if(card && !card.classList.contains("locked")){
        if(path) path.remove();
        drag = null;
        attempt(pairId, card.dataset.pair);
        return;
      }
      if(path){
        path.setAttribute("class", "cable badline");
        setTimeout(function(){ path.remove(); }, 180);
      }
    }
    drag = null;
  }
  el.addEventListener("pointerup", endDrag);
  el.addEventListener("pointercancel", function(ev){
    if(drag && drag.path) drag.path.remove();
    el.classList.remove("dragging");
    clearHot();
    drag = null;
  });

  el.addEventListener("click", function(){
    if(suppressClick){ suppressClick = false; return; }
    if(el.classList.contains("locked")) return;
    startTimerIfNeeded();
    if(armedTerm === pairId){ disarm(); return; }
    disarm();
    armedTerm = pairId;
    el.classList.add("armed");
  });
}

function attempt(termPairId, defPairId){
  startTimerIfNeeded();
  moves++;
  statMoves.textContent = String(moves);
  var t = termEls[termPairId], d = defEls[defPairId];
  disarm();

  if(termPairId === defPairId){
    lockPair(termPairId);
  } else {
    streak = 0;
    statStreak.classList.remove("show","hot");
    [t, d].forEach(function(el){
      if(!el) return;
      el.classList.add("wrong");
      setTimeout(function(){ el.classList.remove("wrong"); }, 360);
    });
  }
}

function lockPair(pairId){
  var t = termEls[pairId], d = defEls[pairId];
  var colorIdx = (linked % 6) + 1;
  var colorVar = "var(--cable-" + colorIdx + ")";

  var halo = makePath("cable halo c" + colorIdx);
  var core = makePath("cable core c" + colorIdx);
  var dStr = pathD(portPoint(t, "right"), portPoint(d, "left"));
  halo.setAttribute("d", dStr);
  core.setAttribute("d", dStr);

  var len = 0;
  try{ len = core.getTotalLength(); }catch(e){}
  if(len){
    core.style.strokeDasharray = len;
    core.style.strokeDashoffset = len;
    core.getBoundingClientRect();
    core.style.transition = "stroke-dashoffset .42s ease-out";
    core.style.strokeDashoffset = "0";
  }

  links.push({pairId: pairId, core: core, halo: halo});

  [t, d].forEach(function(el){
    el.style.setProperty("--pair-color", colorVar);
    el.classList.add("locked","justlocked");
    setTimeout(function(){ el.classList.remove("justlocked"); }, 420);
  });

  linked++;
  streak++;
  if(streak > bestStreak) bestStreak = streak;
  if(streak >= 2){
    statStreak.textContent = "streak ×" + streak;
    statStreak.classList.add("show");
    statStreak.classList.toggle("hot", streak >= 4);
  }
  updateProgress();

  if(linked === roundPairs.length) setTimeout(finish, 480);
}

function finish(){
  clearInterval(timerHandle);
  var elapsed = startTime ? Date.now() - startTime : 0;
  links.forEach(function(l, i){
    l.halo.classList.add("finale");
    l.halo.style.animationDelay = (i * 70) + "ms";
  });

  var bk = best[bestKey()];
  var isBest = !bk || elapsed < bk.timeMs;
  if(isBest){ best[bestKey()] = {timeMs: elapsed, moves: moves}; saveBest(); }

  document.getElementById("done-time").textContent = fmtTime(elapsed);
  var bestLine = document.getElementById("done-best");
  bestLine.textContent = isBest ? "New best for " + TAB_LABEL[activeTab] + " / " + roundSize + " pairs"
                                : "Best " + fmtTime(best[bestKey()].timeMs);
  var perfect = moves === roundPairs.length;
  document.getElementById("done-line").textContent =
    roundPairs.length + " pairs · " + moves + (moves === 1 ? " attempt" : " attempts") +
    (perfect ? " · clean run, no misses" : " · best streak " + bestStreak);

  setTimeout(function(){
    boardEl.style.display = "none";
    hintEl.style.display = "none";
    doneEl.classList.add("show");
  }, 900);
}

document.addEventListener("pointerdown", function(ev){
  if(!ev.target.closest(".card")) disarm();
});
document.getElementById("newround").addEventListener("click", startRound);
