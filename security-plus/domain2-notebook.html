<tr><td><strong>Isolation</strong></td><td>Cut a system off from everything else &mdash; containing an infected host, or quarantining a legacy app that can't be patched.</td></tr>
<tr><td><strong>Patching</strong></td><td>The single highest-value mitigation. Closes the vulnerability rather than working around it.</td></tr>
<tr><td><strong>Encryption</strong></td><td>Data stays unreadable without the key, so theft of the storage doesn't mean loss of the data.</td></tr>
<tr><td><strong>Monitoring</strong></td><td>You cannot respond to what you cannot see. Feeds the indicators of compromise in 2.4.</td></tr>
<tr><td><strong>Least privilege</strong></td><td>Every account gets the minimum rights its job requires, so a compromised account yields the least possible access.</td></tr>
<tr><td><strong>Configuration enforcement</strong></td><td>Systems are continuously checked against an approved baseline and corrected when they drift &mdash; posture assessment on connection is a common form.</td></tr>
<tr><td><strong>Decommissioning</strong></td><td>Retiring a system properly: wiping or destroying its data, revoking its credentials and certificates, and removing it from inventory. A forgotten live server is unmonitored attack surface.</td></tr>
</table></div>
<p><strong>Separation of duties</strong> is the control the objectives assume you already hold: no one person is given enough privilege to carry a sensitive process through from start to finish, so misuse requires collusion rather than a single dishonest employee. The classic illustration is payroll &mdash; whoever prepares a paycheck must not be the person who authorizes it.</p>
<div class="tblwrap"><table><caption>Separation of duties and the controls built around it</caption>
<tr><th>Control</th><th>How it works</th></tr>
<tr><td><strong>Static separation</strong></td><td>Conflicting roles are defined in advance, and the system refuses to grant both of them to one identity.</td></tr>
<tr><td><strong>Dynamic separation (the two-person rule)</strong></td><td>The conflict is evaluated at access time instead: the action proceeds only while a second authorized person is present and participating.</td></tr>
<tr><td><strong>Dual control</strong></td><td>Two people must act <em>together</em> for one action to complete &mdash; two signatures on a transfer, two key holders opening a safe.</td></tr>
<tr><td><strong>Job rotation</strong></td><td>Staff move between roles periodically, so nobody quietly accumulates control of a whole process and a successor is likely to notice what a predecessor hid.</td></tr>
<tr><td><strong>Mandatory vacation</strong></td><td>Staff are required to take leave, and their work is audited while they are away and unable to keep a concealment running.</td></tr>
</table></div>
<p>Separation of duties and <strong>least privilege</strong> are the paired answer to any insider-fraud scenario: least privilege limits how much one person can <em>reach</em>, and separation of duties makes sure that whatever they can reach is not enough to finish the job alone.</p>
<blockquote><span class="tag">Gotcha</span><strong>Separation of duties</strong> splits one task so no single person can complete it; <strong>least privilege</strong> limits how much any one person can touch at all. An administrator who both raises and approves vendor payments is a separation-of-duties failure, not a least-privilege failure &mdash; each right may be entirely appropriate to the role on its own.</blockquote>
<blockquote><span class="tag">Gotcha</span>Isolation and segmentation get confused. <strong>Segmentation</strong> is a design decision made in advance about how the network is divided; <strong>isolation</strong> is usually a response &mdash; pulling one system out of contact after something goes wrong.</blockquote>
`},
{id:"harden",obj:"2.5",title:"Hardening Techniques",html:`
<p>Hardening reduces a system's attack surface before anything goes wrong. The seven named techniques:</p>
<ol>
<li><strong>Encryption</strong> &mdash; full-disk encryption on endpoints so a lost or stolen device isn't a data breach.</li>
<li><strong>Endpoint protection</strong> &mdash; anti-malware and EDR installed and actually reporting to a management console.</li>
<li><strong>Host-based firewall</strong> &mdash; filters traffic at the individual machine, which still applies when the attacker is already inside the network perimeter.</li>
<li><strong>Host-based intrusion prevention system (HIPS)</strong> &mdash; inspects traffic and behaviour on the host and blocks recognized attacks, rather than only filtering by port and address.</li>
<li><strong>Disabling ports and protocols</strong> &mdash; every listening service is potential surface. If nothing needs it, turn it off.</li>
<li><strong>Default password changes</strong> &mdash; factory credentials are published in the product documentation and are among the first things scanned for. Default <em>names</em> count too: replace the stock workgroup name, SSID and device name, which advertise the make and model an attacker should go and look up.</li>
<li><strong>Removal of unnecessary software</strong> &mdash; anything installed must be patched and monitored. Removing it is cheaper than maintaining it, which is why bloatware matters.</li>
</ol>
<p>One further hardening habit the objectives do not name but scenarios do: <strong>disable auto-negotiating features</strong> wherever a device will settle its own configuration with whatever is plugged into it. The standard example is a switch port left on dynamic trunking &mdash; an attached device can negotiate the port into trunk mode and reach every VLAN the switch carries. Set the role explicitly rather than letting the port decide, and apply the same thinking to any protocol that will silently agree to a weaker or broader mode on request.</p>
<blockquote><span class="tag">Gotcha</span>A host-based firewall filters by <em>port, address and protocol</em>. A HIPS inspects <em>content and behaviour</em> and can block a recognized attack arriving over a port you deliberately left open.</blockquote>
`}
];

var GOTCHAS_TABLE = `
<div class="tblwrap"><table><caption>Every pink callout in Domain 2, collected</caption>
<tr><th>Pair</th><th>The distinction</th></tr>
<tr><td>Vulnerability vs. threat vs. risk</td><td>A weakness vs. the potential to exploit it vs. likelihood &times; impact</td></tr>
<tr><td>Internal vs. external actor</td><td>An attribute of the <em>actor's access</em>, not of where the attack happens</td></tr>
<tr><td>Blackmail vs. extortion</td><td>Pay or we release it vs. pay or we keep attacking</td></tr>
<tr><td>Disinformation vs. misinformation</td><td>False with intent to deceive vs. repeated without that intent</td></tr>
<tr><td>Phishing vs. pharming</td><td>Fools the person vs. corrupts name resolution</td></tr>
<tr><td>Phishing vs. vishing vs. smishing</td><td>Email vs. voice call vs. SMS</td></tr>
<tr><td>Impersonation vs. pretexting</td><td>Who you claim to be vs. the story supporting the claim</td></tr>
<tr><td>Spear phishing vs. whaling vs. BEC</td><td>Specific target vs. senior executive vs. sophisticated campaign, often from a real compromised account</td></tr>
<tr><td>Watering hole vs. supply chain</td><td>Compromise a site the target <em>visits</em> vs. a company that <em>supplies</em> them</td></tr>
<tr><td>Attack surface vs. threat vector</td><td>Everywhere an attack could come from vs. the route actually taken</td></tr>
<tr><td>Remote vs. local exploit</td><td>No authenticated session needed vs. must run from an authenticated session</td></tr>
<tr><td>Client-based vs. agentless scanning</td><td>Installed agent reporting to a server vs. no installation &mdash; the recon favourite</td></tr>
<tr><td>Supplier vs. vendor vs. business partner</td><td>Bulk to businesses vs. sells on to retail/customers vs. closely aligned goals</td></tr>
<tr><td>Malicious insider vs. shadow IT</td><td>Deliberate abuse of granted access vs. unsanctioned kit creating unmonitored surface</td></tr>
<tr><td>Memory injection vs. buffer overflow</td><td>Code placed inside a running process vs. writing past the end of a buffer</td></tr>
<tr><td>Time-of-check vs. time-of-use</td><td>Two halves of one race condition &mdash; the flaw lives in the gap between them</td></tr>
<tr><td>SQL injection vs. XSS</td><td>Targets the server's database vs. targets another user's browser</td></tr>
<tr><td>Reflected vs. stored XSS</td><td>Fires once from a crafted link vs. saved on the server and fires for every visitor</td></tr>
<tr><td>End-of-life vs. legacy</td><td>Vendor stopped supporting it vs. you're still running it anyway</td></tr>
<tr><td>VM escape vs. resource reuse</td><td>Breaking out to the host vs. reading what the last tenant left behind</td></tr>
<tr><td>Side loading vs. jailbreaking</td><td>One unvetted app vs. dismantling the device's whole security model</td></tr>
<tr><td>Virus vs. worm</td><td>Needs a user to run something vs. self-propagates with no user action</td></tr>
<tr><td>Reflected vs. amplified DDoS</td><td>Hides the source via spoofing vs. chooses protocols whose replies dwarf the request</td></tr>
<tr><td>Rogue AP vs. evil twin</td><td>Unauthorized but often innocent vs. purpose-built to impersonate and intercept</td></tr>
<tr><td>Replay vs. on-path</td><td>Resends captured data later vs. modifies traffic live from the middle</td></tr>
<tr><td>CSRF vs. SSRF</td><td>Abuses the user's session vs. abuses the server's network position</td></tr>
<tr><td>Collision vs. birthday attack</td><td>The result vs. the statistical method that makes finding one feasible</td></tr>
<tr><td>Brute force vs. spraying</td><td>Many passwords at one account vs. one password across many &mdash; spraying exists to beat lockout</td></tr>
<tr><td>Segmentation vs. isolation</td><td>Designed-in division of the network vs. pulling one system out after something goes wrong</td></tr>
<tr><td>Host firewall vs. HIPS</td><td>Filters by port and address vs. inspects behaviour and blocks attacks on open ports</td></tr>
<tr><td>ASLR vs. DEP</td><td>Randomizes where code sits vs. stops data memory from executing</td></tr>
<tr><td>Malicious code (network attack)</td><td>Code spread or delivered across the network — worms, scripts, backdoors, C2</td></tr>
<tr><td>Dictionary vs. brute force vs. spraying</td><td>A word list plus character substitutions vs. every possible combination vs. one password tried against many accounts</td></tr>
<tr><td>Separation of duties vs. least privilege</td><td>Splitting a task so no one person completes it vs. limiting what one person can reach</td></tr>
<tr><td>Side-channel vs. cryptographic attack</td><td>Attacks the implementation &mdash; timing, power, emissions vs. attacks the mathematics of the algorithm</td></tr>
</table></div>
<p style="font-size:13px;color:var(--text-muted);">Keep this list under 10% of your own marks when you transfer any of it &mdash; if everything's a gotcha, nothing is.</p>
`;

var SEARCH_INDEX = {};
(function buildIndex(){
  var scratch = document.createElement("div");
  TOPICS.forEach(function(t){
    scratch.innerHTML = t.title + " " + t.html;
    SEARCH_INDEX[t.id] = (scratch.textContent || "").toLowerCase();
  });
})();

var activeTab = "all";
var query = "";
var openIds = {};

var tabsEl = document.getElementById("tabs");
function buildTabs(){
  tabsEl.innerHTML = "";
  TAB_ORDER.forEach(function(k){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "tab" + (activeTab === k && !query ? " active" : "");
    b.textContent = TAB_LABEL[k];
    b.setAttribute("role","tab");
    b.addEventListener("click", function(){
      activeTab = k;
      searchInput.value = "";
      query = "";
      clearBtn.hidden = true;
      render();
    });
    tabsEl.appendChild(b);
  });
}

var searchInput = document.getElementById("search");
var clearBtn = document.getElementById("clear-search");
searchInput.addEventListener("input", function(){
  query = searchInput.value.trim().toLowerCase();
  clearBtn.hidden = query.length === 0;
  render();
});
clearBtn.addEventListener("click", function(){
  searchInput.value = "";
  query = "";
  clearBtn.hidden = true;
  render();
});

var listEl = document.getElementById("topiclist");
var emptyEl = document.getElementById("empty-state");
var notesEl = document.getElementById("results-note");

function matchingTopics(){
  if(query){
    return TOPICS.filter(function(t){ return SEARCH_INDEX[t.id].indexOf(query) !== -1; });
  }
  if(activeTab === "all") return TOPICS;
  if(activeTab === "gotchas") return [];
  return TOPICS.filter(function(t){ return t.obj === activeTab; });
}

function topicCard(t, forceOpen){
  var isOpen = !!openIds[t.id] || forceOpen;
  var div = document.createElement("div");
  div.id = "t-" + t.id;
  div.className = "topic" + (isOpen ? " open" : "");
  div.innerHTML =
    '<button class="topic-head" type="button">' +
      '<h2>' + t.title + '</h2>' +
      '<span style="display:flex;align-items:center;gap:8px;">' +
        '<span class="topic-badge">' + t.obj + '</span>' +
        '<span class="chev">&#9656;</span>' +
      '</span>' +
    '</button>' +
    '<div class="topic-body">' + t.html + '</div>';
  div.querySelector(".topic-head").addEventListener("click", function(){
    var nowOpen = !div.classList.contains("open");
    div.classList.toggle("open", nowOpen);
    openIds[t.id] = nowOpen;
  });
  return div;
}

function render(){
  buildTabs();
  listEl.innerHTML = "";
  notesEl.hidden = true;
  emptyEl.hidden = true;

  if(activeTab === "gotchas" && !query){
    var card = document.createElement("div");
    card.className = "topic open";
    card.innerHTML =
      '<button class="topic-head" type="button"><h2>Domain 2 Gotchas &mdash; quick-scan compare cards</h2>' +
      '<span class="chev">&#9656;</span></button>' +
      '<div class="topic-body">' + GOTCHAS_TABLE + '</div>';
    card.querySelector(".topic-head").addEventListener("click", function(){
      card.classList.toggle("open");
    });
    listEl.appendChild(card);
    return;
  }

  var matches = matchingTopics();

  if(query){
    notesEl.hidden = false;
    notesEl.textContent = matches.length + (matches.length === 1 ? ' result for "' : ' results for "') + searchInput.value.trim() + '"';
  }

  if(matches.length === 0){
    emptyEl.hidden = false;
    return;
  }

  matches.forEach(function(t){
    var forceOpen = !!query && matches.length <= 6;
    listEl.appendChild(topicCard(t, forceOpen));
  });

  if(!query && matches.length > 0 && Object.keys(openIds).length === 0){
    listEl.firstChild.classList.add("open");
  }
}

render();

/* open a topic when arriving from a link like notebook.html#topic-id */
function openFromHash(){
  var h = decodeURIComponent((location.hash || "").replace(/^#/, ""));
  if(!h || !TOPICS.some(function(t){ return t.id === h; })) return;
  activeTab = "all"; query = ""; searchInput.value = ""; clearBtn.hidden = true;
  openIds = {}; openIds[h] = true;
  render();
  var el = document.getElementById("t-" + h);
  if(!el) return;
  setTimeout(function(){
    var bar = document.querySelector(".topbar");
    var y = el.getBoundingClientRect().top + window.pageYOffset - (bar ? bar.offsetHeight : 0) - 12;
    window.scrollTo(0, Math.max(0, y));
  }, 50);
}
openFromHash();
window.addEventListener("hashchange", openFromHash);
})();
</script>
</body>
</html>
