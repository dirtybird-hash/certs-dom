var TOPICS = [
{id:"vtr",obj:"2.1",title:"Vulnerability, Threat &amp; Risk",html:`
<p>Three words the exam uses precisely, and mixing them up costs easy marks.</p>
<ul>
<li><strong>Vulnerability</strong> &mdash; a weakness that could be triggered accidentally or exploited intentionally. Misconfigured hardware or software, unpatched systems, poor network design, weak physical security, insecure passwords, design flaws in an OS.</li>
<li><strong>Threat</strong> &mdash; the potential for someone or something to exploit that weakness. A threat may be intentional or unintentional. The person or thing behind it is the <strong>threat actor</strong>; the path or tool they use is the <strong>threat vector</strong>.</li>
<li><strong>Risk</strong> &mdash; the level of hazard the combination creates. Risk is calculated as the <em>likelihood</em> of a vulnerability being exploited multiplied by the <em>impact</em> if it is.</li>
</ul>
<p>Severity of a vulnerability is driven by two things: the value of the vulnerable asset, and how easy the fault is to exploit.</p>
<blockquote><span class="tag">Gotcha</span>A vulnerability is a <em>weakness</em>, a threat is the <em>potential to exploit it</em>, and risk is <em>likelihood &times; impact</em>. A vulnerability with no threat actor interested in it still carries near-zero risk.</blockquote>
`},
{id:"attrs",obj:"2.1",title:"Attributes of Threat Actors",html:`
<p>Three attributes profile any actor, and all three are named directly in the objectives.</p>
<div class="tblwrap"><table><caption>The three attributes</caption>
<tr><th>Attribute</th><th>What it means</th></tr>
<tr><td><strong>Internal / external</strong></td><td>The degree of access the actor holds <em>before</em> the attack starts. External = no account, no authorized access, must break in. Internal = already granted permissions (employee, contractor, partner).</td></tr>
<tr><td><strong>Level of sophistication / capability</strong></td><td>Low capability actors rely on commodity tools that are widely available. Higher capability actors write new exploits. At the top, an actor can reach for non-cyber tools &mdash; political or military assets.</td></tr>
<tr><td><strong>Resources / funding</strong></td><td>High capability has to be paid for. Sophisticated groups need custom tooling and skilled strategists, coders, and social engineers. The best-funded receive money from nation-states or organized crime.</td></tr>
</table></div>
<p><strong>Putting the attributes together.</strong> Most actor questions can be answered by profiling on all three attributes at once:</p><ul><li><strong>Nation-state</strong> &mdash; external, very high capability, very high funding.</li><li><strong>Organized crime</strong> &mdash; external, high capability, well funded by its own profits.</li><li><strong>Hacktivist</strong> &mdash; external, capability varies widely, usually limited funding.</li><li><strong>Unskilled attacker</strong> &mdash; external, low capability, little or no funding.</li><li><strong>Insider</strong> &mdash; internal, capability varies, low funding needed because access is already granted.</li><li><strong>Shadow IT</strong> &mdash; internal, usually well-meaning, no attack funding at all.</li></ul><p>If a scenario describes custom malware and years of undetected access, the resources point to a nation-state; commodity tools downloaded from a forum point to an unskilled attacker. Treat that as a heuristic rather than a rule, because <strong>Ransomware as a Service</strong> rents sophisticated tooling by subscription &mdash; capable malware in evidence no longer proves a capable, well-funded actor is the one operating it.</p>
<blockquote><span class="tag">Gotcha</span>Internal vs. external describes the <strong>threat actor</strong>, not where the attack physically happens. An external actor can absolutely attack on-premises &mdash; walking into the building doesn't make them an insider. What makes an insider is having been granted access.</blockquote>
`},
{id:"motives",obj:"2.1",title:"Motivations of Threat Actors",html:`
<p>Motivation is the actor's <em>reason</em>. The exam pairs motivations with actor types constantly.</p>
<p><strong>Strategies</strong> &mdash; the three broad plays:</p>
<ul>
<li><strong>Service disruption</strong> &mdash; stop the organization working normally. Can be an end in itself (chaos, revenge), a blackmail lever, or cover for a different objective.</li>
<li><strong>Data exfiltration</strong> &mdash; copy valuable information out without authorization, to keep, to sell, or to use as leverage.</li>
<li><strong>Disinformation</strong> &mdash; falsify a trusted resource: deface a site, poison search results, use bots to push false information.</li>
</ul>
<p><strong>Financial motivations</strong> &mdash; three that get confused:</p>
<ul>
<li><strong>Blackmail</strong> &mdash; pay us or we <em>release</em> this information.</li>
<li><strong>Extortion</strong> &mdash; pay us or we <em>continue</em> the attack (classic ransomware).</li>
<li><strong>Fraud</strong> &mdash; falsifying records. Internal fraud tampers with accounts to embezzle; external fraud might post fake news to move a share price.</li>
</ul>
<p><strong>Other motivations named in the objectives:</strong> espionage, philosophical/political beliefs, ethical (authorized testing), revenge, disruption/chaos, and war.</p>
<p><strong>War</strong> as a motivation means cyber attacks used as part of armed conflict between nations: disabling an adversary's military systems, power grids, communications or financial infrastructure. It maps to <strong>nation-state</strong> actors, who have the resources and the political backing, and it often runs alongside physical military action.</p>
<blockquote><span class="tag">Gotcha</span>Blackmail threatens to <em>release</em> something; extortion threatens to <em>keep doing</em> something. Both demand payment &mdash; the difference is whether the leverage is information they hold or damage they're causing.</blockquote>
`},
{id:"hackers",obj:"2.1",title:"Hackers, Unskilled Attackers &amp; Hacktivists",html:`
<p>The terminology has shifted. <strong>Black hat / white hat</strong> is being replaced by neutral language: <strong>unauthorized</strong> and <strong>authorized</strong>. An authorized hacker always seeks permission before penetration testing.</p>
<ul>
<li><strong>Unskilled attacker</strong> (formerly "script kiddie") &mdash; uses hacker tools without understanding how they work or being able to craft new attacks. Often no specific target and no goal beyond attention or proving ability.</li>
<li><strong>Hacktivist</strong> &mdash; uses cyber weapons to promote a political agenda. Typical plays are data exfiltration to release confidential material publicly, service disruption, or defacement to spread disinformation. Political, media, and financial organizations are the usual targets, though environmental and animal-advocacy groups target a much wider range of industries.</li>
</ul>
<p>The "lone hacker" image is dated. Threat actors now usually work in teams, and the collaboration is exactly what lets them develop sophisticated tooling and original strategies.</p>
`},
{id:"nation",obj:"2.1",title:"Nation-State Actors &amp; APTs",html:`
<p>Most nation-states have developed cyber capability and use it for military and commercial goals.</p>
<p><strong>Advanced Persistent Threat (APT)</strong> describes a behavior, not a piece of malware: the ability of an adversary to achieve <em>ongoing</em> compromise of network security &mdash; to obtain access and <em>maintain</em> it &mdash; using a variety of tools and techniques. The term came out of Mandiant's APT1 report into Chinese cyber-espionage units.</p>
<ul>
<li>Primary goals are <strong>espionage</strong> and strategic advantage, plus disinformation. North Korea is the standing example of a state targeting companies for straight financial gain.</li>
<li>State actors work at arm's length from the government that sponsors them to maintain <strong>plausible deniability</strong>, often posing as independent groups or hacktivists.</li>
<li><strong>False flag</strong> operations deliberately try to implicate another state.</li>
</ul>
<p>Commonly cited incidents: the Sony hack and WannaCry (both attributed to North Korea), and China's Great Cannon.</p>
<blockquote><span class="tag">Gotcha</span>APT is not a type of malware and not a specific group &mdash; it's the <em>persistence</em> of the compromise. If a question stresses long-term, undetected, maintained access, it's pointing at APT behavior.</blockquote>
`},
{id:"orgcrime",obj:"2.1",title:"Organized Crime &amp; Competitors",html:`
<p><strong>Organized crime</strong> operates across legal jurisdictions &mdash; attacking from a different country than the victim, which massively complicates prosecution. Motivation is criminal profit, typically financial fraud against individuals and companies, plus blackmail and extortion. These groups can be very well resourced and funded. SIM swap fraud is a classic illustration.</p>
<p><strong>Competitors</strong> &mdash; most espionage is assumed to be state-driven, but a rogue business may use cyber espionage against a competitor to steal information, disrupt their operation, or damage their reputation. These attacks are often facilitated by employees who recently switched companies and brought insider knowledge with them, which blurs the line into insider threat.</p>
<blockquote><span class="tag">Gotcha</span>The lines between organized crime, nation-state actors, and intent are genuinely blurry in the real world &mdash; the Garmin ransomware incident is the standard example. On the exam, follow the stated <em>motivation</em>: profit points to organized crime, strategic/political advantage points to a nation-state.</blockquote>
`},
{id:"insider",obj:"2.1",title:"Internal Threat Actors &amp; Shadow IT",html:`
<p>An <strong>insider threat</strong> arises from an actor the organization itself identified and granted access to. Distinguish insiders with permanent privileges (employees) from those with temporary ones (contractors, guests, partners).</p>
<ul>
<li><strong>Malicious insider</strong> &mdash; has or has had authorized access. Main motivators are revenge and financial gain; also sabotage and business advantage.</li>
<li><strong>Unintentional insider threat</strong> &mdash; no malice, just weak policies, weak adherence to them, or missing training and awareness. Poor password management is the everyday example.</li>
<li><strong>Shadow IT</strong> &mdash; users introducing hardware or software into the workplace without IT's sanction and without any procurement or security review. Cloud services and mobile devices have made this far easier, and every instance creates unmonitored attack surface. The motive is nearly always operational: the approved tool is too slow or too limited, the formal request process takes weeks, or someone simply wants to experiment. That matters for the exam, because the countermeasure is a faster and more usable sanctioned route &mdash; not a disciplinary one.</li>
</ul>
<p>Shadow IT is named as a threat actor in its own right in objective 2.1 &mdash; don't treat it only as a vulnerability.</p>
<blockquote><span class="tag">Gotcha</span>Not every insider threat is malicious. If the scenario describes carelessness, missing training, or someone spinning up an unapproved cloud app, that's unintentional insider threat or shadow IT &mdash; not a disgruntled saboteur.</blockquote>
`},

{id:"surface",obj:"2.2",title:"Attack Surface &amp; Threat Vectors",html:`
<p>The <strong>attack surface</strong> is all the points at which a threat actor could try to exploit a vulnerability. Any place an actor can interact with a network port, app, computer, or user is part of it. Surfaces exist at every scope: the whole organization, a single server, one web app, or employee identities and accounts.</p>
<p>A <strong>threat vector</strong> is the specific path used to execute the attack. Sophisticated actors use multiple vectors and plan multistage campaigns rather than one smash-and-grab.</p>
<p>Minimizing attack surface means restricting access so only a few known endpoints, protocols/ports, and services are permitted &mdash; each then assessed for vulnerabilities and monitored.</p>
<p><strong>The vector categories, as the objectives name them.</strong> Worth memorizing in this exact wording, because questions ask you to classify:</p>
<div class="tblwrap"><table><caption>Objective 2.2, top-level categories</caption>
<tr><th>Delivery</th><th>Exposure</th></tr>
<tr><td>Message-based (email, SMS, IM)<br>Image-based<br>File-based<br>Voice call<br>Removable device</td><td>Vulnerable software (client-based vs. agentless)<br>Unsupported systems and applications<br>Unsecure networks (wireless, wired, Bluetooth)<br>Open service ports<br>Default credentials<br>Supply chain (MSPs, vendors, suppliers)<br>Human vectors / social engineering</td></tr>
</table></div>
<blockquote><span class="tag">Gotcha</span>Surface vs. vector: the <em>surface</em> is everywhere an attack could come from; the <em>vector</em> is the route actually taken. Highly capable actors can develop original vectors, which means their map of your surface may be better than yours.</blockquote>
`},
{id:"software",obj:"2.2",title:"Vulnerable &amp; Unsupported Software",html:`
<p>Vulnerable software contains a flaw in code or design that can be exploited to bypass access control or crash a process. Because of software complexity and release speed, almost nothing is free of vulnerabilities &mdash; and an organization without effective patch management leaves them standing.</p>
<p>Running many different operating systems and applications directly increases attack surface. Consolidating to fewer products, at the same version across the organization, shrinks it.</p>
<p><strong>Unsupported systems and applications</strong> are the sharpest version of this: the vendor no longer issues updates or patches, so exploits stay exploitable forever. Where the app can't be replaced, the strategy is <em>isolation</em> &mdash; which is itself a compensating control standing in for patch management.</p>
<div class="tblwrap"><table><caption>Vulnerability scanning approaches</caption>
<tr><th>Approach</th><th>How it works</th></tr>
<tr><td><strong>Client-based</strong></td><td>An agent is installed on each host, runs the scan locally, and reports to a management server.</td></tr>
<tr><td><strong>Agentless</strong></td><td>Scans a host without installing anything. This is the form most likely to be used in threat actor reconnaissance.</td></tr>
</table></div><p>The same client-based vs. agentless split matters for the software you run, not just scanning. A client-based approach puts an agent on every endpoint &mdash; one more piece of software that must be patched and that could itself be exploited, but it sees the host in detail. Agentless relies on remote connections and credentials, so it installs nothing but has less visibility, and devices that cannot run an agent at all (printers, IoT, appliances) often end up with the fewest controls.</p>

`},
{id:"network",obj:"2.2",title:"Unsecure Networks, Open Ports &amp; Default Credentials",html:`
<p>An exploit is classed by where the code has to run:</p>
<ul>
<li><strong>Remote</strong> &mdash; triggered by sending code over a network, with no authenticated session required.</li>
<li><strong>Local</strong> &mdash; the exploit code must run from an authenticated session. It can still cross a network, but the actor needs valid credentials or a hijacked session.</li>
</ul>
<p>An <strong>unsecure network</strong> is one lacking the CIA properties, and each failure maps to an attack class:</p>
<div class="tblwrap"><table>
<tr><th>Missing property</th><th>What the actor can do</th><th>Attack name</th></tr>
<tr><td>Confidentiality</td><td>Snoop traffic, recover passwords</td><td>Eavesdropping</td></tr>
<tr><td>Integrity</td><td>Attach unauthorized devices, intercept and modify traffic, run spoofed services</td><td>On-path</td></tr>
<tr><td>Availability</td><td>Disrupt the service</td><td>Denial of service (DoS)</td></tr>
</table></div>
<p><strong>Specific vectors named in the objectives:</strong></p>
<ul>
<li><strong>Direct access</strong> &mdash; physical presence: an unlocked workstation, a boot disk, a stolen laptop or drive.</li>
<li><strong>Wired</strong> &mdash; an unauthorized device attached to a physical network port and allowed to talk to other hosts.</li>
<li><strong>Wireless / remote</strong> &mdash; stolen credentials, cracked security protocols, or a spoofed access point used for credential harvesting. (<strong>WEP</strong> and the rest of the wireless protocol family are covered in the Domain 1 notebook.)</li>
<li><strong>Bluetooth</strong> &mdash; exploiting a vulnerability or misconfiguration to push a malicious file to a device. Also on the list: attacks on <strong>pairing</strong>, where the actor intercepts the exchange or brute-forces a weak pairing method such as a short or fixed PIN to become a trusted device; and Bluetooth <strong>sniffing</strong>, capturing the radio traffic of a link already in use. Short range is the real limit on both, not the protocol's strength.</li>
<li><strong>Cloud</strong> &mdash; the actor only needs one account, service, or host with weak credentials. Developer and cloud-admin accounts are prime targets, as is the cloud service provider itself.</li>
<li><strong>Default credentials</strong> &mdash; a device or app left on its factory password, which is usually published in the setup documentation.</li>
<li><strong>Open service ports</strong> &mdash; an unauthenticated connection to a TCP or UDP port whose listening application may be exploitable or disruptable. Actors and defenders alike find them by port scanning: <strong>Nmap</strong> is the standard tool for detailed scanning with service and version detection, and <strong>Masscan</strong> for sweeping very large address ranges at speed.</li>
</ul><p>Default credentials are why IoT devices get recruited into botnets so easily. The Mirai botnet simply scanned the internet for cameras and routers still using factory usernames and passwords, logged in, and turned hundreds of thousands of them into a DDoS army &mdash; no exploit required. Changing defaults on first setup closes this vector completely.</p>

`},
{id:"lure",obj:"2.2",title:"File-Based, Image-Based &amp; Removable Device",html:`
<p>Three of the vector categories named in objective 2.2, and they work the same way: a <strong>lure</strong> &mdash; something attractive that conceals something dangerous. The target opens the bait and it delivers the payload. These get used when the actor can't run a remote or local exploit directly and needs the user to do the work for them.</p>
<div class="tblwrap"><table><caption>The three delivery categories, in the exam's own wording</caption>
<tr><th>Category</th><th>What it looks like</th></tr>
<tr><td><strong>File-based</strong></td><td>Exploit code inside a file the user opens or runs. An executable is the blunt version &mdash; <strong>Trojan Horse</strong> malware looks free, useful or fun while creating backdoor access. Document files are subtler: malicious code embedded in word processing or PDF files, using macro and scripting features or a flaw in the viewer itself.</td></tr>
<tr><td><strong>Image-based</strong></td><td>Exploit code concealed inside an image, targeting a vulnerability in the browser or the document-editing software that renders it. Listed separately from file-based because images are trusted and previewed automatically in a way documents are not. (<strong>Steganography</strong>, hiding data inside the image itself, is covered in the Domain 1 notebook.)</td></tr>
<tr><td><strong>Removable device</strong></td><td>Malware on a USB stick or memory card. In a <strong>drop attack</strong> the actor leaves infected sticks in a parking lot or reception area and waits for an employee to plug one in. For some exploits, connecting the media is enough.</td></tr>
</table></div>
<p>Reducing this surface means endpoint security management: vulnerability management, antivirus, execution control, and intrusion detection.</p>
<p>Macro malware is usually written in <strong>VBA</strong> (Visual Basic for Applications), the scripting language built into Office.</p>
<p>Removable media's big advantage to an attacker is that it skips the network entirely. The firewall, email filter and web proxy never see the file, which is why USB delivery is the classic route into an air-gapped network &mdash; Stuxnet is the standard example. Mitigations are endpoint-level: disable autorun, block or restrict USB storage by policy, and scan media before use.</p>
<p>Note which way round the exam frames <strong>auto-run</strong>. It is not only a mitigation to be switched off; it is the <em>feature being exploited</em>. An operating system willing to execute something from inserted media without being asked is the whole reason a dropped USB stick works, so auto-run belongs on your list of vulnerable features as well as on your list of hardening steps.</p>
<p>Removable media also runs the other way. The same stick that carries malware in carries data out, and <strong>exfiltration</strong> by removable device bypasses every network control the organization owns &mdash; DLP on the mail gateway and the web proxy never see the file leave. That is why USB storage restriction, endpoint DLP and physical port blocking appear as data-protection controls and not only as anti-malware ones.</p>
<blockquote><span class="tag">Gotcha</span>The objectives list <strong>file-based</strong> and <strong>image-based</strong> as separate vector categories, so a question can ask you to classify one. If the payload rode in on a picture, the answer is image-based even though an image is technically a file.</blockquote>
`},
{id:"message",obj:"2.2",title:"Message-Based &amp; Voice Call Vectors",html:`
<p>A file-based lure still needs a delivery mechanism, so any feature allowing direct messaging to users is attack surface. The objectives name <strong>message-based</strong> as one category with three sub-items &mdash; email, SMS and IM &mdash; and list <strong>voice call</strong> separately as a category of its own.</p>
<p><strong>Message-based</strong>, the three named channels:</p>
<ul>
<li><strong>Email</strong> &mdash; the classic. Needs social engineering to get the attachment opened.</li>
<li><strong>SMS</strong> &mdash; delivered via the handset's messaging handler and the <strong>SS7</strong> protocol, which carries numerous known vulnerabilities. Organizations typically have <em>no</em> monitoring capability over SMS, since it's operated by the handset or SIM provider.</li>
<li><strong>Instant messaging (IM)</strong> &mdash; supports voice, video, and attachments. Usually encrypted, which is more secure than SMS but also means the organization can't scan messages or attachments for threats.</li>
</ul>
<p><strong>Voice call</strong> is its own named category in the objectives, not a sub-item of message-based. The actor phones the target directly to talk them into revealing a password or weakening a configuration under a pretext &mdash; no file, no link, nothing for a filter to catch.</p>
<p>Not a named category but worth knowing: <strong>web and social media</strong> deliver malware through attached posts and downloads, and a compromised site can infect a vulnerable browser with no deliberate download at all &mdash; a <strong>drive-by download</strong>.</p>
<p>The most powerful exploits are <strong>zero-click</strong>: simply receiving an attachment or viewing an image triggers the exploit, with no user action at all.</p>
`},
{id:"commvectors",obj:"2.2",title:"Voice, Video &amp; Messaging Infrastructure",html:`
<p>The systems behind message-based and voice-call vectors each carry their own risks:</p>
<ul>
<li><strong>VoIP</strong> (Voice over IP) &mdash; calls carried as data. Caller ID is trivially spoofed, which is what makes vishing convincing; call signalling and media should be encrypted (SIP over TLS, SRTP).</li>
<li><strong>PBX</strong> (private branch exchange) &mdash; the organization's phone switch. Compromised PBXs are used for <em>toll fraud</em>, running up expensive international calls, and for eavesdropping.</li>
<li><strong>POTS</strong> (plain old telephone service) &mdash; analog lines, still behind fax machines, alarm panels and old modems; a forgotten modem line is an unmonitored way in.</li>
<li><strong>VTC</strong> (video teleconferencing) &mdash; uninvited guests joining meetings, recordings leaking, and now deepfaked participants.</li>
<li><strong>MMS</strong> (Multimedia Message Service) &mdash; picture and video messages; malformed media files have delivered zero-click exploits to phones.</li>
<li><strong>SPIM</strong> (spam over instant messaging) &mdash; the chat-app version of email spam, often carrying phishing links.</li>
<li><strong>P2P</strong> (peer-to-peer) file sharing &mdash; downloads from strangers bring malware and can expose shared folders full of company data.</li>
</ul>
`},
{id:"supply",obj:"2.2",title:"Supply Chain Attack Surface",html:`
<p>A supply chain is the end-to-end process of designing, manufacturing, and distributing goods and services. Rather than attack a target directly, an actor infiltrates through a company in its supply chain &mdash; the Target breach came in via credentials held by the company's <em>building systems</em> vendor.</p>
<div class="tblwrap"><table><caption>Three relationships the objectives distinguish</caption>
<tr><th>Relationship</th><th>Definition</th></tr>
<tr><td><strong>Supplier</strong></td><td>Obtains products directly from a manufacturer to sell in bulk to other businesses (B2B).</td></tr>
<tr><td><strong>Vendor</strong></td><td>Obtains products from suppliers to sell to retail businesses or directly to customers. May add customization and direct support.</td></tr>
<tr><td><strong>Business partner</strong></td><td>A closer relationship with closely aligned goals and shared marketing opportunities.</td></tr>
</table></div>
<p>Every supplier has its own supply chain, so the breadth is enormous: for one motherboard to be trustworthy, the chip fabricator, firmware developer, OEM reseller, courier, and the staff who provision the device must <em>all</em> be trustworthy. Securing it essentially means denying malicious actors the time or resources to modify what's supplied. For most businesses, using reputable vendors is the best practical effort; government and military exercise far greater scrutiny. Take particular care with secondhand equipment.</p>
<p><strong>Managed service providers (MSPs)</strong> provision and support IT resources on an outsourced basis. From a security standpoint this is complex &mdash; the MSP is hard to monitor, and every one of its employees is a potential insider threat.</p><p>The attraction of an MSP to an attacker is scale: one compromise delivers a trusted, already-authenticated path into every client that MSP manages. That one-to-many effect &mdash; the <strong>cascading</strong> failure of a single compromise down every branch of the chain &mdash; is why MSPs and widely used software vendors are high-value targets &mdash; the Kaseya ransomware attack spread to many downstream businesses through a single MSP management tool. Limit what access a provider holds, require MFA on their accounts, and monitor their activity like any other privileged user.</p>

`},
{id:"human",obj:"2.2",title:"Human Vectors &amp; Social Engineering",html:`
<p>People &mdash; employees, contractors, suppliers, customers &mdash; are collectively the <strong>human vector</strong>. <strong>Social engineering</strong> means either eliciting information from someone or getting them to perform an action for the actor. Also called "hacking the human," and it includes written communication, not just face-to-face.</p>
<p>It serves two purposes: <strong>reconnaissance</strong> (gathering intelligence ahead of an intrusion) and <strong>intrusion</strong> itself (obtaining credentials or getting malware run).</p>
<p>Three illustrative scenarios from the lecture:</p>
<ol>
<li>An actor emails a user an executable that prompts for their password, with a story about clearing up login problems. The user complies; the actor now has credentials.</li>
<li>An actor calls the help desk posing as a remote sales rep needing access setup, and over several calls extracts the remote access server name, login credentials, and phone numbers.</li>
<li>An actor triggers a fire alarm and slips into the building during the confusion to attach a monitoring device to a network port.</li>
</ol>
`},
{id:"imperson",obj:"2.2",title:"Impersonation &amp; Pretexting",html:`
<p><strong>Impersonation</strong> is simply pretending to be someone else. It works when the target can't easily verify identity &mdash; over the phone or by email. Two approaches:</p>
<ul>
<li><strong>Persuasive / consensus / liking</strong> &mdash; convince the target the request is natural and that refusing would be impolite or odd.</li>
<li><strong>Coercion / threat / urgency</strong> &mdash; intimidate with a bogus appeal to authority or a penalty: getting fired, or failing to prevent some dire outcome.</li>
</ul>
<p><strong>Pretexting</strong> is the use of a carefully crafted story with convincing additional detail to support the impersonation. A convincing pretext usually depends on the actor first obtaining privileged information &mdash; which is why reconnaissance matters. Seemingly innocuous material (employee lists, job titles, phone numbers, invoices, purchase orders) is exactly what makes impersonation work, and most companies are set up for customer service rather than security, so it's easy to come by.</p>
<blockquote><span class="tag">Gotcha</span>Impersonation is <em>who you claim to be</em>; pretexting is <em>the story you tell to support it</em>. Pretexting exploits situations where identity-proofing is difficult.</blockquote>
`},
{id:"phishing",obj:"2.2",title:"Phishing, Vishing, Smishing &amp; Pharming",html:`
<p><strong>Phishing</strong> combines social engineering and spoofing: it tricks the target into interacting with a malicious resource disguised as a trusted one, traditionally over email. Either the message persuades the user to act (install malware, allow remote access), or a spoofed site imitates a bank or e-commerce site and captures credentials when the user logs in.</p>
<div class="tblwrap"><table><caption>Phishing by channel</caption>
<tr><th>Term</th><th>Channel</th></tr>
<tr><td><strong>Phishing</strong></td><td>Email (traditionally)</td></tr>
<tr><td><strong>Vishing</strong></td><td>Voice call</td></tr>
<tr><td><strong>Smishing</strong></td><td>SMS / text message</td></tr>
</table></div>
<p><strong>Pharming</strong> redirects users from a legitimate site to a malicious one &mdash; but <em>without</em> tricking the user. It corrupts name resolution so the victim's own computer sends them to the wrong address: if <code>mybank.foo</code> should resolve to 2.2.2.2, pharming makes it resolve to 6.6.6.6 instead.</p>
<blockquote><span class="tag">Gotcha</span>Phishing relies on <em>fooling the person</em>; pharming relies on <em>corrupting name resolution</em>. In a pharming attack the user can type the correct address themselves and still land on the malicious site.</blockquote>
`},
{id:"typo",obj:"2.2",title:"Typosquatting &amp; Brand Impersonation",html:`
<p>Phishing and pharming both depend on impersonation succeeding &mdash; the message or site must appear to come from a trusted source.</p>
<ul>
<li><strong>From-field confusion</strong> &mdash; email clients don't always show the real sending address, displaying instead a "From" field the actor can set to anything. Less common now, since filtering can flag a mismatch between actual and claimed sender.</li>
<li><strong>Typosquatting</strong> &mdash; registering a domain very close to a real one, such as <code>exannple.com</code>, hoping users won't notice. Also called <strong>cousin</strong>, <strong>lookalike</strong>, or <strong>doppelganger</strong> domains.</li>
<li><strong>Hijacked subdomain</strong> &mdash; registering under a trusted cloud provider's primary domain, so a message from <code>example.onmicrosoft.com</code> inherits misplaced trust.</li>
<li><strong>Brand impersonation</strong> &mdash; convincing fake messages, correspondence, and pharming sites built to pass as a known brand.</li>
</ul>
`},
{id:"bec",obj:"2.2",title:"Business Email Compromise &amp; Watering Holes",html:`
<p>Where ordinary phishing is a mass-mailer, <strong>business email compromise (BEC)</strong> is a sophisticated campaign targeting one specific individual &mdash; typically an executive or senior manager. The actor poses as a colleague, business partner, or vendor, and performs real reconnaissance to find the right psychological approach and pretext. They avoid the obvious tells: no spoofed links, no malware attachments. The strongest version first compromises a legitimate mail account and sends from it.</p>
<p>Related targeted forms: <strong>spear phishing</strong> (a specific individual or small group), <strong>whaling</strong> (a senior executive), <strong>CEO fraud</strong>, and <strong>angler phishing</strong> (via social media).</p>
<p>A <strong>watering hole attack</strong> targets a group indirectly, by compromising a third-party site the actor knows they use. The worked example: staff at an international e-commerce company all order from one local pizza delivery firm, so the actor compromises the <em>pizza firm's</em> website and infects the employees' computers from there.</p>
<blockquote><span class="tag">Gotcha</span><strong>Disinformation</strong> is false material spread with intent to deceive. <strong>Misinformation</strong> is repeating false claims without that intent. A disinformation campaign often works by getting others to amplify it as misinformation.</blockquote>
`},

{id:"meminject",obj:"2.3",title:"Memory Injection",html:`
<p>Nothing runs on a machine until it is loaded from disk into memory, so malware has to get into memory too. It has two options: run as its own process, or <strong>inject itself into a process that is already running</strong>.</p>
<p>Injecting into an existing process buys the attacker two things at once:</p>
<ul>
<li><strong>Evasion</strong> &mdash; anti-malware looking for a suspicious <em>process</em> sees only the legitimate one.</li>
<li><strong>Inherited privilege</strong> &mdash; the injected code runs with the same rights and permissions as its host process, which is an easy route to <strong>privilege escalation</strong>.</li>
</ul>
<p><strong>DLL injection</strong> is the most common form on Windows. A DLL (dynamic-link library) is shared executable code that many applications call. The attacker plants a malicious DLL somewhere the system can reach, then arranges for a target process to reference that path. When the process runs and reaches the point where it loads that library, it pulls the attacker's code into memory itself.</p>
<blockquote><span class="tag">Gotcha</span>Memory injection isn't about writing <em>too much</em> data &mdash; that's buffer overflow. Injection is about placing code inside a legitimate process's address space so it runs with that process's identity.</blockquote>
`},
{id:"overflow",obj:"2.3",title:"Buffer Overflow",html:`
<p>A <strong>buffer overflow</strong> is writing more data into an area of memory than that area was sized to hold, so the excess spills into adjacent memory. The root cause is missing <strong>bounds checking</strong> &mdash; the developer never verified that input fits the space reserved for it.</p>
<p>Most overflows are useless to an attacker. Overwriting adjacent memory with arbitrary data usually just crashes the application or the system. What an attacker actually wants is an overflow that is:</p>
<ol>
<li><strong>Repeatable</strong> &mdash; it produces the same result every time.</li>
<li><strong>Controllable</strong> &mdash; the spilled bytes land somewhere useful and carry a value the attacker chose.</li>
</ol>
<p>The classic payoff is overflowing one variable into an adjacent one that governs rights or permissions, so the attacker gains elevated access without ever presenting credentials.</p>
`},
{id:"memprotect",obj:"2.3",title:"Memory Protections &mdash; ASLR, DEP &amp; SEH",html:`
<p>Operating systems add defences that make buffer overflows and memory injection much harder to exploit, even when the bug exists:</p>
<div class="tblwrap"><table><caption>Memory protections</caption>
<tr><th>Protection</th><th>What it does</th></tr>
<tr><td><strong>ASLR</strong> &mdash; Address Space Layout Randomization</td><td>Loads programs and libraries at random memory addresses each time, so an attacker can't predict where to jump</td></tr>
<tr><td><strong>DEP</strong> &mdash; Data Execution Prevention</td><td>Marks data areas of memory (stack, heap) as non-executable, so code injected there can't run</td></tr>
<tr><td><strong>SEH</strong> &mdash; Structured Exception Handler</td><td>Windows' error-handling mechanism. Overwriting its records was a classic exploit technique; SafeSEH and SEHOP protect it</td></tr>
</table></div>
<blockquote><span class="tag">Gotcha</span>ASLR randomizes <strong>where</strong> code lives; DEP controls <strong>whether</strong> memory can execute. They're usually used together.</blockquote>
`},
{id:"race",obj:"2.3",title:"Race Conditions &mdash; TOC / TOU",html:`
<p>A <strong>race condition</strong> occurs when two events happen at nearly the same time and the application was never written to handle them overlapping. The developer assumed a sequence; reality delivered a collision.</p>
<p>The named exam form is <strong>time-of-check to time-of-use (TOCTOU)</strong>:</p>
<ol>
<li><strong>Time-of-check (TOC)</strong> &mdash; the application checks a value or a condition.</li>
<li>Something else changes that value in the gap.</li>
<li><strong>Time-of-use (TOU)</strong> &mdash; the application acts on the value it checked earlier, which is now stale.</li>
</ol>
<p>Financial systems are the textbook setting: if deposits post immediately but withdrawals lag, two overlapping transfers can leave an account holding money that was already spent. The same pattern appears anywhere a check and an action are separated in time.</p>
<blockquote><span class="tag">Gotcha</span>Learn TOC and TOU as two halves of one attack, not two attacks. The vulnerability lives in the <em>gap between them</em>, which is why a question describing "verified, then acted on stale data" is pointing at a race condition.</blockquote>
`},
{id:"malupdate",obj:"2.3",title:"Malicious Updates",html:`
<p>Patching is standard advice, which is exactly what makes the update channel attractive. Every update is effectively installing a new application &mdash; so if an attacker can get code into the update, the victim installs it willingly and with full trust.</p>
<p>Best practice around updating:</p>
<ol>
<li><strong>Back up first.</strong> If the update goes wrong, you can revert.</li>
<li><strong>Verify the source.</strong> Download from the developer's own site, not a third-party mirror.</li>
<li><strong>Distrust unsolicited prompts.</strong> An update notice that appears when you launch the application is plausible; one that pops up mid-browsing after clicking a search result is a classic lure.</li>
<li><strong>Validate integrity</strong> where the vendor publishes hashes or signatures.</li>
</ol>
<blockquote><span class="tag">Gotcha</span>A malicious update is a <strong>supply chain</strong> problem wearing a patch-management costume. If the scenario stresses that the software came from the vendor's own update mechanism, think supply chain, not phishing.</blockquote>
`},
{id:"osvuln",obj:"2.3",title:"Operating System Vulnerabilities",html:`
<p>The OS is the largest single body of code on a machine and sits underneath everything else, so a flaw there potentially exposes every application running on top of it. Attackers watch patch releases closely &mdash; a published fix also publishes the existence of the weakness for anyone who hasn't applied it yet.</p>
<p>The exposure comes from three directions: the gap between a patch being released and being deployed, systems that cannot be patched without breaking a dependent application, and operating systems that are past vendor support entirely and will never receive a fix.</p><p>The usual payoff of an OS flaw is privilege escalation. An attacker who has a foothold as an ordinary user exploits a bug in the <strong>kernel</strong>, in a <strong>device driver</strong> or in a service to become administrator or SYSTEM/root, and from there can disable security tools, dump credentials and move laterally. Drivers earn their own mention: they are third-party code running at kernel privilege, patched on the hardware vendor's schedule rather than the OS vendor's, and a signed-but-vulnerable driver can be loaded deliberately to attack the kernel from the inside. Weak OS access controls &mdash; services running with too much privilege, writable system folders &mdash; lead to the same result without any bug at all.</p>

`},
{id:"webvuln",obj:"2.3",title:"Web-Based &mdash; SQL Injection &amp; XSS",html:`
<p>Both are injection flaws, but they attack different targets.</p>
<div class="tblwrap"><table><caption>The two named web-based vulnerabilities</caption>
<tr><th></th><th>SQL injection (SQLi)</th><th>Cross-site scripting (XSS)</th></tr>
<tr><td>Injected into</td><td>A database query</td><td>A web page</td></tr>
<tr><td>Executes on</td><td>The database server</td><td>Another user's browser</td></tr>
<tr><td>Attacker gains</td><td>Read, modify or destroy data; sometimes authentication bypass</td><td>Session tokens, credentials, actions taken as the victim</td></tr>
<tr><td>Root cause</td><td>User input concatenated into a query instead of parameterized</td><td>User input rendered into a page without encoding</td></tr>
</table></div>
<p><strong>XSS</strong> has two forms worth separating: <strong>reflected</strong> (the script rides in a crafted link and fires once when the victim clicks it) and <strong>stored / persistent</strong> (the script is saved on the server &mdash; in a comment or profile field &mdash; and fires for every visitor afterwards).</p>
<p>XSS works because the injected script ends up inside the page's <strong>HTML</strong> (Hypertext Markup Language) and the browser can't tell it from the site's own code. Encoding output so special characters display as text rather than markup is a key defence.</p>
<blockquote><span class="tag">Gotcha</span>SQLi targets the <em>server's database</em>; XSS targets <em>another user's browser</em>. If the victim in the scenario is a visitor rather than the data, it's XSS.</blockquote>
`},
{id:"hwvuln",obj:"2.3",title:"Hardware Vulnerabilities",html:`
<p>Three named categories, and they are about <em>support status</em> as much as about silicon:</p>
<ul>
<li><strong>Firmware</strong> &mdash; the code running inside the hardware itself. Only the manufacturer can patch it, so you are entirely dependent on the vendor releasing a fix and on your ability to deploy it.</li>
<li><strong>End-of-life (EOL)</strong> &mdash; the manufacturer has stopped selling the product, and <strong>end-of-support (EOS)</strong> is the paired term for the date after which it will issue no more patches, updates or help. No more fixes are coming, ever.</li>
<li><strong>Legacy</strong> &mdash; the device is still in production use well past its intended lifespan, often because replacing it means replacing a process built around it.</li>
</ul>
<p>Firmware compromise is valued by attackers for persistence. Because firmware sits below the operating system, malicious code there survives an OS reinstall and even a disk replacement, and OS-level security tools usually cannot see it. That is why firmware integrity checks and Secure Boot matter, and why the fix for a firmware infection may be reflashing from a trusted image or replacing the hardware.</p>
<blockquote><span class="tag">Gotcha</span>End-of-life is the vendor's decision to stop supporting; legacy is your organization's decision to keep running it anyway. A legacy device may still be supported; an EOL device by definition is not.</blockquote>
`},
{id:"virtvuln",obj:"2.3",title:"Virtualization Vulnerabilities",html:`
<p>Virtualization puts multiple tenants on shared physical hardware, which creates two failure modes the objectives name directly:</p>
<ul>
<li><strong>VM escape</strong> &mdash; code breaks out of its guest virtual machine and reaches the hypervisor or the host. This is the serious one: the whole security model assumes guests stay contained, so an escape potentially exposes every other VM on that host.</li>
<li><strong>Resource reuse</strong> &mdash; memory or storage released by one VM is reallocated to another without being cleared, so the new tenant can read remnants of the previous tenant's data.</li>
</ul>
`},
{id:"cloudvuln",obj:"2.3",title:"Cloud-Specific Vulnerabilities",html:`
<p>Cloud platforms shift where the weaknesses live rather than removing them. The recurring ones:</p>
<ul>
<li><strong>Misconfigured storage and permissions</strong> &mdash; publicly readable buckets and over-broad roles remain the single most common cause of cloud data exposure.</li>
<li><strong>Weakly protected management consoles</strong> &mdash; one compromised administrative account can reach everything, from anywhere on the internet.</li>
<li><strong>Shared responsibility confusion</strong> &mdash; the provider secures the infrastructure; the customer secures their own data, identities and configuration. Gaps appear where each side assumes the other is covering something.</li>
<li><strong>Availability</strong> &mdash; a denial of service against a cloud-hosted service, or an outage at the provider, takes the organization down with it.</li>
</ul><p>Multi-tenancy is the other cloud-specific concern: many customers share the same physical hosts, storage and networks, kept apart only by the provider's logical isolation. A flaw in that isolation (the same risk as VM escape and resource reuse) could expose one tenant to another, which is why regulated workloads sometimes pay for dedicated hosts.</p>

`},
{id:"supplyvuln",obj:"2.3",title:"Supply Chain Vulnerabilities",html:`
<p>Objective 2.3 names three providers, each a distinct route in:</p>
<div class="tblwrap"><table>
<tr><th>Provider</th><th>The exposure</th></tr>
<tr><td><strong>Service provider</strong></td><td>An outsourced partner with legitimate access to your systems &mdash; an MSP, a support contractor, a billing platform. Compromise them and their access becomes the attacker's access.</td></tr>
<tr><td><strong>Hardware provider</strong></td><td>Devices modified anywhere between fabrication and delivery. Counterfeit components, tampered firmware and an outright <strong>hardware-based backdoor</strong> are the concerns; secondhand equipment carries the highest risk.</td></tr>
<tr><td><strong>Software provider</strong></td><td>Malicious code introduced into a legitimate product, typically through its build pipeline or update channel, then distributed to every customer under the vendor's signature.</td></tr>
</table></div>
`},
{id:"cryptovuln",obj:"2.3",title:"Cryptographic Vulnerabilities",html:`
<p>Cryptography fails in practice far more often through implementation and lifecycle than through broken mathematics. The common weaknesses:</p>
<ul>
<li><strong>Deprecated algorithms</strong> still in use &mdash; MD5 and SHA-1 for anything security-relevant, DES, early SSL/TLS versions.</li>
<li><strong>Insufficient key length</strong> &mdash; a key short enough to brute force with current hardware.</li>
<li><strong>Poor key management</strong> &mdash; keys stored alongside the data they protect, hardcoded in source, shared across systems, or never rotated.</li>
<li><strong>Weak randomness</strong> &mdash; predictable initialization vectors or a poor entropy source makes otherwise sound encryption reversible.</li>
<li><strong>Protocol downgrade exposure</strong> &mdash; the system still accepts an older, weaker negotiation, which an attacker can force.</li>
</ul>
`},
{id:"misconfig",obj:"2.3",title:"Misconfiguration Vulnerabilities",html:`
<p>Not a flaw in the software &mdash; a flaw in how it was set up. This is consistently one of the most exploited categories precisely because it requires no vendor bug at all.</p>
<ul>
<li><strong>Default credentials</strong> left in place, published openly in the product documentation.</li>
<li><strong>Open permissions</strong> &mdash; files, shares or storage readable by far more people than intended.</li>
<li><strong>Unnecessary services and open ports</strong> running because they shipped enabled.</li>
<li><strong>Unsecured administrative interfaces</strong> reachable from untrusted networks.</li>
<li><strong>Disabled or unmonitored security features</strong> &mdash; logging switched off, firewall rules set to allow-all "temporarily."</li>
</ul>
`},
{id:"mobilevuln",obj:"2.3",title:"Mobile Device Vulnerabilities",html:`
<p>Mobile platforms are relatively hardened by default, so the named vulnerabilities are both about <em>removing</em> those protections:</p>
<ul>
<li><strong>Side loading</strong> &mdash; installing applications from outside the official app store, bypassing the vetting the store performs. The app arrives with no review and whatever permissions it asks for.</li>
<li><strong>Jailbreaking / rooting</strong> &mdash; removing the manufacturer's restrictions to gain full administrative control of the device. This breaks the platform's security model wholesale: app sandboxing weakens, unsigned code can run, and mobile device management controls can often be evaded entirely.</li>
</ul>
<blockquote><span class="tag">Gotcha</span>Side loading installs <em>one unvetted app</em>. Jailbreaking dismantles <em>the device's whole security model</em> &mdash; a far bigger problem, and one that can silently take a device out of MDM enforcement.</blockquote>
`},
{id:"zeroday",obj:"2.3",title:"Zero-Day Vulnerabilities",html:`
<p>A <strong>zero-day</strong> is a vulnerability not yet known to the vendor, so no patch exists and no signature detects it. The name refers to the vendor having had zero days to prepare a fix.</p>
<p>The lifecycle matters more than the definition:</p>
<ol>
<li>The flaw exists in shipped code, undiscovered.</li>
<li>Someone finds it. If that's an attacker, exploitation begins with no defence available.</li>
<li>The vendor learns of it and develops a patch.</li>
<li>The patch ships &mdash; and the vulnerability stops being a zero-day, though it stays exploitable on every unpatched system.</li>
</ol>
<p>Publicly tracked flaws are assigned <strong>CVE</strong> identifiers in a common database, which is how organizations correlate a vendor advisory with their own scanner findings.</p>
<p>Since there is no patch and no signature, zero-day defence relies on controls that do not need to recognize the specific exploit: behaviour-based detection and EDR, application allow listing, least privilege, segmentation to contain spread, and good monitoring to spot the after-effects. This is the strongest argument for defence in depth.</p>
<blockquote><span class="tag">Gotcha</span>A vulnerability stops being a zero-day the moment a patch is available &mdash; not when you get around to applying it. Unpatched systems afterwards are a patch-management failure, not a zero-day.</blockquote>
`},

{id:"malware1",obj:"2.4",title:"Malware &mdash; Ransomware, Trojans &amp; Worms",html:`
<div class="tblwrap"><table><caption>Distinguished by what they do and how they spread</caption>
<tr><th>Type</th><th>Behaviour</th><th>Spreads by</th></tr>
<tr><td><strong>Ransomware</strong></td><td>Encrypts data and demands payment for the key. Modern variants also exfiltrate first and threaten release &mdash; double extortion.</td><td>Delivered; doesn't self-spread</td></tr>
<tr><td><strong>Trojan</strong></td><td>Appears to be something useful or desirable while carrying a hidden payload, commonly backdoor access. A <strong>RAT</strong> (remote access trojan) gives the attacker interactive control.</td><td>The user installs it willingly</td></tr>
<tr><td><strong>Worm</strong></td><td>Self-replicating. Moves across the network under its own power with no user action at all, which is why worms spread so fast.</td><td>Itself, over the network</td></tr>
<tr><td><strong>Virus</strong></td><td>Attaches to a host file or program and needs that host to be executed to run and replicate.</td><td>A user running the infected host</td></tr>
</table></div>
<p><strong>Indicators to match to each type:</strong></p><ul><li><strong>Ransomware</strong> &mdash; files suddenly renamed with a new extension, ransom notes in every folder, a spike in disk activity, shadow copies/backups deleted, then files that will not open.</li><li><strong>Trojan / RAT</strong> &mdash; an unfamiliar program running after a download, new outbound connections to an unknown host, remote activity nobody at the keyboard performed.</li><li><strong>Worm</strong> &mdash; a sudden jump in traffic on one port (e.g. SMB 445) across many hosts at once, and rapid infections without users doing anything.</li><li><strong>Virus</strong> &mdash; modified or corrupted executables and documents, crashes tied to opening particular files.</li></ul>
<p><strong>Ransomware as a Service (RaaS)</strong> is ransomware sold as a subscription on dark-web markets &mdash; a subset of <strong>Malware as a Service</strong>. The developer builds and maintains the payload and the payment infrastructure, and affiliates rent it, run their own campaigns and split the proceeds. For scenario questions this means the operator behind an attack need not be the author of the tool, so capable ransomware in evidence proves nothing on its own about the skill or the funding of whoever deployed it.</p>
<p>A campaign also runs in a fixed order &mdash; installation, contact with a command-and-control server, key generation, encryption of the target files, then the ransom screen &mdash; which is why the indicators above surface when they do, with outbound C2 traffic preceding any file change and the ransom note appearing only once encryption has finished.</p>
<blockquote><span class="tag">Gotcha</span>The virus-versus-worm line is user action. A <strong>virus</strong> needs someone to run something; a <strong>worm</strong> propagates on its own. If the scenario says it spread across the network overnight with nobody clicking anything, it's a worm.</blockquote>
`},
{id:"malware2",obj:"2.4",title:"Spyware, Bloatware, Keyloggers, Logic Bombs &amp; Rootkits",html:`
<ul>
<li><strong>Spyware</strong> &mdash; monitors activity and reports back: browsing habits, credentials, screen contents. Often bundled with something the user installed deliberately.</li>
<li><strong>Bloatware</strong> &mdash; software preinstalled by the manufacturer that the user never asked for. Not malicious by design, but it enlarges the attack surface, often runs with high privilege, and frequently goes unpatched.</li>
<li><strong>Keylogger</strong> &mdash; captures keystrokes and sends them to the attacker. Exists in software form and as a physical inline device between keyboard and computer.</li>
<li><strong>Logic bomb</strong> &mdash; dormant code that fires on a trigger: a date and time, or an event such as a name disappearing from the payroll database. Classically an insider tool, and hard to detect because there is no ongoing activity to spot until it executes.</li>
<li><strong>Rootkit</strong> &mdash; embeds in the kernel or below it and modifies the operating system's own reporting so the malware becomes invisible to normal tools. Detection often requires booting from separate media; removal frequently means rebuilding the machine.</li>
</ul>
<p>Bootkits infect the <strong>MBR</strong> (master boot record) or boot loader so they run before the operating system and its security tools. UEFI Secure Boot, which checks the boot loader's signature, is the defence. Bloatware is also called a <strong>PUP</strong> (potentially unwanted program).</p>
<p><strong>Indicators to match to each type:</strong> spyware shows up as unknown processes, browser changes and steady outbound traffic reporting data; a keylogger as an unknown process or an unexpected device between keyboard and PC; a logic bomb usually only after it fires, often on a meaningful date or right after an employee's departure. A rootkit's tell is <em>inconsistency</em> &mdash; the machine's own tools report nothing, while an offline scan or a network capture shows files, processes or connections the OS is hiding.</p>
<blockquote><span class="tag">Gotcha</span>Bloatware is the odd one here &mdash; it isn't malware at all. It appears in this objective because unwanted preinstalled software is still a security problem, not because it's malicious.</blockquote>
`},
{id:"physatk",obj:"2.4",title:"Physical Attacks",html:`
<ul>
<li><strong>Brute force</strong> &mdash; in a physical context this is literal: forcing a door, cutting a lock, breaking through a barrier. The same term means password guessing elsewhere in this domain, so read the context.</li>
<li><strong>RFID cloning</strong> &mdash; copying an access badge. Many cards transmit a static identifier with no authentication, so a reader held near a victim's badge can capture it and a blank card can be written with the copy in seconds. <strong>Skimming</strong> is the payment-credential companion: a device overlaying a genuine card reader at an ATM, fuel pump or POS terminal captures the card data physically as the customer pays, usually paired with a hidden camera or an overlay keypad to capture the PIN.</li>
<li><strong>Environmental</strong> &mdash; attacking the conditions a facility depends on rather than the systems themselves: cutting power, defeating cooling so equipment overheats and shuts down, or interfering with fire suppression.</li>
</ul>
<p>The indicator of RFID cloning is in the access logs rather than on the door: the same badge used at two entrances at once, a badge entering while its owner is known to be elsewhere or on leave, or entries at odd hours. Environmental attacks show up as hardware sensor alerts &mdash; temperature, humidity or power warnings &mdash; followed by unexpected shutdowns.</p>
<blockquote><span class="tag">Gotcha</span>"Brute force" appears twice in objective 2.4 &mdash; once under physical attacks and once under password attacks. The answer depends entirely on whether the scenario describes a door or a login.</blockquote>
`},
{id:"dos",obj:"2.4",title:"Denial of Service &amp; DDoS",html:`
<p>A <strong>denial of service</strong> makes a resource unavailable to legitimate users. It can come from overwhelming volume, or from a single crafted request that crashes a vulnerable service &mdash; force does not have to mean traffic.</p>
<p>A <strong>distributed denial of service (DDoS)</strong> uses many compromised machines, typically a botnet, so the traffic arrives from thousands of sources at once. That makes it far harder to filter and far larger in volume.</p>
<div class="tblwrap"><table><caption>Two named amplification techniques</caption>
<tr><th>Technique</th><th>How it works</th></tr>
<tr><td><strong>Reflected</strong></td><td>The attacker sends requests to third-party servers with the victim's address spoofed as the source. Every reply goes to the victim, who never sees the attacker's real address.</td></tr>
<tr><td><strong>Amplified</strong></td><td>The same trick chosen for protocols where a small request produces a much larger response &mdash; DNS and NTP are the usual examples. A modest amount of attacker bandwidth turns into an overwhelming flood.</td></tr>
</table></div>
<p>The two are usually combined: reflection hides the origin, amplification supplies the volume.</p><p><strong>RTBH</strong> (remotely triggered black hole) routing is an ISP-level DDoS response: traffic to the targeted address is dropped at the provider's edge, via BGP, before it reaches your link. It stops the flood but also takes the target offline, so it's a last resort.</p>
<p>The tell for reflection and amplification is traffic you never asked for: a flood of DNS responses (source port 53) or NTP responses arriving from thousands of legitimate servers, with no matching requests from your side. A plain volumetric DDoS instead shows huge request volume from many botnet addresses. Either way the symptoms at the target are the same &mdash; saturated bandwidth, overloaded servers, services timing out.</p>

`},
{id:"dnsatk",obj:"2.4",title:"DNS Attacks",html:`
<p>DNS is trusted implicitly by nearly everything, which makes it a high-value target.</p>
<ul>
<li><strong>DNS poisoning / spoofing</strong> &mdash; corrupting cached name resolution so a legitimate hostname resolves to an attacker's address. The user types the correct name and still lands in the wrong place; this is the mechanism behind <strong>pharming</strong>.</li>
<li><strong>Domain hijacking</strong> &mdash; taking control of the domain registration itself, usually by compromising the registrar account. The attacker then controls where the entire domain points, legitimately, from the internet's point of view.</li>
<li><strong>URL redirection</strong> &mdash; modifying local resolution, often via a host file entry on the victim's machine, to send specific names elsewhere.</li>
<li><strong>DNS tunnelling</strong> &mdash; encoding other traffic inside DNS queries to slip data past a firewall that permits DNS unconditionally.</li>
</ul><p><strong>Indicators.</strong> DNS poisoning shows as a known hostname resolving to an unexpected IP address, often alongside certificate warnings when users reach the fake site. DNS tunnelling shows as an unusually high volume of queries to one domain, with long, random-looking subdomains and heavy use of TXT records &mdash; data being smuggled out in the query names.</p>

`},
{id:"wireless",obj:"2.4",title:"Wireless Attacks",html:`
<ul>
<li><strong>Deauthentication</strong> &mdash; forged management frames that kick a client off its access point. Used to cause disruption, or to force a reconnection the attacker can capture or redirect.</li>
<li><strong>Rogue access point</strong> &mdash; an unauthorized AP attached to the network, sometimes installed innocently by an employee. It creates an unmonitored entry point straight past the perimeter.</li>
<li><strong>Evil twin</strong> &mdash; an AP deliberately configured to impersonate a legitimate one, matching its SSID so clients associate automatically. Everything the victim sends then passes through the attacker.</li>
<li><strong>Jamming</strong> &mdash; flooding the frequency with interference so nothing can communicate. A pure availability attack, and one that can be used to push clients toward an evil twin.</li>
</ul>
<p><strong>WPS</strong> (Wi-Fi Protected Setup) lets devices join with an 8-digit PIN, but the PIN is checked in two halves, so it can be brute-forced in hours to recover the network passphrase. Disable WPS. A rogue <strong>WAP</strong> (wireless access point) is any access point that shouldn't be there.</p>
<blockquote><span class="tag">Gotcha</span>A <strong>rogue AP</strong> is unauthorized but not necessarily malicious &mdash; often just an employee adding coverage. An <strong>evil twin</strong> is purpose-built to impersonate and intercept. Intent is the difference.</blockquote>
`},
{id:"onpath",obj:"2.4",title:"On-Path Attacks",html:`
<p>An <strong>on-path attack</strong> puts the attacker between two communicating parties, able to read, modify, or block traffic while both endpoints believe they are talking directly to each other. The older name for this is man-in-the-middle.</p>
<ul>
<li><strong>ARP poisoning</strong> is the standard local-network method: the attacker sends forged ARP replies so victims associate the attacker's MAC address with the gateway's IP, routing their traffic through the attacker's machine. ARP has no authentication whatsoever, which is why this works.</li>
<li><strong>On-path browser</strong> (formerly man-in-the-browser) places malware inside the victim's browser instead of on the network. Because it sits inside the endpoint, it sees data <em>before</em> encryption and <em>after</em> decryption &mdash; TLS provides no protection at all against it.</li>
</ul><p>ARP poisoning only works inside the local area network (<strong>LAN</strong>), because ARP never crosses a router.</p>
<p><strong>Indicators.</strong> In an ARP table, two different IP addresses (typically the gateway and another host) mapped to the same MAC address is the classic sign of ARP poisoning. Users seeing certificate warnings for sites that normally work, or a site suddenly served over HTTP instead of HTTPS, suggests someone in the path is intercepting or stripping TLS.</p>

`},
{id:"replay",obj:"2.4",title:"Replay &amp; Credential Replay",html:`
<p>A <strong>replay attack</strong> captures valid data in transit and sends it again later. The attacker does not need to decrypt or understand it &mdash; if the receiving system accepts the same data twice, resending it is enough.</p>
<p><strong>Credential replay</strong> is the specific case of capturing an authentication exchange or session token and reusing it to impersonate the user, without ever learning the password.</p>
<p>Countermeasures all work by making each exchange unrepeatable:</p>
<ul>
<li><strong>Timestamps</strong> &mdash; reject anything outside a narrow time window.</li>
<li><strong>Nonces and session IDs</strong> &mdash; a value used once, so a replayed message carries a stale one.</li>
<li><strong>Sequence numbers</strong> &mdash; detect out-of-order or duplicated messages.</li>
</ul>
<p>Pass the hash is the credential replay example most likely to appear: in Windows networks using NTLM, an attacker who steals a password hash from memory can present the hash itself to authenticate to other systems &mdash; no cracking needed. Indicators are the same account logging on to many machines in a short time, or sessions from hosts that account never normally uses. Kerberos, restricting admin logons, and credential protection features reduce the risk.</p>
<blockquote><span class="tag">Gotcha</span>Replay reuses <em>captured legitimate data</em> unchanged; an on-path attack <em>modifies traffic in real time</em>. A replay attacker doesn't need to stay in the middle &mdash; only to have been there once.</blockquote>
`},
{id:"appatk",obj:"2.4",title:"Application Attacks",html:`
<div class="tblwrap"><table><caption>The six named application attacks</caption>
<tr><th>Attack</th><th>What happens</th></tr>
<tr><td><strong>Injection</strong></td><td>Untrusted input is interpreted as commands &mdash; SQL, LDAP, XML, or OS commands.</td></tr>
<tr><td><strong>Buffer overflow</strong></td><td>More data written than the buffer holds, spilling into adjacent memory.</td></tr>
<tr><td><strong>Replay</strong></td><td>Captured valid requests resubmitted to the application.</td></tr>
<tr><td><strong>Privilege escalation</strong></td><td>Gaining rights beyond what was granted. <em>Vertical</em> means reaching a higher level, typically admin. <em>Horizontal</em> means reaching another user's data at the same level.</td></tr>
<tr><td><strong>Forgery</strong></td><td><strong>CSRF</strong> makes an authenticated victim's browser submit an action the attacker chose. <strong>SSRF</strong> makes the server itself issue requests, often reaching internal systems the attacker cannot.</td></tr>
<tr><td><strong>Directory traversal</strong></td><td>Manipulating a file path &mdash; typically with <code>../</code> sequences &mdash; to read files outside the directory the application intended to expose.</td></tr>
</table></div>
<p>Cross-site request forgery is also abbreviated <strong>XSRF</strong>.</p>
<p><strong>Reading the logs.</strong> Web server and WAF logs usually give the attack away by its input: a single quote followed by strings such as <em>OR 1=1</em>, <em>UNION SELECT</em> or <em>--</em> points to SQL injection; <em>../</em> sequences or their URL-encoded form <em>%2e%2e%2f</em>, especially reaching for files like /etc/passwd, point to directory traversal; script tags in a form field point to XSS. For CSRF, the indicator is a state-changing action (password change, funds transfer) recorded against a user who says they never performed it.</p>
<blockquote><span class="tag">Gotcha</span>CSRF abuses the <em>user's</em> authenticated session; SSRF abuses the <em>server's</em> network position. Look at who is tricked into making the request.</blockquote>
`},
{id:"malcode",obj:"2.4",title:"Malicious Code as a Network Attack",html:`
<p>The objectives list <strong>malicious code</strong> among network attacks: code that is delivered, spread or executed over the network to gain access, take control, or damage systems. It overlaps with malware, but the emphasis here is how it travels and where it runs.</p>
<ul>
<li><strong>Worms exploiting network services</strong> &mdash; WannaCry spread across networks through a vulnerability in Windows SMB, with no user action needed.</li>
<li><strong>Malicious scripts and macros</strong> &mdash; PowerShell, Bash, Python or VBA (Visual Basic for Applications) code run on the target, often fetched from the internet after an initial foothold.</li>
<li><strong>Backdoors and loaders</strong> &mdash; code that opens remote access or downloads further payloads. Emotet started as a banking Trojan and became a delivery service for other malware.</li>
<li><strong>Injected web code</strong> &mdash; scripts planted in a legitimate site (as in XSS or a compromised third-party library) that run in every visitor's browser.</li>
<li><strong>Botnet command and control</strong> &mdash; infected machines take instructions over the network; early botnets used <strong>IRC</strong> (Internet Relay Chat) channels, modern ones use HTTPS, DNS or social media.</li>
</ul>
<p><strong>Indicators</strong>: unexpected outbound connections, new services or scheduled tasks, unknown processes, script-interpreter activity from Office apps. <strong>Mitigations</strong>: patch exposed services, anti-malware/EDR, block macros from the internet, restrict scripting, firewall and segment so a worm can't reach every host.</p>
<blockquote><span class="tag">Gotcha</span>If the scenario stresses code <strong>spreading or being delivered across the network</strong> with no file download by a user, think worm/malicious code as a network attack, not a user-installed Trojan.</blockquote>
`},
{id:"cryptoatk",obj:"2.4",title:"Cryptographic Attacks",html:`
<ul>
<li><strong>Downgrade</strong> &mdash; forcing the parties to negotiate a weaker algorithm or an older protocol version that the attacker can break. The target is never the strong cipher; it is the system's willingness to accept a weak one for compatibility.</li>
<li><strong>Collision</strong> &mdash; finding two different inputs that produce the same hash. Once collisions are practical, the hash can no longer prove integrity, since a malicious file can be made to match a legitimate file's fingerprint. This is what retired MD5.</li>
<li><strong>Birthday attack</strong> &mdash; the statistical shortcut that makes collisions cheaper than intuition suggests. From the birthday paradox: in a room of only 23 people there is roughly a 50% chance two share a birthday. Finding <em>any</em> two colliding inputs takes far less work than matching one specific target, which is why hash output length matters so much.</li>
</ul>
<p>A downgrade attack is spotted by connections negotiating an older protocol or weaker cipher than both ends support &mdash; for example, a modern client and server ending up on SSL 3.0 (the POODLE attack) or TLS 1.0. The fix is to disable the old versions and weak suites on the server so there is nothing to fall back to.</p>
<p><strong>Side-channel attacks</strong> go after the <em>implementation</em> rather than the mathematics. The algorithm is left untouched; the attacker measures what the device leaks while it is using the key &mdash; how long an operation takes, how much power it draws, its electromagnetic emissions, even the sound the hardware makes &mdash; and reconstructs the key from those measurements. <strong>Dragonblood</strong> is the worked example: a group of flaws in WPA3's <strong>SAE</strong> handshake, including timing and cache side channels that leaked enough about the password to make an offline dictionary attack practical against a handshake designed to prevent exactly that.</p>
<p><em>Enrichment, not a listed bullet.</em> The 2.4 crypto-attack bullets are downgrade, collision and birthday, so side-channel will not be the wording of an objective. Carry it anyway: it is the standard answer whenever a scenario insists the algorithm is sound and then asks how the key was recovered from a smart card or hardware token.</p>
<blockquote><span class="tag">Gotcha</span>A collision is the <em>result</em>; a birthday attack is the <em>method</em> that makes finding one feasible. They are not alternatives to each other.</blockquote>
`},
{id:"pwatk",obj:"2.4",title:"Password Attacks",html:`
<div class="tblwrap"><table>
<tr><th></th><th>Brute force</th><th>Spraying</th></tr>
<tr><td>Shape</td><td>Many passwords against one account</td><td>One common password against many accounts</td></tr>
<tr><td>Lockout risk</td><td>High &mdash; trips account lockout quickly</td><td>Low &mdash; that's the entire point of the technique</td></tr>
<tr><td>Detection</td><td>Repeated failures on a single account</td><td>Single failures spread across many accounts, easy to miss</td></tr>
</table></div>
<p><strong>Online</strong> attacks run against the live authentication system, which rate-limits and locks out. <strong>Offline</strong> attacks run against a stolen hash database on the attacker's own hardware, with no lockout and no rate limit &mdash; which is exactly why salted hashes and key stretching matter.</p>
<p>Offline cracking runs on <strong>GPUs</strong> (graphics processing units), which try billions of hashes per second. That speed is why unsalted fast hashes fall quickly, and why salting and key stretching matter.</p>
<p>Two further shapes sit alongside these. A <strong>dictionary attack</strong> works from a word list &mdash; real words, leaked passwords, names and sports teams &mdash; expanded with the predictable character substitutions people use to satisfy complexity rules (5 for s, @ for a, 3 for e). A <strong>hybrid attack</strong> combines the two approaches: it takes word-list entries and brute-forces permutations around them, appending digits and years, flipping capitalization and bolting symbols on the end.</p>
<p>This is why guidance shifted from complexity towards <em>length</em>. A short password made complex by substitution is still effectively on the word list, so a dictionary or hybrid run finds it; a long passphrase is not on any list, and each extra character multiplies the brute-force search space.</p>
<blockquote><span class="tag">Gotcha</span>Password spraying exists specifically to <em>defeat account lockout</em>. If the scenario mentions many accounts each seeing one or two failed attempts, it's spraying &mdash; and standard lockout policy will not catch it.</blockquote>
`},
{id:"ioc",obj:"2.4",title:"Indicators of Compromise",html:`
<p>The signals that suggest an intrusion is underway or has already happened. All eight are named in the objectives.</p>
<div class="tblwrap"><table>
<tr><th>Indicator</th><th>What it suggests</th></tr>
<tr><td><strong>Account lockout</strong></td><td>Someone is guessing that account's password &mdash; or has already changed it.</td></tr>
<tr><td><strong>Concurrent session usage</strong></td><td>One account active in two places at once; credentials are shared or stolen.</td></tr>
<tr><td><strong>Blocked content</strong></td><td>Repeated attempts to reach filtered resources, often malware calling home.</td></tr>
<tr><td><strong>Impossible travel</strong></td><td>Logins from two locations too far apart for the time elapsed. One of the strongest single signals of credential theft.</td></tr>
<tr><td><strong>Resource consumption</strong></td><td>Unexplained CPU, bandwidth or storage use &mdash; exfiltration, <strong>cryptojacking</strong> (crypto mining on hardware the attacker does not pay for), or encryption in progress.</td></tr>
<tr><td><strong>Resource inaccessibility</strong></td><td>Files or shares suddenly unreachable. A hallmark of ransomware mid-run.</td></tr>
<tr><td><strong>Out-of-cycle logging</strong></td><td>Activity at times that make no sense for the account, such as 3 a.m. administrative work.</td></tr>
<tr><td><strong>Missing logs</strong></td><td>Gaps in log data. An attacker covering their tracks &mdash; treat absence of evidence as evidence.</td></tr>
</table></div>
<p><strong>Published / documented</strong> indicators are the ones shared publicly by vendors and threat intelligence feeds &mdash; known file hashes, domains and addresses you can match against your own environment.</p>
<p>On the exam, <strong>published/documented</strong> also covers the case where evidence of <em>your</em> breach appears in public before you've noticed it yourself: your data dumped on a leak site or dark-web market, attackers boasting on social media, or a researcher or journalist reporting the breach. Finding your organization named that way is an indicator of compromise in its own right.</p>
<blockquote><span class="tag">Gotcha</span>Missing logs are an indicator, not a technical glitch. A gap where entries should be is one of the more reliable signs that someone with privilege has been cleaning up.</blockquote>
`},

{id:"segment",obj:"2.5",title:"Segmentation &amp; Access Control",html:`
<p><strong>Segmentation</strong> divides the network so a compromise in one area cannot reach everything else. It limits blast radius: an attacker who lands on a user workstation should not find the payment systems sitting on the same flat network. Implemented physically (separate hardware), logically (VLANs), or virtually (cloud security groups and microsegmentation).</p>
<p><strong>Access control</strong> decides who may do what once they are on the network:</p>
<ul>
<li><strong>Access control list (ACL)</strong> &mdash; an ordered set of rules evaluated top to bottom, permitting or denying based on source, destination, port or protocol. Order matters: the first match wins, and most lists end in an implicit deny.</li>
<li><strong>Permissions</strong> &mdash; rights assigned on the resource itself, governing who may read, write, execute or delete.</li>
</ul>
<blockquote><span class="tag">Gotcha</span>Segmentation controls <em>where traffic can go</em>; access control governs <em>what an identity may do</em>. Strong permissions on a flat network still leave an attacker free to move laterally and find something weaker.</blockquote>
`},
{id:"mitigate",obj:"2.5",title:"Mitigation Techniques",html:`
<p>The techniques named in objective 2.5, and what each one is actually for:</p>
<div class="tblwrap"><table>
<tr><th>Technique</th><th>Purpose</th></tr>
<tr><td><strong>Application allow list</strong></td><td>Only explicitly approved software may execute. Restrictive by default, and far stronger than blocking known-bad.</td></tr>
