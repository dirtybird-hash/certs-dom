<li><strong>Logon hours</strong> &mdash; the account can only authenticate inside a defined window; the time-of-day restriction above, expressed as a directory setting on the account itself.</li>
<li><strong>Maximum logon duration</strong> &mdash; a cap on how long any one session may run before it is forcibly ended, so a session nobody closed does not sit open all night.</li>
<li><strong>Location-based restriction</strong> &mdash; access tied to a network segment (this application only from the finance VLAN) or to geolocation (no logons from countries the organisation does not operate in). Geolocation is easily defeated by a VPN, so it earns its place as one condition among several rather than on its own.</li>
</ul>
<blockquote><span class="tag">Gotcha</span><strong>Role-based</strong> keys on the job title; <strong>rule-based</strong> keys on a condition that applies to everyone. If the scenario mentions labels and clearances, it's <strong>MAC</strong>; if it says the owner grants access, it's <strong>DAC</strong>; if it combines several conditions, it's <strong>ABAC</strong>.</blockquote>
`},
{id:"mfa",obj:"4.6",title:"Multifactor Authentication",html:`
<p><strong>MFA</strong> requires factors from <em>different categories</em>. Two passwords is still one factor.</p>
<div class="tblwrap"><table><caption>Factors</caption>
<tr><th>Factor</th><th>Examples</th></tr>
<tr><td><strong>Something you know</strong></td><td>Password, PIN, passphrase, unlock pattern, security question</td></tr>
<tr><td><strong>Something you have</strong></td><td>Smart card, security key, hardware or software token, a phone receiving a code</td></tr>
<tr><td><strong>Something you are</strong></td><td>Fingerprint, face, iris, retina, voice</td></tr>
<tr><td><strong>Somewhere you are</strong></td><td>GPS or IP geolocation, the network you're on. Usually a supporting check rather than a sole factor</td></tr>
</table></div>
<p>The named implementations:</p>
<ul>
<li><strong>Biometrics</strong> &mdash; stores a mathematical template, not a picture. Hard to change if compromised, so best combined with another factor. Accuracy trade-off: <em>false acceptance rate</em> (letting the wrong person in) vs. <em>false rejection rate</em> (locking the right person out); the <em>crossover error rate</em>, where they're equal, is how systems are compared.</li>
<li><strong>Hard / soft authentication tokens</strong> &mdash; generate one-time codes, either on a dedicated device (hard) or an authenticator app (soft). Two algorithms: <strong>TOTP</strong> (time-based one-time password) derives the code from the current time, so it changes every 30 seconds or so; <strong>HOTP</strong> (HMAC-based one-time password) derives it from a counter that advances each time a code is used or the button pressed, so a code stays valid until used. SMS codes count as "something you have" but are the weakest option because of SIM swapping.</li>
<li><strong>Smart cards</strong> &mdash; government <strong>PIV</strong> (personal identity verification) cards and the military CAC hold a certificate and private key, used with a PIN.</li>
<li><strong>Security keys</strong> &mdash; USB/NFC hardware (FIDO2) holding a private key; phishing-resistant because the key only answers the genuine site.</li>
</ul>
<p><strong>2FA</strong> (two-factor authentication) is MFA with exactly two factors.</p>
<p>Biometric systems are compared on more than the crossover error rate:</p>
<ul>
<li><strong>False rejection rate (FRR)</strong> is the <strong>Type I error</strong> &mdash; the legitimate person refused. Irritating rather than dangerous, though a high FRR is what makes staff prop doors open, which <em>is</em> dangerous.</li>
<li><strong>False acceptance rate (FAR)</strong> is the <strong>Type II error</strong> &mdash; the wrong person accepted. This is the actual security failure, so sensitivity is normally tuned to hold FAR down even though FRR rises as a result.</li>
<li><strong>Throughput</strong> &mdash; how quickly the system enrols a person and then matches them. A reader needing several seconds per person is unusable on a door two hundred staff walk through at nine in the morning, however good its error rates look on paper.</li>
<li><strong>Failure to enrol rate (FER)</strong> &mdash; the proportion of people whose biometric cannot be captured well enough to register at all: worn or scarred fingerprints, certain eye conditions. Those people still need to get in, so an alternative factor is part of the design rather than an afterthought.</li>
</ul>
<p><strong>Behavioural biometrics</strong> measure something you <em>do</em> rather than something you are: <strong>voice</strong> recognition, <strong>signature dynamics</strong> (the stroke order, speed and pressure of a signature rather than its finished shape) and <strong>gait analysis</strong> (how a person walks, read from video). They are unobtrusive and can run continuously in the background, but their error rates are noticeably worse than physical biometrics &mdash; a cold changes your voice, a twisted ankle changes your walk &mdash; so treat them as a supporting signal that raises suspicion, not as the sole gate on anything valuable.</p>
<p><strong>Why a code by SMS or e-mail is the weak version.</strong> The service generates the code and then sends it to you over a channel an attacker may be able to reach: a <strong>SIM swap</strong> moves your number onto their handset, a compromised mailbox simply shows them the message, and weaknesses in the carrier signalling network allow interception outright. Because the second step is in the end just another thing you were <em>told</em>, this arrangement is often called <strong>two-step verification</strong> rather than true multifactor authentication. An authenticator app is stronger for one specific reason: the app and the server agree a shared secret once at setup, and from then on the code is calculated on the device from that secret and the clock. It is never transmitted, so there is no message to intercept.</p>
<p><strong>FIDO2 and WebAuthn</strong> are the standards behind security keys and passwordless sign-in. FIDO is <em>not</em> on CompTIA's acronym list, so treat the names as background &mdash; what is examinable is the "security keys" and "passwordless" behaviour they explain. At registration the authenticator generates a <em>unique key pair for that one service</em> and keeps the private key, handing the site only the public half. Signing in means signing a challenge with that private key, so the service stores no shared secret worth stealing, there is no PKI to run, and a phishing site gets nothing because the authenticator refuses to answer a domain it was not registered to.</p>
<ul>
<li><strong>Roaming authenticator</strong> &mdash; a separate device you carry between machines, typically a USB or NFC key.</li>
<li><strong>Platform authenticator</strong> &mdash; one built into the device you are already using: Windows Hello, Touch ID, a phone's secure element.</li>
<li><strong>Local gesture</strong> &mdash; the PIN or fingerprint that unlocks the authenticator. It is verified on the device alone and never sent to the service, which is why such a PIN cannot be phished or leaked in a server breach.</li>
<li><strong>FIDO U2F</strong> &mdash; the earlier standard, a second factor only. FIDO2 is the version that can replace the password altogether.</li>
</ul>
<blockquote><span class="tag">Gotcha</span>Password + security question = <strong>one factor</strong> (both "know"). Password + fingerprint = two. Count <em>categories</em>, not steps.</blockquote>
`},
{id:"passwords",obj:"4.6",title:"Password Concepts, Managers &amp; Passwordless",html:`
<div class="tblwrap"><table><caption>Password best practices</caption>
<tr><th>Setting</th><th>Guidance</th></tr>
<tr><td><strong>Length</strong></td><td>The biggest single factor; at least 8, preferably 12&ndash;15+. Passphrases make length easy</td></tr>
<tr><td><strong>Complexity</strong></td><td>Mix of upper, lower, numbers and symbols, raising <em>entropy</em> (unpredictability)</td></tr>
<tr><td><strong>Reuse</strong></td><td>Password history blocks recycling old passwords; every account should have its own</td></tr>
<tr><td><strong>Expiration</strong></td><td>How long until a forced change (e.g. 90 days)</td></tr>
<tr><td><strong>Age</strong></td><td>Minimum age stops users changing a password repeatedly to cycle back to an old one</td></tr>
</table></div>
<p><strong>Password managers</strong> store unique, random passwords in one encrypted vault behind a strong master credential and MFA. They can be built into the OS or browser, third-party, or enterprise-managed, and often flag weak, reused or breached passwords.</p>
<p><strong>Passwordless</strong> authentication removes the shared secret entirely: biometrics on a trusted device, security keys, passkeys, Windows Hello PIN (a local unlock tied to the device, not a password sent to a server). Nothing reusable to phish or spray.</p>
<p>A <strong>CAPTCHA</strong> (completely automated public Turing test to tell computers and humans apart) on login and sign-up forms slows automated credential stuffing and bot account creation.</p>
<blockquote><span class="tag">Gotcha</span><strong>Expiration</strong> is the maximum lifetime; <strong>age</strong> (minimum) stops the "change it five times and back to the old one" trick. They work together with password history.</blockquote>
`},
{id:"pam",obj:"4.6",title:"Privileged Access Management (PAM)",html:`
<p>Admin accounts are the most valuable accounts to steal. <strong>PAM tools</strong> reduce how often privilege exists and how exposed it is when it does.</p>
<ul>
<li><strong>Just-in-time permissions</strong> (JIT) &mdash; no standing admin rights. A user requests elevation, policy approves it, and access is granted for a limited time, then removed. A compromised account holds no admin rights to abuse.</li>
<li><strong>Password vaulting</strong> &mdash; privileged credentials live in an encrypted vault, checked out under policy and logged; often rotated after each use. Users may never see the real password.</li>
<li><strong>Ephemeral credentials</strong> &mdash; temporary credentials generated for one session and destroyed after, so the primary credential is never exposed.</li>
</ul>
<p>The JIT flow: request &rarr; policy check by the vault &rarr; temporary credential issued &rarr; work performed and recorded &rarr; credential expires.</p><p>Two further names from the same area:</p>
<ul>
<li><strong>Secure administrative workstation (SAW)</strong> &mdash; a hardened, deliberately minimal machine used <em>only</em> for administration: no web browsing, no e-mail, no general-purpose software, tight outbound filtering. The point is that admin credentials are never typed on a box that also opens attachments, which closes the usual route to a domain admin password: phish the administrator's ordinary desktop, then scrape the credential out of its memory.</li>
<li><strong>Zero standing privileges (ZSP)</strong> &mdash; another name for the just-in-time idea above, stated as the goal rather than the mechanism. At rest, no account holds administrative rights at all; every elevation is requested, approved, time-boxed and logged.</li>
</ul>

`},

{id:"automation",obj:"4.7",title:"Automation &amp; Orchestration &mdash; Use Cases",html:`
<p>Automation runs a single task by script; orchestration strings automated tasks together across systems. Both run at machine speed, without typos, around the clock.</p>
<div class="tblwrap"><table><caption>The named use cases</caption>
<tr><th>Use case</th><th>Example</th></tr>
<tr><td><strong>User provisioning</strong></td><td>New hire: account, groups, mailbox, home directory, all from one HR trigger</td></tr>
<tr><td><strong>Resource provisioning</strong></td><td>Spin up servers, storage and network in the cloud, with security controls included, and remove them when done</td></tr>
<tr><td><strong>Guard rails</strong></td><td>Automated checks that stop dangerous actions, such as refusing a delete that would wipe a critical volume</td></tr>
<tr><td><strong>Security groups</strong></td><td>Add or remove users automatically by role; alert when someone is added to Administrators</td></tr>
<tr><td><strong>Ticket creation</strong></td><td>An alert or email becomes a routed help-desk ticket without anyone typing it</td></tr>
<tr><td><strong>Escalation</strong></td><td>The script tries the fix first and only pages the on-call engineer if it fails</td></tr>
<tr><td><strong>Enabling/disabling services and access</strong></td><td>Turn services or accounts on and off on schedule or on trigger</td></tr>
<tr><td><strong>Continuous integration and testing</strong></td><td>Code is built, tested and security-scanned automatically on every commit</td></tr>
<tr><td><strong>Integrations and application programming interfaces (APIs)</strong></td><td>Scripts talk to firewalls, cloud platforms and tools through their APIs instead of clicking through consoles</td></tr>
</table></div><p>The usual scripting languages are <strong>Bash</strong> (Bourne Again Shell) on Linux and macOS, PowerShell on Windows, and Python everywhere.</p>
<p>Integrations are where automation pays off in security: a vulnerability scanner that opens a ticket assigned to the system owner for each critical finding, or a SIEM alert that triggers a script to disable the account and isolate the host. Automated <strong>de-provisioning</strong> matters as much as provisioning &mdash; access removed the moment HR marks someone as leaving, not whenever someone remembers.</p>
<p><strong>SOAR</strong> (Security Orchestration, Automation and Response) is where these automation ideas meet the security operations centre. It sits <em>downstream</em> of the SIEM: the SIEM detects, correlates and stores the log data, and then hands its alerts to SOAR, which decides what to do about them and does it.</p>
<ul>
<li><strong>Incident categorization</strong> &mdash; SOAR maps each incoming alert to an incident type and weights it by context the raw alert doesn't carry: how critical the asset is, how the data on it is classified, which SLA tier the service sits in. The same alert on a lab machine and on the payment gateway does not get the same treatment.</li>
<li><strong>Playbooks</strong> &mdash; ordered response procedures, written once and run against those categorized incidents: disable the account, isolate the host, block the file hash at the proxy, raise the ticket, page the on-call engineer. A playbook can run <strong>fully automated</strong>, <strong>semi-automated</strong> (it pauses for a human to approve the destructive steps) or <strong>manual</strong> (a checklist the analyst works through by hand).</li>
<li><strong>Orchestration</strong> &mdash; the steps reach across the EDR, the firewall, the directory and the ticketing system through their APIs, so one alert drives one coordinated response instead of an analyst working five consoles.</li>
</ul>
<p>SIEM and SOAR are separate products and each can run independently, but they are usually deployed together, because either is weaker alone: a SIEM with no SOAR produces alerts nobody has time to action, and a SOAR with no SIEM has nothing trustworthy feeding it. Be precise about the split &mdash; <strong>SOAR is an orchestration and response layer, not a log repository</strong>. Collecting, storing, searching and retaining the logs is the SIEM's job.</p>
<blockquote><span class="tag">Gotcha</span>If the question asks where the logs <em>live</em>, or what correlates events from different sources into one story, the answer is <strong>SIEM</strong>. If it asks what <em>runs the response</em> &mdash; playbooks, automatic containment, ticketing and notification &mdash; the answer is <strong>SOAR</strong>.</blockquote>

`},
{id:"autobenefits",obj:"4.7",title:"Automation &mdash; Benefits &amp; Considerations",html:`
<div class="tblwrap"><table><caption>Benefits vs. considerations</caption>
<tr><th>Benefits</th><th>Other considerations</th></tr>
<tr><td><strong>Efficiency / time saving</strong> &mdash; repeatable work done without people</td><td><strong>Complexity</strong> &mdash; more moving parts to test and understand</td></tr>
<tr><td><strong>Enforcing baselines</strong> &mdash; every system configured and kept the same way</td><td><strong>Cost</strong> &mdash; someone has to build and test the scripts</td></tr>
<tr><td><strong>Standard infrastructure configurations</strong> &mdash; every new firewall or router ships with the required controls</td><td><strong>Single point of failure</strong> &mdash; if the automation breaks, everything depending on it breaks too</td></tr>
<tr><td><strong>Scaling in a secure manner</strong> &mdash; security grows with the environment instead of lagging</td><td><strong>Technical debt</strong> &mdash; scripts that patch symptoms can hide the real problem and pile up</td></tr>
<tr><td><strong>Employee retention</strong> &mdash; people freed from tedious tasks</td><td><strong>Ongoing supportability</strong> &mdash; scripts need updating as OSes, APIs and staff change</td></tr>
<tr><td><strong>Reaction time</strong> &mdash; fixes applied in seconds, 24/7</td><td></td></tr>
<tr><td><strong>Workforce multiplier</strong> &mdash; a small team does the work of a large one</td><td></td></tr>
</table></div>
<blockquote><span class="tag">Gotcha</span>A question asking for a <em>downside</em> of automation wants one of: complexity, cost, <strong>single point of failure</strong>, <strong>technical debt</strong>, or ongoing supportability.</blockquote>
`},

{id:"irprocess",obj:"4.8",title:"Incident Response Process",html:`
<p>CompTIA lists seven phases, in order. NIST SP 800-61 groups the same work into four, and questions may use either framing.</p>
<ol>
<li><strong>Preparation</strong> &mdash; before anything happens: the plan, contact lists, communication methods, the incident "go bag" (forensic laptop, clean media, imaging tools), network diagrams, baselines, known-good images and file hashes.</li>
<li><strong>Detection</strong> &mdash; recognizing that something is happening, from alerts, logs, users or outside reports. <em>Precursors</em> suggest an attack may come (a scan in the web logs); <em>indicators</em> show one has (an IPS alert, AV detection, unexpected config change, traffic spike).</li>
<li><strong>Analysis</strong> &mdash; confirming it's real, determining scope and severity, and deciding priorities.</li>
<li><strong>Containment</strong> &mdash; stop the spread: isolate hosts, disable accounts, block addresses. Suspicious files can be run in a <strong>sandbox</strong> to see what they do (though some malware detects sandboxes and hides).</li>
<li><strong>Eradication</strong> &mdash; remove the cause: delete malware, close the vulnerability, remove attacker accounts.</li>
<li><strong>Recovery</strong> &mdash; restore from known-good backups or rebuild, return to production, monitor closely.</li>
<li><strong>Lessons learned</strong> &mdash; a post-incident review soon after, while memory is fresh: what happened, how the response went, what to change.</li>
</ol>
<p>NIST's four: preparation &rarr; detection &amp; analysis &rarr; containment, eradication &amp; recovery &rarr; post-incident activity.</p>
<p>The people doing this work are the incident response team &mdash; called a <strong>CIRT</strong> (computer incident response team), CSIRT, or <strong>CERT</strong> (computer emergency response team). National CERTs also publish advisories. The <strong>IRP</strong> (incident response plan) is the document that defines the team, roles and procedures.</p>
<p>Containment comes in two stages. <strong>Short-term</strong> containment stops the damage right now &mdash; pull the host off the network, disable the account, block the IP. <strong>Long-term</strong> containment keeps things safe while the fix is prepared, such as moving the system to a restricted VLAN or applying temporary firewall rules so business can continue. After recovery, keep watching closely for signs of reinfection, which means eradication missed something.</p>
<blockquote><span class="tag">Gotcha</span><strong>Containment comes before eradication.</strong> Stop the bleeding first, then remove the cause. Wiping a machine before containment can let the attacker keep spreading elsewhere &mdash; and destroys evidence.</blockquote>
`},
{id:"irtraining",obj:"4.8",title:"Training, Testing, Root Cause &amp; Threat Hunting",html:`
<ul>
<li><strong>Training</strong> &mdash; responders are trained before incidents, on the initial response, investigation and reporting procedures. Expensive, but far cheaper than learning during a real breach.</li>
<li><strong>Testing</strong> &mdash; a <strong>tabletop exercise</strong> talks through a scenario around a table with no systems touched. A <strong>simulation</strong> actually exercises the response: phishing simulations, a social-engineering call to the help desk, a test exfiltration to see if monitoring notices. Use test systems, not production.</li>
<li><strong>Root cause analysis</strong> &mdash; working back from the incident to how the attacker actually got in and which control failed. Fix the root cause, not only the symptom, or it will happen again. There may be more than one.</li>
<li><strong>Threat hunting</strong> &mdash; proactively searching for attackers already inside who haven't triggered an alert, using threat intelligence and hypotheses rather than waiting for an alarm.</li>
</ul>
<p>Root cause analysis typically produces a <strong>CAR</strong> (corrective action report) listing what will change to prevent a repeat, with owners and dates.</p>
<blockquote><span class="tag">Gotcha</span><strong>Threat hunting is proactive</strong> &mdash; looking for what the alerts missed. Incident response is reactive. Root cause analysis happens <em>after</em>, to prevent a repeat.</blockquote>
`},
{id:"forensics",obj:"4.8",title:"Digital Forensics",html:`
<p>Forensics collects and analyzes evidence in a way that will hold up later, possibly in court, years after the event.</p>
<div class="tblwrap"><table><caption>The named terms</caption>
<tr><th>Term</th><th>Meaning</th></tr>
<tr><td><strong>Legal hold</strong></td><td>An instruction from legal counsel to preserve specific data because litigation is expected. It overrides normal deletion and retention schedules</td></tr>
<tr><td><strong>Chain of custody</strong></td><td>A documented record of every person who handled the evidence, when, and why, proving it wasn't altered. Digital evidence uses hashes to prove integrity</td></tr>
<tr><td><strong>Acquisition</strong></td><td>Collecting the evidence: disk images, memory, logs, VM snapshots, firmware. Capture the most volatile first (CPU and memory before disk before backups)</td></tr>
<tr><td><strong>Reporting</strong></td><td>Summary, how the evidence was acquired and verified, analysis, conclusion</td></tr>
<tr><td><strong>Preservation</strong></td><td>Keep the original untouched and work on verified copies. Capture live systems before powering off, since encryption or remote wipe can destroy data</td></tr>
<tr><td><strong>E-discovery</strong></td><td>Collecting and producing electronically stored information for legal proceedings. It gathers; forensics analyzes</td></tr>
</table></div>
<p>Disk acquisition uses a <strong>bit-by-bit image</strong> (every sector, including deleted and unallocated space), taken through a <strong>write blocker</strong> so the original drive can't be altered. Hash the original and the image; matching hashes prove the copy is exact, and re-hashing later proves nothing has changed since.</p>
<blockquote><span class="tag">Gotcha</span><strong>Order of volatility</strong>: collect what disappears fastest first &mdash; CPU registers and cache, RAM, then disk, then remote logs and backups. Pulling the plug first loses everything in memory.</blockquote>
`},

{id:"logdata",obj:"4.9",title:"Log Data",html:`
<div class="tblwrap"><table><caption>What each log type tells an investigator</caption>
<tr><th>Log</th><th>What it shows</th></tr>
<tr><td><strong>Firewall logs</strong></td><td>Source and destination IP, ports, allowed or blocked. NGFWs add application, user and URL category</td></tr>
<tr><td><strong>Application logs</strong></td><td>Events recorded by the app itself: errors, logins, transactions. Windows Event Viewer's Application log; /var/log on Linux</td></tr>
<tr><td><strong>Endpoint logs</strong></td><td>Logons/logoffs, processes started, device changes, lockouts, security software events on laptops, desktops and phones</td></tr>
<tr><td><strong>OS-specific security logs</strong></td><td>Authentication successes and failures, privilege use, changes to critical files and services (the Windows Security log)</td></tr>
<tr><td><strong>IPS/IDS logs</strong></td><td>Which known attacks or signatures fired, against which hosts, and what action was taken</td></tr>
<tr><td><strong>Network logs</strong></td><td>Switches, routers, access points, VPN concentrators: routing changes, authentication errors, interface attacks</td></tr>
<tr><td><strong>Metadata</strong></td><td>Data about data: email headers (the servers a message passed through), photo GPS coordinates and device model, document author, browser and OS details</td></tr>
</table></div>
<p>The value comes from <strong>correlation</strong>: one log shows a piece of the story; the SIEM lines them up into the whole sequence. Filter what you send to it, because volume is enormous.</p><p>Match the log to the question:</p><ul><li><strong>Firewall</strong> &mdash; an outside IP connecting in, or unusual outbound traffic to a strange destination</li><li><strong>Application / web server</strong> &mdash; SQL injection strings or odd API calls against the app</li><li><strong>Endpoint</strong> &mdash; an unexpected process or new file on one machine (malware)</li><li><strong>OS security log</strong> &mdash; privilege escalation or repeated failed logins on a server</li><li><strong>IPS/IDS</strong> &mdash; a port scan or brute-force attempt that was detected or blocked</li><li><strong>Metadata / timestamps</strong> &mdash; building the timeline of what happened in which order across systems</li></ul>

`},
{id:"datasources",obj:"4.9",title:"Data Sources for Investigations",html:`
<ul>
<li><strong>Vulnerability scans</strong> &mdash; what was exposed and when: missing patches, open shares, disabled antivirus. Tells you whether the attacker's likely entry point was known.</li>
<li><strong>Automated reports</strong> &mdash; scheduled output from the SIEM or other tools. Useful only if someone reads them; keep them specific, since broad reports over terabytes are slow.</li>
<li><strong>Dashboards</strong> &mdash; real-time, at-a-glance status, often on the SOC wall. Good for current state, not for long-term history.</li>
<li><strong>Packet captures</strong> &mdash; the full contents of network traffic (e.g. Wireshark). The most detailed source and the most storage-hungry; shows exactly what was sent, if it wasn't encrypted.</li>
</ul>
<blockquote><span class="tag">Gotcha</span>To see <strong>what was actually sent</strong>, you need a <strong>packet capture</strong>. NetFlow and firewall logs show who talked to whom and how much, not the contents.</blockquote>
`}
];

var GOTCHAS_TABLE = `
<div class="tblwrap"><table><caption>Every pink callout in Domain 4, collected</caption>
<tr><th>Pair</th><th>The distinction</th></tr>
<tr><td>Establish / deploy / maintain</td><td>Define the baseline vs. push it out vs. keep checking and updating it</td></tr>
<tr><td>Hardening unpatchable targets</td><td>ICS, embedded, RTOS, IoT &rarr; segment or isolate</td></tr>
<tr><td>BYOD vs. COPE vs. CYOD</td><td>Employee-owned vs. company-owned, personal use allowed vs. company-owned, user picks the model</td></tr>
<tr><td>WPA3-Personal vs. WPA3-Enterprise</td><td>One shared passphrase (SAE) vs. individual credentials via 802.1X/RADIUS</td></tr>
<tr><td>Code signing proves</td><td>Who published it and that it hasn't changed &mdash; not that it's safe</td></tr>
<tr><td>Inventory vs. enumeration</td><td>The record you keep vs. discovering what's really there</td></tr>
<tr><td>Sanitization vs. destruction</td><td>Data removed, device reusable vs. media physically ruined</td></tr>
<tr><td>Degaussing</td><td>Magnetic media only &mdash; useless on SSDs and flash</td></tr>
<tr><td>Static vs. dynamic analysis</td><td>Code not running vs. running application (fuzzing)</td></tr>
<tr><td>Vulnerability scan vs. pen test</td><td>Identifies without exploiting vs. actually exploits</td></tr>
<tr><td>CVE vs. CVSS</td><td>Names the vulnerability vs. scores its severity 0&ndash;10</td></tr>
<tr><td>False positive vs. false negative (scans)</td><td>Reported but not there vs. there but not reported &mdash; the worse one</td></tr>
<tr><td>Patch vs. compensating control vs. exception</td><td>Fix it vs. work around it vs. formally accept the risk</td></tr>
<tr><td>SNMP poll vs. trap</td><td>Manager asks on a schedule (UDP 161) vs. device pushes an alert (UDP 162)</td></tr>
<tr><td>NetFlow vs. packet capture</td><td>Who talked to whom and how much vs. the full contents</td></tr>
<tr><td>Agent-based vs. agentless</td><td>Installed and always on vs. runs temporarily, nothing to maintain</td></tr>
<tr><td>Firewall rule order</td><td>Top-down, first match wins, implicit deny at the bottom</td></tr>
<tr><td>Stateless vs. stateful</td><td>Each packet judged alone vs. connections tracked, return traffic allowed</td></tr>
<tr><td>Proxy filtering vs. agent-based filtering</td><td>Only protects traffic through the proxy vs. works on any network</td></tr>
<tr><td>DNS filtering</td><td>Refuses to resolve bad domains &mdash; covers every app, including malware C2</td></tr>
<tr><td>DAC vs. MAC on Linux</td><td>Owner decides (default permissions) vs. central policy decides (SELinux)</td></tr>
<tr><td>SFTP vs. FTPS</td><td>FTP-like transfer over SSH, port 22 vs. FTP wrapped in TLS, 989/990</td></tr>
<tr><td>DNSSEC</td><td>Integrity and authenticity of DNS records &mdash; no encryption</td></tr>
<tr><td>SPF vs. DKIM vs. DMARC</td><td>Which servers may send vs. signature and integrity vs. policy and reporting</td></tr>
<tr><td>EDR vs. XDR</td><td>One endpoint vs. correlated across endpoints, network, cloud and email</td></tr>
<tr><td>UBA</td><td>Baselines people's behaviour &mdash; the insider-threat answer</td></tr>
<tr><td>SAML vs. OAuth</td><td>Authentication/SSO assertions vs. delegated authorization</td></tr>
<tr><td>SSO vs. federation</td><td>Log in once for many systems vs. trusting another organization's identities</td></tr>
<tr><td>MAC vs. DAC vs. RBAC vs. rule vs. ABAC</td><td>Labels vs. owner vs. job role vs. condition for everyone vs. many attributes combined</td></tr>
<tr><td>Counting MFA factors</td><td>Count categories, not steps &mdash; password + security question is one factor</td></tr>
<tr><td>FAR vs. FRR</td><td>Wrong person let in vs. right person locked out; CER is where they meet</td></tr>
<tr><td>Password expiration vs. minimum age</td><td>Maximum lifetime vs. stops cycling back to an old password</td></tr>
<tr><td>JIT vs. standing privilege</td><td>Temporary admin rights on request vs. permanent rights waiting to be stolen</td></tr>
<tr><td>Automation downsides</td><td>Complexity, cost, single point of failure, technical debt, supportability</td></tr>
<tr><td>Containment vs. eradication</td><td>Stop the spread first, then remove the cause</td></tr>
<tr><td>Tabletop vs. simulation</td><td>Talk-through with no systems touched vs. exercising the actual response</td></tr>
<tr><td>Threat hunting vs. incident response</td><td>Proactively looking for what alerts missed vs. reacting to a detected incident</td></tr>
<tr><td>Order of volatility</td><td>Registers/cache &rarr; RAM &rarr; disk &rarr; remote logs &rarr; backups</td></tr>
<tr><td>E-discovery vs. forensics</td><td>Gather and produce the data vs. analyze it</td></tr>
<tr><td>Legal hold</td><td>Preserve specified data for litigation &mdash; overrides normal deletion</td></tr>
<tr><td>TOTP vs. HOTP</td><td>Code changes with time (~30 s) vs. code changes each time it's used (counter)</td></tr>
<tr><td>WEP / WPA-TKIP / WPA2 / WPA3</td><td>Broken RC4 vs. deprecated RC4 stopgap vs. AES-CCMP vs. AES-GCMP with SAE</td></tr>
<tr><td>STIX vs. TAXII</td><td>The format vs. the transport</td></tr>
<tr><td>Kerberos vs. NTLM</td><td>Tickets from a KDC, time-sensitive vs. legacy challenge-response, pass-the-hash target</td></tr>
<tr><td>PAT vs. DNAT</td><td>Many hosts share one public IP outbound vs. forwarding an inbound port to one internal server</td></tr>
<tr><td>SIEM vs. SOAR</td><td>Detects, correlates and stores the logs vs. orchestrates and runs the response through playbooks &mdash; SOAR is not a log repository</td></tr>
<tr><td>SNMPv2c vs. v3</td><td>Community string sent in clear text vs. per-user authentication with integrity and AES encryption</td></tr>
<tr><td>PMF (802.11w)</td><td>Optional in WPA2, mandatory in WPA3 &mdash; why deauthentication attacks fail against WPA3</td></tr>
<tr><td>PAM vs. PAM</td><td>Privileged access management (vaulting, just-in-time admin rights) vs. pluggable authentication modules (the Linux authentication framework) &mdash; the objective the question sits under tells you which</td></tr>
<tr><td>Two-step verification vs. MFA</td><td>A code sent to you over SMS or e-mail, interceptable in transit vs. a factor generated on or held by a device you have</td></tr>
<tr><td>Roaming vs. platform authenticator</td><td>A security key you carry between machines vs. one built into the device (Windows Hello, Touch ID)</td></tr>
<tr><td>FRR vs. FAR</td><td>Type I, the right person refused vs. Type II, the wrong person admitted &mdash; FAR is the security failure</td></tr>
<tr><td>RADIUS vs. TACACS+</td><td>RADIUS: open standard, <strong>UDP</strong> 1812/1813, encrypts the <em>password only</em>, used for network access. TACACS+: Cisco, <strong>TCP 49</strong>, encrypts the <em>whole payload</em>, separates AAA so it can authorize commands one at a time on a device</td></tr>
</table></div>
<p style="font-size:13px;color:var(--text-muted);">Keep this list under 10% of your own marks when you transfer any of it &mdash; if everything's a gotcha, nothing is.</p>
`;

var SEARCH_INDEX = {};
(function buildIndex(){
  var scratch = document.createElement("div");
  TOPICS.forEach(function(t){
    scratch.innerHTML = t.title + " " + t.html;
    SEARCH_INDEX[t.id] = (scratch.textContent || "").toLowerCase();
  });
})();

var activeTab = "all";
var query = "";
var openIds = {};

var tabsEl = document.getElementById("tabs");
function buildTabs(){
  tabsEl.innerHTML = "";
  TAB_ORDER.forEach(function(k){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "tab" + (activeTab === k && !query ? " active" : "");
    b.textContent = TAB_LABEL[k];
    b.setAttribute("role","tab");
    b.addEventListener("click", function(){
      activeTab = k;
      searchInput.value = "";
      query = "";
      clearBtn.hidden = true;
      render();
    });
    tabsEl.appendChild(b);
  });
}

var searchInput = document.getElementById("search");
var clearBtn = document.getElementById("clear-search");
searchInput.addEventListener("input", function(){
  query = searchInput.value.trim().toLowerCase();
  clearBtn.hidden = query.length === 0;
  render();
});
clearBtn.addEventListener("click", function(){
  searchInput.value = "";
  query = "";
  clearBtn.hidden = true;
  render();
});

var listEl = document.getElementById("topiclist");
var emptyEl = document.getElementById("empty-state");
var notesEl = document.getElementById("results-note");

function matchingTopics(){
  if(query){
    return TOPICS.filter(function(t){ return SEARCH_INDEX[t.id].indexOf(query) !== -1; });
  }
  if(activeTab === "all") return TOPICS;
  if(activeTab === "gotchas") return [];
  return TOPICS.filter(function(t){ return t.obj === activeTab; });
}

function topicCard(t, forceOpen){
  var isOpen = !!openIds[t.id] || forceOpen;
  var div = document.createElement("div");
  div.id = "t-" + t.id;
  div.className = "topic" + (isOpen ? " open" : "");
  div.innerHTML =
    '<button class="topic-head" type="button">' +
      '<h2>' + t.title + '</h2>' +
      '<span style="display:flex;align-items:center;gap:8px;">' +
        '<span class="topic-badge">' + t.obj + '</span>' +
        '<span class="chev">&#9656;</span>' +
      '</span>' +
    '</button>' +
    '<div class="topic-body">' + t.html + '</div>';
  div.querySelector(".topic-head").addEventListener("click", function(){
    var nowOpen = !div.classList.contains("open");
    div.classList.toggle("open", nowOpen);
    openIds[t.id] = nowOpen;
  });
  return div;
}

function render(){
  buildTabs();
  listEl.innerHTML = "";
  notesEl.hidden = true;
  emptyEl.hidden = true;

  if(activeTab === "gotchas" && !query){
    var card = document.createElement("div");
    card.className = "topic open";
    card.innerHTML =
      '<button class="topic-head" type="button"><h2>Domain 4 Gotchas &mdash; quick-scan compare cards</h2>' +
      '<span class="chev">&#9656;</span></button>' +
      '<div class="topic-body">' + GOTCHAS_TABLE + '</div>';
    card.querySelector(".topic-head").addEventListener("click", function(){
      card.classList.toggle("open");
    });
    listEl.appendChild(card);
    return;
  }

  var matches = matchingTopics();

  if(query){
    notesEl.hidden = false;
    notesEl.textContent = matches.length + (matches.length === 1 ? ' result for "' : ' results for "') + searchInput.value.trim() + '"';
  }

  if(matches.length === 0){
    emptyEl.hidden = false;
    return;
  }

  matches.forEach(function(t){
    var forceOpen = !!query && matches.length <= 6;
    listEl.appendChild(topicCard(t, forceOpen));
  });

  if(!query && matches.length > 0 && Object.keys(openIds).length === 0){
    listEl.firstChild.classList.add("open");
  }
}

render();

/* open a topic when arriving from a link like notebook.html#topic-id */
function openFromHash(){
  var h = decodeURIComponent((location.hash || "").replace(/^#/, ""));
  if(!h || !TOPICS.some(function(t){ return t.id === h; })) return;
  activeTab = "all"; query = ""; searchInput.value = ""; clearBtn.hidden = true;
  openIds = {}; openIds[h] = true;
  render();
  var el = document.getElementById("t-" + h);
  if(!el) return;
  setTimeout(function(){
    var bar = document.querySelector(".topbar");
    var y = el.getBoundingClientRect().top + window.pageYOffset - (bar ? bar.offsetHeight : 0) - 12;
    window.scrollTo(0, Math.max(0, y));
  }, 50);
}
openFromHash();
window.addEventListener("hashchange", openFromHash);
})();
</script>
