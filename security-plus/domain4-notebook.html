{id:"baselines",obj:"4.1",title:"Secure Baselines &mdash; Establish, Deploy, Maintain",html:`
<p>A <strong>secure baseline</strong> is the agreed set of security settings every instance of a system should carry: firewall settings, patch level, OS options, application configuration and file permissions. It turns "secure" from an opinion into something you can check.</p>
<ol>
<li><strong>Establish</strong> &mdash; start from a trusted source rather than from scratch: the OS vendor (Microsoft's Security Compliance Toolkit), the application developer, or a published benchmark such as CIS. Where two sources conflict, pick what fits this system and document why.</li>
<li><strong>Deploy</strong> &mdash; push it automatically, because nobody configures three thousand machines by hand. Active Directory Group Policy for Windows, MDM for mobile, configuration management or IaC for servers and cloud. Test before rollout.</li>
<li><strong>Maintain</strong> &mdash; baselines drift and go stale. Audit regularly that systems still match, remediate the ones that don't, and update the baseline itself when a new vulnerability, application version or OS release changes what "secure" means.</li>
</ol>
<p>One baseline rarely fits everything. A domain controller, a kiosk workstation and a development test box need different settings, and a test environment may deliberately allow things production never should. Expect separate baselines per <strong>system type</strong> and per <strong>environment</strong>, each checked against its own standard.</p>
<blockquote><span class="tag">Gotcha</span>The order is fixed: <strong>establish &rarr; deploy &rarr; maintain</strong>. A question about checking that systems still match the standard is asking about <em>maintain</em>, not deploy.</blockquote>
`},
{id:"hardening",obj:"4.1",title:"Hardening Targets",html:`
<p><strong>Hardening</strong> is reducing a system's attack surface beyond its default configuration. Defaults are built for easy setup, not security. The objectives name each target; the core moves are the same everywhere (patch, remove what isn't needed, change defaults, restrict access), but the emphasis shifts.</p>
<div class="tblwrap"><table><caption>What hardening emphasizes on each target</caption>
<tr><th>Target</th><th>Main hardening moves</th></tr>
<tr><td><strong>Mobile devices</strong></td><td>Keep OS and apps patched, enforce screen lock and PIN, separate work and personal data, manage through MDM</td></tr>
<tr><td><strong>Workstations</strong></td><td>Patch OS, applications and firmware on a regular cycle; remove unused software, since every installed program adds surface; endpoint protection</td></tr>
<tr><td><strong>Switches &amp; routers</strong></td><td>Change default credentials; use central authentication (RADIUS/TACACS+); disable unused ports and services; manage over SSH, never Telnet; apply the vendor's firmware updates, which are rare and so significant</td></tr>
<tr><td><strong>Cloud infrastructure</strong></td><td>Lock down the management console and the workstations that reach it; least privilege on every role; EDR on cloud workloads; back up, ideally to a separate provider</td></tr>
<tr><td><strong>Servers</strong></td><td>OS updates and service packs; strong password policy; disable unused accounts; restrict which hosts can connect; anti-malware/EDR</td></tr>
<tr><td><strong>ICS/SCADA</strong></td><td>Isolate &mdash; often air-gapped or heavily segmented, with no internet access and very limited, monitored entry points</td></tr>
<tr><td><strong>Embedded systems</strong></td><td>Patches are rare, so apply them quickly when they come; segment and put a firewall in front</td></tr>
<tr><td><strong>RTOS</strong></td><td>Isolate from the network, run the minimum services, add host-based or separate firewall protection if it must communicate</td></tr>
<tr><td><strong>IoT devices</strong></td><td>Change default credentials, prioritize vendor patches, put them on their own network segment</td></tr>
</table></div>
<p>On switches, hardening goes beyond shutting unused ports: put unused ports in an unused VLAN, segment traffic with VLANs, and turn on <strong>port security</strong> so a port only accepts known MAC addresses (and shuts down or alerts when a new one appears). On routers, apply ACLs to filter what can reach the router and what it forwards, and restrict management access to an admin subnet.</p>
<blockquote><span class="tag">Gotcha</span>For anything that can't be patched well &mdash; ICS/SCADA, embedded, RTOS, IoT &mdash; the expected answer is <strong>segmentation or isolation</strong>. Same logic as Domain 3's "inability to patch".</blockquote>
`},
{id:"firmware",obj:"4.1",title:"Firmware &amp; Printer Hardening",html:`
<ul>
<li><strong>BIOS / UEFI</strong> &mdash; the firmware that starts the computer. <strong>UEFI</strong> (Unified Extensible Firmware Interface) replaced the legacy <strong>BIOS</strong> (Basic Input/Output System). Harden it with a firmware password, firmware updates from the vendor, and <strong>Secure Boot</strong>, which only allows a signed boot loader to run, blocking bootkits. <strong>Measured Boot</strong> records each boot step in the TPM so it can be checked later.</li>
<li><strong>Printers / MFPs</strong> &mdash; multifunction printers and devices (<strong>MFP / MFD</strong>) are full computers with network services, default admin passwords, and hard drives that keep copies of scans and prints. Change defaults, patch firmware, disable unused services, restrict who can scan to email, and wipe or destroy their drives at disposal.</li>
</ul>
`},
{id:"wirelessinstall",obj:"4.1",title:"Wireless Devices &mdash; Installation Considerations, Site Surveys &amp; Heat Maps",html:`
<p>Wireless security starts before anything is configured, with where the access points go and what else is on the air.</p>
<ul>
<li><strong>Site survey</strong> &mdash; examines the environment before and after installation: existing access points (yours and the neighbors'), which channels and frequencies are in use, and sources of interference. It decides channel plans and AP placement, and it should be repeated because the environment changes.</li>
<li><strong>Heat map</strong> &mdash; a visual map of signal strength across the floor plan, produced by walking the space with survey software. It shows dead spots where users will struggle and overspill where the signal leaks into the car park for anyone to try.</li>
<li><strong>Tools</strong> &mdash; a <strong>Wi-Fi analyzer</strong> (the survey software itself, and CompTIA's own name for the tool) reports SSID, BSSID, channel, band and signal strength, and is what produces the heat map; a <strong>spectrum analyzer</strong> goes wider, showing everything on the frequency including non-Wi-Fi interference like microwaves and cordless phones.</li>
</ul>
<p>The security point: coverage that extends well beyond your walls is attack surface, and a survey is also how you spot rogue access points that shouldn't exist.</p>
`},
{id:"mobile",obj:"4.1",title:"Mobile Solutions &mdash; MDM, Deployment Models &amp; Connections",html:`
<p><strong>Mobile device management (MDM)</strong> is the central console that enforces policy on phones and tablets: require a PIN and screen lock, push or block apps, disable the camera in secure areas (often by location), encrypt, separate business data into its own container, and remotely wipe a lost device.</p>
<div class="tblwrap"><table><caption>Deployment models</caption>
<tr><th>Model</th><th>Who owns it</th><th>Trade-off</th></tr>
<tr><td><strong>BYOD</strong> &mdash; bring your own device</td><td>The employee</td><td>Cheap and convenient; hardest to control. Must protect company data <em>and</em> the user's privacy, so containerization and selective wipe matter</td></tr>
<tr><td><strong>COPE</strong> &mdash; corporate-owned, personally enabled</td><td>The company</td><td>Company controls the device fully, but personal use is allowed; business data is still partitioned</td></tr>
<tr><td><strong>CYOD</strong> &mdash; choose your own device</td><td>The company</td><td>Like COPE, but the user picks the model from an approved list</td></tr>
<tr><td><strong>COBO</strong> &mdash; corporate-owned, business only</td><td>The company</td><td>No personal use at all; the most controlled and the most secure</td></tr>
</table></div>
<p><strong>Connection methods</strong> each carry their own risk:</p>
<ul>
<li><strong>Cellular</strong> &mdash; carrier network divided into cells; exposure to traffic monitoring and location tracking, so keep devices patched.</li>
<li><strong>Wi-Fi</strong> &mdash; public networks are often unencrypted; nearby attackers can eavesdrop, run on-path attacks or jam. Use a VPN on untrusted networks.</li>
<li><strong>Bluetooth</strong> &mdash; a short-range personal area network (PAN). Pair deliberately, and don't auto-accept connections from unknown devices.</li>
</ul>
<p><strong>UEM</strong> (unified endpoint management) extends MDM to every endpoint &mdash; phones, laptops, desktops and IoT &mdash; from one console. Updates pushed to phones <strong>OTA</strong> (over the air) should be signed and come only from the vendor or MDM. Policies often cover any <strong>PED</strong> (personal electronic device) brought into secure areas.</p>
<blockquote><span class="tag">Gotcha</span>COPE and CYOD are both <strong>company-owned</strong>. The difference is only whether the user chose the model. BYOD is the only model where the employee owns the device.</blockquote>
`},
{id:"wifisec",obj:"4.1",title:"Wireless Security Settings &mdash; WPA3, RADIUS &amp; EAP",html:`
<p><strong>WPA2</strong>'s weakness is its four-way handshake: an attacker who captures it can take a hash derived from the pre-shared key and brute-force it offline, as slowly as needed. <strong>WPA3</strong> removes that opportunity.</p>
<ul>
<li><strong>SAE</strong> (Simultaneous Authentication of Equals, the "dragonfly" handshake) &mdash; a Diffie-Hellman-style exchange where both sides derive the session key without ever sending a crackable hash. Every user gets their own session key even on a shared password, so users can't read each other's traffic.</li>
<li><strong>GCMP</strong> (Galois/Counter Mode Protocol) &mdash; the <strong>cryptographic protocol</strong> behind WPA3, the stronger encryption mode, giving confidentiality plus integrity through GMAC. WPA2 used CCMP (AES).</li>
<li><strong>Mutual authentication</strong> &mdash; the client and access point authenticate each other.</li>
</ul>
<div class="tblwrap"><table><caption>Security modes</caption>
<tr><th>Mode</th><th>How users authenticate</th><th>Where you'd see it</th></tr>
<tr><td><strong>Open</strong></td><td>No authentication</td><td>Guest hotspots (often behind a captive portal)</td></tr>
<tr><td><strong>WPA3-Personal</strong> (PSK/SAE)</td><td>One shared passphrase</td><td>Homes, small offices</td></tr>
<tr><td><strong>WPA3-Enterprise</strong> (802.1X)</td><td>Individual credentials checked by a RADIUS/AAA server</td><td>Organizations. Disable one account, and that person's access ends everywhere</td></tr>
</table></div>
<p><strong>AAA</strong> is the framework behind enterprise mode: <strong>authentication</strong> (prove who you are), <strong>authorization</strong> (what you may reach) and <strong>accounting</strong> (a record of the session: when, how long, how much data). <strong>RADIUS</strong> (Remote Authentication Dial-In User Service) is the common AAA protocol, still named for dial-up but used for Wi-Fi, VPNs and device logins.</p>
<p><strong>Authentication protocols</strong> are the EAP methods carried inside 802.1X: <strong>EAP-TLS</strong> (certificates on both sides, the strongest), <strong>PEAP</strong> and <strong>EAP-TTLS</strong> (a TLS tunnel protecting a password exchange), and <strong>EAP-FAST</strong> (a Cisco-originated tunnel without server certificates).</p>
<p>GCMP is built on <strong>GCM</strong> (Galois/Counter Mode).</p>
<p><strong>Fine print on WPA3 ciphers:</strong> in the Wi-Fi Alliance specification, <strong>WPA3-Personal</strong> still encrypts with <strong>AES-CCMP</strong> (128-bit) &mdash; what it changes is the handshake (SAE). <strong>GCMP-256</strong> is required by the optional <strong>WPA3-Enterprise 192-bit mode</strong>. CompTIA and most study material simply pair "WPA3 = GCMP", so on the exam choose <strong>GCMP</strong> for WPA3 and <strong>CCMP</strong> for WPA2.</p>
<p><strong>Protected Management Frames (PMF).</strong> A wireless network carries three kinds of frame: <strong>data</strong> frames (the traffic you actually care about), <strong>control</strong> frames (the low-level acknowledgements and RTS/CTS that keep the shared medium orderly) and <strong>management</strong> frames (beacons, association, disassociation, deauthentication). WPA2 encrypted the data and left the management frames in the clear and unauthenticated, and that is precisely what <strong>deauthentication</strong> and <strong>disassociation</strong> attacks abuse: the attacker spoofs the access point's address, sends a forged deauth, and the client drops off &mdash; handy for a denial of service, or for forcing a reconnection whose handshake the attacker can then capture.</p>
<p><strong>802.11w</strong> closes this by authenticating and integrity-protecting the management frames, so a forged deauth is simply ignored. Cisco markets the same feature as <strong>Management Frame Protection (MFP)</strong>. PMF was <em>optional</em> under WPA2 and in practice often left off, which is exactly why <strong>WPA3 makes it mandatory</strong> &mdash; and why a deauth attack that works happily against a WPA2 network gets nowhere against WPA3.</p>
<p>The <strong>802.1X</strong> role model &mdash; supplicant, authenticator and authentication server &mdash; and the EAP request/response exchange that runs across it are covered in the Domain 3 Notebook (3.2) under port security.</p>
<blockquote><span class="tag">Gotcha</span>The WPA3 answer to "offline dictionary attack on the handshake" is <strong>SAE</strong>. The answer to "each employee should use their own login" is <strong>Enterprise/802.1X</strong>, not a longer shared passphrase.</blockquote>
`},
{id:"wifilegacy",obj:"4.1",title:"Wireless Security Evolution &mdash; WEP to WPA3",html:`
<div class="tblwrap"><table><caption>From oldest to newest</caption>
<tr><th>Standard</th><th>Encryption</th><th>Status</th></tr>
<tr><td><strong>WEP</strong> &mdash; Wired Equivalent Privacy</td><td>RC4 with a short, reused IV</td><td>Broken &mdash; crackable in minutes. Never use</td></tr>
<tr><td><strong>WPA</strong> &mdash; Wi-Fi Protected Access</td><td><strong>TKIP</strong> (Temporal Key Integrity Protocol), still RC4</td><td>Interim fix for WEP hardware; deprecated</td></tr>
<tr><td><strong>WPA2</strong></td><td>AES with CCMP</td><td>Still common; PSK handshake can be cracked offline</td></tr>
<tr><td><strong>WPA3</strong></td><td>AES with GCMP (Galois/Counter Mode), SAE &mdash; exam answer; strictly, GCMP-256 is the Enterprise 192-bit mode and Personal keeps CCMP</td><td>Current. Protected management frames (802.11w) are mandatory here, where WPA2 only made them optional</td></tr>
</table></div>
<ul>
<li><strong>WPS</strong> (Wi-Fi Protected Setup) &mdash; the PIN method can be brute-forced; disable it.</li>
<li><strong>LEAP</strong> (Lightweight EAP) &mdash; old Cisco EAP method using MS-CHAP; crackable. Replaced by PEAP and EAP-TLS.</li>
</ul>
<blockquote><span class="tag">Gotcha</span>If a question lists WEP, WPA/TKIP, WPA2 and WPA3, the <strong>only acceptable modern choice is WPA3</strong> (WPA2 at minimum). WEP and TKIP both use the broken RC4.</blockquote>
`},
{id:"appsec",obj:"4.1",title:"Application Security",html:`
<ul>
<li><strong>Input validation</strong> &mdash; check every input against what's expected (type, length, format, range) and reject the rest. It is the core defence against injection and overflow attacks. Validate on the server; client-side checks are a convenience that attackers simply skip.</li>
<li><strong>Secure cookies</strong> &mdash; cookies hold session state, so they're worth stealing. The <em>Secure</em> attribute sends them only over HTTPS; <em>HttpOnly</em> hides them from scripts (limiting XSS theft); <em>SameSite</em> limits cross-site sending. Never store sensitive data in a cookie; the user can read it.</li>
<li><strong>Static code analysis</strong> (SAST) &mdash; scans source code without running it, catching things like unchecked buffers and injectable queries early. It misses flaws in logic and implementation (weak crypto use, broken authentication design) and produces false positives, so results need human review.</li>
<li><strong>Code signing</strong> &mdash; the developer signs the code with a private key backed by a CA-issued certificate. The OS checks the signature at install, confirming <em>who</em> published it and that it <em>hasn't changed</em> since. It proves origin and integrity, not that the code is safe.</li>
</ul>
<blockquote><span class="tag">Gotcha</span>Code signing proves <strong>authenticity and integrity</strong> &mdash; not that the software is free of vulnerabilities or malware. Signed malware exists, usually via stolen signing keys.</blockquote>
`},
{id:"appdev",obj:"4.1",title:"Secure Development References &amp; Testing",html:`
<ul>
<li><strong>OWASP</strong> (Open Worldwide Application Security Project) &mdash; publishes the OWASP Top 10 list of the most critical web application risks, plus testing guides. The standard reference for secure coding.</li>
<li><strong>SDK</strong> (software development kit) &mdash; third-party libraries and tools built into an app. Their vulnerabilities become your vulnerabilities, so track them like any dependency.</li>
<li><strong>SOAP / REST APIs</strong> &mdash; SOAP (Simple Object Access Protocol) is an XML-based web service protocol; REST is the lighter modern style. Either way, APIs need authentication, input validation and rate limiting.</li>
<li><strong>UAT</strong> (user acceptance testing) &mdash; the final stage where real users confirm the software does what they need, after QA and security testing and before release.</li>
</ul>
`},
{id:"sandbox",obj:"4.1",title:"Sandboxing &amp; Monitoring",html:`
<p><strong>Sandboxing</strong> runs code in an isolated environment where it can reach only what it needs. Mobile operating systems sandbox every app (the browser can't read your photos unless you allow it). Security teams detonate suspicious files in a sandbox to watch what they do. Developers test in a sandbox that can't touch production.</p>
<p><strong>Monitoring</strong> closes the loop on application security: application logs and alerts that show injection attempts, attempts to exploit old vulnerabilities, unusual file transfers, and spikes in requests. Hardening assumes something will eventually get through; monitoring is how you find out when it does.</p>
`},

{id:"acquisition",obj:"4.2",title:"Acquisition &amp; Assignment",html:`
<p><strong>Acquisition / procurement</strong> is a security control, not just purchasing. A formal process means IT and security review what's bought &mdash; supported, patchable, from a trustworthy supplier, with acceptable licence and contract terms &mdash; before it's on the network. Informal buying is how shadow IT starts.</p>
<p>The rough order: requirement &rarr; IT and purchasing review &rarr; budget and approvals &rarr; supplier negotiation &rarr; purchase &rarr; delivery &rarr; invoice.</p>
<p><strong>Assignment / accounting</strong> records what each asset is and who answers for it:</p>
<ul>
<li><strong>Ownership</strong> &mdash; a named person or team responsible for the asset. Unowned assets don't get patched.</li>
<li><strong>Classification</strong> &mdash; what kind of asset it is and how sensitive the data it holds is, which sets how it's protected and later disposed of.</li>
</ul><p>High-value business systems such as <strong>ERP</strong> (enterprise resource planning: finance, HR, supply chain in one platform) deserve particular scrutiny at procurement, because they concentrate so much sensitive data.</p>
<p>Procurement is where <strong>supply chain risk</strong> is controlled. Buying from authorized vendors avoids counterfeit or tampered hardware, and the contract should spell out security obligations up front: how long patches will be provided, how vulnerabilities will be disclosed and fixed, and when the product reaches end-of-life. A product with no committed support is a future unpatchable system.</p>
<p>Assignment names more than one role. The <strong>owner</strong> is accountable for the asset and for the risk it carries; a <strong>custodian</strong> or <strong>steward</strong> is whoever handles it day to day &mdash; applies the patches, takes the backups, administers the access. Keeping the two distinct matters because the manager answerable for a finance server is rarely the person logged into it.</p>
<p>The resulting records live in a <strong>CMDB</strong> (configuration management database): what each asset is, how it's configured, who owns it, who looks after it and what depends on it. A CMDB earns its keep when it is tied to <strong>directory services</strong> and <strong>HR</strong> systems, so an asset follows its user automatically &mdash; a leaver flagged by HR surfaces at once as kit to reclaim and accounts to disable, instead of as a line nobody remembered to update.</p>

`},
{id:"assettrack",obj:"4.2",title:"Monitoring &amp; Asset Tracking",html:`
<p>You can't secure what you don't know you have. Asset tracking follows every asset through its whole life cycle.</p>
<ul>
<li><strong>Inventory</strong> &mdash; the authoritative list: what each asset is, where it is, who has it, what's installed on it. Physical <strong>asset tags</strong> (numbers or barcodes) tie the device to the record and help recover lost or stolen equipment.</li>
<li><strong>Enumeration</strong> &mdash; actively discovering what's actually present, by scanning the network or querying devices, and breaking an asset down into its components and installed software. Enumeration is how you find the devices the inventory doesn't know about.</li>
</ul>
<p>Mobile devices are also tracked by hardware identifiers such as the <strong>ESN</strong> (electronic serial number) or IMEI, which let a lost or stolen phone be identified and blocked.</p>
<p>An accurate inventory pays off in two scenarios the exam likes. <strong>Patch management</strong>: you can only patch devices you know exist. <strong>Incident response</strong>: when an alert names a host, the inventory tells you what it is, where it sits, who owns it and what data it holds, so containment starts in minutes instead of hours.</p>
<blockquote><span class="tag">Gotcha</span><strong>Inventory</strong> is the record you keep; <strong>enumeration</strong> is discovering what's really there. The gap between the two is where unmanaged devices live.</blockquote>
`},
{id:"disposal",obj:"4.2",title:"Disposal, Decommissioning &amp; Data Retention",html:`
<div class="tblwrap"><table><caption>Getting data off retired equipment</caption>
<tr><th>Method</th><th>What happens</th><th>Device reusable?</th></tr>
<tr><td><strong>Sanitization</strong></td><td>Data is removed so it can't be recovered &mdash; secure wipe/overwrite, or cryptographic erase (destroy the encryption key)</td><td>Yes</td></tr>
<tr><td><strong>Destruction</strong></td><td>The media is physically ruined &mdash; shredding, pulverizing, drilling, incineration, or <strong>degaussing</strong> (a strong magnetic field that wipes magnetic media and usually ruins the drive)</td><td>No</td></tr>
<tr><td><strong>Certification</strong></td><td>Documented proof that sanitization or destruction happened, typically a <strong>certificate of destruction</strong> from a third-party service</td><td>&mdash;</td></tr>
</table></div>
<p>The choice depends on where the device goes next: reuse inside the organization may justify a wipe, while leaving the organization or holding highly sensitive data points to destruction.</p>
<p><strong>Data retention</strong> is the other side: how long data must be <em>kept</em>, often set by law or regulation (financial records, email, logs), and when it must be disposed of. Keeping data longer than required is its own risk; it's more to breach and more to hand over in litigation.</p>
<p>Magnetic <strong>HDDs</strong> (hard disk drives) can be degaussed; SSDs can't.</p>
<p>A question may lean on the standards rather than the category:</p>
<ul>
<li><strong>Overwriting software</strong> should follow a recognized standard. <strong>NIST SP 800-88</strong> is the current guidance on media sanitization; the older <strong>DoD 5220.22-M</strong> three-pass overwrite is the name wiping tools still advertise.</li>
<li><strong>Paper</strong> needs <strong>cross-cut</strong> or <strong>micro-cut</strong> shredding &mdash; strip-cut leaves long readable ribbons that can be pieced back together. Pulping and incineration are stronger still.</li>
<li>A <strong>third-party destruction service</strong> should provide <strong>chain-of-custody</strong> documentation alongside its certificate of destruction: a record of who held the media at every step. The gap between collection and destruction is where drives go missing, and the certificate alone doesn't cover it.</li>
</ul>
<blockquote><span class="tag">Gotcha</span>Degaussing only works on <strong>magnetic</strong> media. It does nothing to an SSD or flash drive; those need secure erase, cryptographic erase or physical destruction.</blockquote>
`},

{id:"vulnid",obj:"4.3",title:"Identification Methods &mdash; Scans &amp; Application Testing",html:`
<ul>
<li><strong>Vulnerability scan</strong> &mdash; automated checks for known weaknesses across hosts: open ports, missing patches, weak configuration, unsupported software. It <em>does not exploit</em> anything. Scan from outside (the attacker's view) and inside (the insider's), and use credentialed scans for deeper results.</li>
<li><strong>Static analysis</strong> (SAST) &mdash; examines source code without running it.</li>
<li><strong>Dynamic analysis</strong> (DAST) &mdash; tests the running application. <strong>Fuzzing</strong> is the classic technique: throw large volumes of random or malformed input at it and watch for crashes, errors or odd behaviour, which reveal missing input validation.</li>
<li><strong>Package monitoring</strong> &mdash; track the third-party libraries and packages your software depends on, and where they came from. Confirm packages are genuine, from the real source, and alert when a dependency picks up a known vulnerability.</li>
<li><strong>System/process audit</strong> &mdash; reviewing configurations and procedures against policy or a standard, which finds weaknesses that aren't software bugs.</li>
</ul>
<p>Class also runs through a tool list. Read the label before the table: the older <strong>SY0-601</strong> objectives named these tools explicitly, <strong>SY0-701 does not</strong>, so on this exam they appear as answer options rather than as questions of their own. Know what each one is <em>for</em>; don't spend the fortnight memorizing switches.</p>
<div class="tblwrap"><table><caption>Tools to recognize, one line each</caption>
<tr><th>Tool</th><th>What it's for</th></tr>
<tr><td><strong>Nmap</strong></td><td>Host and port discovery, plus service and version detection &mdash; the standard active-recon scanner</td></tr>
<tr><td><strong>netstat</strong></td><td>Listening ports and active connections on the <em>local</em> machine</td></tr>
<tr><td><strong>nslookup</strong> / <strong>dig</strong></td><td>Querying DNS records; a zone transfer that the server wrongly permits hands over the whole domain at once</td></tr>
<tr><td><strong>theHarvester</strong>, <strong>dnsenum</strong></td><td>OSINT gathering &mdash; email addresses, names, hosts and subdomains from public sources</td></tr>
<tr><td><strong>curl</strong></td><td>Crafting HTTP requests by hand and reading the raw response</td></tr>
<tr><td><strong>Nessus</strong>, <strong>OpenVAS</strong></td><td>Network vulnerability scanners that check hosts against a database of known weaknesses</td></tr>
<tr><td><strong>tcpdump</strong>, <strong>Wireshark</strong></td><td>Packet capture and analysis; tcpdump on the command line, Wireshark with a GUI, both working in .pcap files</td></tr>
<tr><td><strong>hping</strong></td><td>Crafting packets to order, to see how a firewall or IDS reacts</td></tr>
<tr><td><strong>tcpreplay</strong></td><td>Replaying a saved capture back onto the wire to test whether detection rules fire</td></tr>
<tr><td><strong>Netcat</strong></td><td>Connectivity testing and banner grabbing &mdash; and, turned around, a simple backdoor listener</td></tr>
<tr><td><strong>Metasploit</strong> and similar frameworks</td><td>Exploitation &mdash; launching the matching exploit against a weakness a scanner has already found</td></tr>
</table></div>
<blockquote><span class="tag">Gotcha</span>Static = code at rest, not executed. Dynamic = running application, fuzzing. If the question says "random input to a running program," it's <strong>dynamic analysis / fuzzing</strong>.</blockquote>
`},
{id:"threatfeeds",obj:"4.3",title:"Threat Feeds &amp; Threat Intelligence",html:`
<p>Threat intelligence tells you what attackers are doing now, so you can check whether it applies to you before it arrives.</p>
<div class="tblwrap"><table><caption>Where threat intelligence comes from</caption>
<tr><th>Source</th><th>What it is</th></tr>
<tr><td><strong>OSINT</strong> &mdash; open-source intelligence</td><td>Anything publicly available: security researchers' posts, forums, social media, government advisories, public records</td></tr>
<tr><td><strong>Proprietary / third-party</strong></td><td>Paid feeds from vendors who see many customers at once and spot trends before they reach you</td></tr>
<tr><td><strong>Information-sharing organizations</strong></td><td>Groups whose members share indicators with each other, often by sector (ISACs, e.g. for finance or health) or alliances like the Cyber Threat Alliance</td></tr>
<tr><td><strong>Dark web</strong></td><td>Hidden networks reachable only with special software, where stolen data and attack tools are traded. Monitor it for your organization's name, credentials and data</td></tr>
</table></div>
`},
{id:"threatshare",obj:"4.3",title:"Threat Intelligence Standards &mdash; STIX, TAXII, AIS &amp; ATT&amp;CK",html:`
<div class="tblwrap"><table><caption>How threat intelligence is described and shared</caption>
<tr><th>Term</th><th>What it is</th></tr>
<tr><td><strong>STIX</strong> &mdash; Structured Threat Information eXpression (CompTIA's acronym list says "eXchange")</td><td>A standard <em>format</em> for describing threat intelligence: indicators, actors, campaigns</td></tr>
<tr><td><strong>TAXII</strong> &mdash; Trusted Automated eXchange of Indicator Information</td><td>The <em>transport</em> that moves STIX data between organizations</td></tr>
<tr><td><strong>AIS</strong> &mdash; Automated Indicator Sharing</td><td>CISA's free program that shares indicators with organizations using STIX and TAXII</td></tr>
<tr><td><strong>MITRE ATT&amp;CK</strong> &mdash; Adversarial Tactics, Techniques, and Common Knowledge</td><td>A public knowledge base of how attackers operate, organized by tactic (the goal) and technique (the method). Used to map detections and plan threat hunts</td></tr>
<tr><td><strong>TTPs</strong> (TTP) &mdash; tactics, techniques and procedures</td><td>How an attacker behaves. Harder for them to change than IoCs like IPs and hashes, so more durable to detect</td></tr>
</table></div>
<blockquote><span class="tag">Gotcha</span><strong>STIX is the language, TAXII is the delivery.</strong> ATT&amp;CK describes <em>behaviour</em> (TTPs), not individual indicators.</blockquote>
`},
{id:"pentest",obj:"4.3",title:"Penetration Testing &amp; Responsible Disclosure",html:`
<p>A <strong>penetration test</strong> goes further than a scan: it actually exploits vulnerabilities to prove what an attacker could do. That makes it riskier, so it runs under written <strong>rules of engagement</strong> (scope, systems in and out of bounds, permitted hours and techniques, emergency contacts, handling of any sensitive data found).</p>
<p>Terms you'll meet: <strong>lateral movement</strong> (spreading from the first system to others), <strong>persistence</strong> (keeping access with a backdoor or new account), and <strong>pivoting</strong> (using a compromised host to reach systems behind it).</p>
<p><strong>Responsible disclosure program</strong> &mdash; a published process for outsiders to report vulnerabilities to you privately, giving you time to fix before details go public (and a CVE entry is published). A <strong>bug bounty program</strong> adds a reward for valid reports.</p>
<p>A bug bounty only works with clear published rules: which systems are in scope, which techniques are forbidden (denial of service, social engineering, touching customer data), and how to report. Without them, a researcher's testing can be indistinguishable from an attack, and disputes arise over what counts as authorized.</p>
<blockquote><span class="tag">Gotcha</span><strong>Vulnerability scan</strong> identifies and does not exploit. <strong>Penetration test</strong> exploits. If the scenario involves actually gaining access, it's a pen test.</blockquote>
`},
{id:"vulnanalysis",obj:"4.3",title:"Analysis &mdash; Confirming &amp; Prioritizing",html:`
<p>Scan output is raw. Analysis turns it into an ordered to-do list.</p>
<p><strong>Confirmation</strong> first: a <strong>false positive</strong> reports a vulnerability that isn't there; a <strong>false negative</strong> misses one that is (worse, because nobody looks). Keep scanner signatures updated. A low-severity or informational finding is not a false positive &mdash; it's real, just minor.</p>
<div class="tblwrap"><table><caption>The prioritization vocabulary</caption>
<tr><th>Term</th><th>Meaning</th></tr>
<tr><td><strong>CVE</strong> &mdash; Common Vulnerabilities and Exposures</td><td>The public catalogue that gives each known vulnerability a unique ID (CVE-year-number). It names the flaw</td></tr>
<tr><td><strong>CVSS</strong> &mdash; Common Vulnerability Scoring System</td><td>A 0&ndash;10 severity score: low 0.1&ndash;3.9, medium 4.0&ndash;6.9, high 7.0&ndash;8.9, critical 9.0&ndash;10. It rates the flaw. The NVD publishes CVSS scores for each CVE</td></tr>
<tr><td><strong>Vulnerability classification</strong></td><td>Grouping by type (injection, misconfiguration, missing patch) so fixes and trends can be handled together</td></tr>
<tr><td><strong>Exposure factor</strong></td><td>The percentage of an asset's value lost if the vulnerability is exploited</td></tr>
<tr><td><strong>Environmental variables</strong></td><td>Context that raises or lowers urgency: internet-facing or isolated lab, number of users, revenue-critical or not, compensating controls already in place</td></tr>
<tr><td><strong>Industry/organizational impact</strong></td><td>What exploitation would do to <em>this</em> business &mdash; a hospital closing its emergency department, a utility losing power delivery</td></tr>
<tr><td><strong>Risk tolerance</strong></td><td>How much risk the organization will accept while a fix is tested; low tolerance means patching faster</td></tr>
</table></div>
<p>Exposure factor feeds straight into quantitative risk: <strong>SLE = asset value x exposure factor</strong>. A $200,000 server with an exposure factor of 25% has a single loss expectancy of $50,000. Multiply SLE by the annualized rate of occurrence (ARO) to get ALE, the expected yearly loss.</p>
<blockquote><span class="tag">Gotcha</span><strong>CVE names it; CVSS scores it.</strong> A CVSS 9.8 on an isolated lab box can rightly rank below a 7.5 on the public web server &mdash; environmental variables adjust the raw score.</blockquote>
`},
{id:"vulnresponse",obj:"4.3",title:"Vulnerability Response, Validation &amp; Reporting",html:`
<div class="tblwrap"><table><caption>Response options</caption>
<tr><th>Option</th><th>When it fits</th></tr>
<tr><td><strong>Patching</strong></td><td>The primary fix. Scheduled for routine updates; emergency out-of-cycle for actively exploited zero-days</td></tr>
<tr><td><strong>Insurance</strong></td><td>Transfers the financial impact (ransomware losses, recovery, legal costs). It doesn't reduce the likelihood</td></tr>
<tr><td><strong>Segmentation</strong></td><td>Isolates vulnerable systems so exploitation can't spread; unpatchable systems may go on their own segment or be air-gapped</td></tr>
<tr><td><strong>Compensating controls</strong></td><td>When you can't patch: disable the vulnerable service, block it at the firewall, restrict access with ACLs, add a host firewall or IPS rule</td></tr>
<tr><td><strong>Exceptions and exemptions</strong></td><td>A formal, documented decision (usually by a committee) to accept the risk and not remediate for now &mdash; with a review date, not forever</td></tr>
</table></div>
<p><strong>Validation of remediation</strong> proves the fix worked: <strong>rescanning</strong> the systems, <strong>auditing</strong> a sample by hand, and <strong>verification</strong> from the patch system that deployment succeeded.</p>
<p><strong>Reporting</strong> gives management the picture at scale: vulnerabilities found and fixed, systems still exposed, exceptions granted, and trends over time.</p>
<p>Patching has its own risk: an untested patch can crash a production system, which is why patches go through a test environment first unless the vulnerability is being actively exploited. And an exception is never just "leave it alone" &mdash; the approved exception normally comes with extra monitoring or a compensating control to reduce the risk that was accepted.</p>
<blockquote><span class="tag">Gotcha</span>Patching is the fix; a <strong>compensating control</strong> is a substitute when you can't patch. An <strong>exception</strong> accepts the risk outright and needs formal approval, not one admin's decision.</blockquote>
`},

{id:"monitorres",obj:"4.4",title:"Monitoring Computing Resources",html:`
<p>Monitoring covers three layers, and each answers a different question.</p>
<ul>
<li><strong>Systems</strong> &mdash; who logged in and from where (a login from a country with no employees is a red flag), services running, backups completing, software versions that need patches.</li>
<li><strong>Applications</strong> &mdash; availability, errors, and unusual data volumes that may signal exfiltration.</li>
<li><strong>Infrastructure</strong> &mdash; network devices, VPN usage by employees, vendors and guests, firewall and IPS attack trends, bandwidth.</li>
</ul>
`},
{id:"monitoract",obj:"4.4",title:"Monitoring Activities &amp; Alert Response",html:`
<ol>
<li><strong>Log aggregation</strong> &mdash; collect logs in many formats from many devices into one place, normalized so they can be searched and correlated.</li>
<li><strong>Scanning</strong> &mdash; continuously check endpoints: OS versions, installed apps, drivers, compliance with the baseline.</li>
<li><strong>Alerting</strong> &mdash; real-time notification when something crosses a threshold: a burst of failed logins (password spraying), a large outbound transfer.</li>
<li><strong>Reporting</strong> &mdash; actionable reports (which devices are non-compliant and what to fix) and ad hoc "what if" reports (how many systems are exposed if this OS goes end-of-life).</li>
<li><strong>Archiving</strong> &mdash; keep logs long term. Breaches often go unnoticed for months, so the evidence has to still exist when you look back; retention may also be required by law.</li>
</ol>
<p><strong>Alert response and remediation/validation</strong>:</p>
<ul>
<li><strong>Quarantine</strong> &mdash; isolate the affected system so the attacker can't spread or pivot while you investigate.</li>
<li><strong>Alert tuning</strong> &mdash; adjust thresholds and rules to cut false positives without creating false negatives. Too noisy, and analysts stop reading; too quiet, and attacks pass silently. The noisy failure has a name: <strong>alert fatigue</strong>, where the sheer volume of low-value alerts trains analysts to dismiss them unread, and the one real detection goes out with the rest. The response is <em>quality over quantity</em> &mdash; <strong>filter</strong> out what nobody would ever act on, <strong>normalize</strong> so the same event from different sources reads the same way, and <strong>tune</strong> until every alert that survives is actionable. Give priority to alerts a human raised (a user reporting a phishing email is a high-quality signal), and route everything through a defined <strong>escalation path</strong>, so an alert nobody handles moves up instead of quietly ageing.</li>
</ul>
`},
{id:"scapbench",obj:"4.4",title:"SCAP, Benchmarks &amp; Agents vs. Agentless",html:`
<p><strong>SCAP</strong> (Security Content Automation Protocol) is a NIST-maintained set of standards that gives security tools a common language for vulnerabilities and configuration checks. Because a scanner, a firewall and a patch system describe the same issue the same way, the whole loop can be automated: the scanner finds it, the management system fixes it.</p>
<p><strong>Benchmarks</strong> are published best-practice configurations for a specific OS, application, device or cloud service &mdash; the <strong>CIS</strong> (Center for Internet Security) Benchmarks are the best known. They're a ready-made starting point for a secure baseline.</p>
<div class="tblwrap"><table><caption>Agents vs. agentless</caption>
<tr><th></th><th>Agent-based</th><th>Agentless</th></tr>
<tr><td>Install</td><td>Software permanently installed on the device</td><td>Nothing installed; runs remotely or temporarily (at login or VPN connect) and removes itself</td></tr>
<tr><td>Coverage</td><td>Always running, continuous visibility, works off-network</td><td>Only when it runs</td></tr>
<tr><td>Upkeep</td><td>Agent and its definitions must be updated</td><td>No agent maintenance</td></tr>
</table></div><p>Within SCAP, <strong>OVAL</strong> (Open Vulnerability Assessment Language) is the language for describing what to check on a system and what state counts as vulnerable.</p>
<p>Agentless monitoring usually works by querying the device over the network with its existing management protocols &mdash; SNMP, SSH or WMI. It is quicker to roll out (nothing to install, good for network gear and appliances that can't run an agent) but sees less detail than an agent sitting on the host.</p>
<p>SCAP is a <em>bundle</em> of specifications rather than a single language, and OVAL is only one of them. Two others turn up alongside it in Security+ material:</p>
<ul>
<li><strong>XCCDF</strong> (Extensible Configuration Checklist Description Format) &mdash; the checklist and benchmark language. A CIS Benchmark or a DISA STIG published in machine-readable form is XCCDF: the rules, the pass/fail criteria and the scoring.</li>
<li><strong>CPE</strong> (Common Platform Enumeration) &mdash; a standard naming scheme for platforms and products, so one agreed string means the same operating system or application to every tool and a check can be aimed at exactly the right systems.</li>
</ul>
<p>Read as a sentence: <strong>CPE</strong> names the thing, <strong>OVAL</strong> describes how to test it, and <strong>XCCDF</strong> gathers those tests into the checklist you actually run.</p>

`},
{id:"montools",obj:"4.4",title:"Monitoring Tools &mdash; SIEM, DLP, SNMP &amp; NetFlow",html:`
<div class="tblwrap"><table><caption>The named tools</caption>
<tr><th>Tool</th><th>What it contributes</th></tr>
<tr><td><strong>SIEM</strong> &mdash; security information and event management</td><td>Central log store with correlation across sources (VPN login + file access + firewall block = one story), alerting, dashboards and long-term forensic look-back</td></tr>
<tr><td><strong>SOAR</strong> &mdash; security orchestration, automation and response</td><td>Takes the SIEM's alerts, categorizes them by context (asset criticality, data classification, SLA tier) and runs <strong>playbooks</strong> &mdash; ordered response steps that execute fully automated, semi-automated or manual. An orchestration and response layer, <em>not</em> a log store</td></tr>
<tr><td><strong>Antivirus / anti-malware</strong></td><td>Detects and blocks malicious code on endpoints; the two terms are now effectively interchangeable</td></tr>
<tr><td><strong>DLP</strong> &mdash; data loss prevention</td><td>Spots and blocks sensitive data (card numbers, SSNs, health data) leaving where it should stay</td></tr>
<tr><td><strong>SNMP traps</strong></td><td>SNMP normally has a manager <em>poll</em> devices for statistics (UDP 161). A <strong>trap</strong> is the device pushing an alert to the manager unprompted when a threshold is crossed (UDP 162)</td></tr>
<tr><td><strong>NetFlow</strong></td><td>Flow records &mdash; who talked to whom, on what port, how much &mdash; gathered by a probe and sent to a collector. Metadata about traffic, not the payload</td></tr>
<tr><td><strong>Vulnerability scanners</strong></td><td>Scheduled discovery of devices and known weaknesses, feeding results into the monitoring picture</td></tr>
</table></div>
<p>NetFlow earns its place in scenarios about <strong>traffic patterns</strong>: a sudden flood of flows toward one server suggests DDoS; a workstation sending gigabytes to an unfamiliar external address at 2 a.m. suggests exfiltration. It flags that something is wrong and who is involved; a packet capture is what shows the actual content.</p>
<p><strong>Why v3.</strong> SNMP <strong>v1</strong> and <strong>v2c</strong> authenticate with nothing more than a <strong>community string</strong> &mdash; a shared word sent across the network <em>in clear text</em>, in either a read-only or a read-write form. Anyone who can capture a packet, or who simply guesses that the string is still the vendor default, can read the device's statistics; with the read-write string they can reconfigure it. <strong>v3</strong> replaces the community string with per-user or per-group authentication, adds message integrity so a query can't be altered in transit, and encrypts the payload with <strong>AES</strong>. It also ships with no default passwords, so an unconfigured v3 agent answers nobody. Whenever a scenario says network monitoring has to be secure, the answer is <strong>SNMPv3</strong>.</p>
<p><strong>Antivirus is more than a signature match.</strong> Signatures only catch malware somebody has already seen and written a definition for, so a modern engine layers other detection on top. <strong>Heuristic</strong> rules examine a file's code structure and its behaviour when it runs &mdash; does it hook the keyboard, rewrite the boot sector, encrypt files in bulk? &mdash; and judge it on how it acts rather than on what it matches. Files that still look suspicious are detonated in a local <strong>sandbox</strong> or sent for <strong>cloud detonation</strong>, where the vendor runs them in an isolated environment and watches what they do. Anything that fails is <strong>quarantined</strong>: moved somewhere it cannot execute but not destroyed, so a false positive can be restored and a genuine sample can be analyzed. That chain is how AV catches malware for which no signature exists yet.</p>
<p>A NetFlow record identifies a conversation by its <strong>5-tuple</strong>: <strong>source IP</strong>, <strong>destination IP</strong>, <strong>source port</strong>, <strong>destination port</strong> and the <strong>IP protocol</strong>. Watch that last field in exam options &mdash; the protocol is the one named in the IP header, so it is <strong>TCP, UDP or ICMP</strong>, never FTP or HTTP. Those are applications, and a flow tool infers them from the <em>port</em> (TCP 21, TCP 80), not from the protocol field.</p>
<blockquote><span class="tag">Gotcha</span><strong>SNMP polling vs. trap</strong>: polling is the manager asking on a schedule (port 161); a trap is the device telling the manager immediately (port 162). <strong>NetFlow vs. packet capture</strong>: NetFlow records the conversation's metadata; a packet capture records the contents.</blockquote>
`},

{id:"fwrules",obj:"4.5",title:"Firewall Rules, Access Lists &amp; Screened Subnets",html:`
<p>A firewall rule base (also called an <strong>access control list, ACL</strong>) is a list of rules matching on source, destination, port/protocol and, on an NGFW, application, user or URL category, each with an allow or deny action.</p>
<ul>
<li>Rules are processed <strong>top-down, first match wins</strong>, so specific rules go above general ones.</li>
<li>Anything that matches no rule hits the <strong>implicit deny</strong> at the bottom.</li>
<li>Rules are written by <strong>ports/protocols</strong>: allow TCP 443 to the web server, allow TCP 22 only from the admin subnet, deny inbound ICMP, and so on. Open only what the service needs.</li>
<li><strong>Stateless</strong> ACLs judge each packet alone; <strong>stateful</strong> firewalls track connections and allow the return traffic automatically.</li>
</ul>
<p>A <strong>screened subnet</strong> (the old DMZ) is a separate segment for internet-facing services. Rules let the internet reach those servers, but not pass through them into the internal network, so a compromised web server doesn't expose everything behind it.</p>
<p>Don't forget <strong>egress</strong> (outbound) rules. Many organizations allow all outbound traffic, which lets malware reach its command-and-control server and lets attackers move data out freely. Restricting outbound traffic to what's needed &mdash; for example, only the proxy may reach the internet on 80/443, and only the internal DNS servers may query external DNS &mdash; turns the firewall into a detection and containment point too.</p>
<blockquote><span class="tag">Gotcha</span>A broad "allow" rule placed above a specific "deny" means the deny is never reached. When a question asks why a block isn't working, check the <strong>rule order</strong>.</blockquote>
`},
{id:"nat",obj:"4.5",title:"NAT, PAT &amp; DNAT",html:`
<ul>
<li><strong>NAT</strong> (network address translation) &mdash; rewrites private internal addresses to public ones at the firewall or router.</li>
<li><strong>PAT</strong> (port address translation, NAT overload) &mdash; many internal hosts share one public IP, told apart by port number. What almost every home and office uses.</li>
<li><strong>DNAT</strong> (destination NAT, port forwarding) &mdash; maps a public address and port to an internal server so it can be reached from outside. Every DNAT rule is a deliberate hole, so point it at the screened subnet, not the internal network.</li>
</ul>
<blockquote><span class="tag">Gotcha</span>NAT hides internal addresses but <strong>is not a firewall</strong> &mdash; filtering rules still decide what gets through.</blockquote>
`},
{id:"idstune",obj:"4.5",title:"IDS/IPS &mdash; Signatures &amp; Trends",html:`
<p>How NIDS, HIDS and IPS work is in the Domain 3 Notebook (3.2). For 4.5, the question is how you <em>tune</em> them.</p>
<ul>
<li><strong>Signatures</strong> &mdash; the rule base holds thousands of patterns for specific known attacks. You enable, disable, or group them (block every SQL-injection signature at once, for example), and keep them updated. Out-of-date signatures produce false negatives.</li>
<li><strong>Trends</strong> &mdash; looking across alerts over time: which attacks are rising, which hosts are targeted most, where false positives cluster. Trend data tells you which rules to tighten, which to relax, and where to focus.</li>
</ul>
<p>A common rollout: deploy an IPS in detect-only mode first, tune out the false positives, then switch it to blocking.</p>
`},
{id:"webfilter",obj:"4.5",title:"Web Filtering",html:`
<p>Web filters control which websites users can reach, both to enforce acceptable use and to keep malware out.</p>
<div class="tblwrap"><table><caption>The web filter terms</caption>
<tr><th>Term</th><th>Meaning</th></tr>
<tr><td><strong>Agent-based</strong></td><td>Filtering software on the device itself, centrally managed. It works on any network, including home and hotel Wi-Fi</td></tr>
<tr><td><strong>Centralized proxy</strong></td><td>All web traffic goes through a proxy that filters, caches and logs. It only protects users whose traffic passes through it</td></tr>
<tr><td><strong>URL scanning</strong></td><td>Checking each requested URL against allow and block lists and threat intelligence</td></tr>
<tr><td><strong>Content categorization</strong></td><td>Sites grouped into categories (gambling, malware, social media, news) so policy can be written per category instead of per site</td></tr>
<tr><td><strong>Block rules</strong></td><td>The policy itself: block by URL, domain or category, or allow but log</td></tr>
<tr><td><strong>Reputation</strong></td><td>A risk score for each site, from trustworthy to high risk, often assigned automatically; block anything below a threshold</td></tr>
</table></div>
<p><strong>DNS filtering</strong> works one layer earlier: the DNS resolver refuses to resolve known-malicious domains. It protects every application, not just browsers &mdash; including malware trying to reach its command-and-control server.</p>
<p>Browsers can be pointed at the filtering proxy automatically with a <strong>PAC</strong> (proxy auto-configuration) file. A URL is one kind of <strong>URI</strong> (uniform resource identifier).</p>
<p>An agent on the endpoint is also harder to get around. A user who switches browsers, changes proxy settings or uses a different app to reach a blocked site still passes through the agent, whereas a proxy only sees traffic that is actually sent to it.</p>
<blockquote><span class="tag">Gotcha</span>Firewall or proxy filtering stops working when a laptop leaves the building. If the scenario involves <strong>remote or travelling users</strong>, the answer is <strong>agent-based</strong> filtering (or cloud DNS filtering).</blockquote>
`},
{id:"ossec",obj:"4.5",title:"Operating System Security &mdash; Group Policy &amp; SELinux",html:`
<ul>
<li><strong>Group Policy</strong> &mdash; the Windows/Active Directory mechanism for pushing configuration and security settings to users and computers centrally: password and lockout policy, screen lock, software restrictions, drive mappings, firewall settings. Settings are bundled into Group Policy Objects (GPOs) and linked to domains or organizational units (OUs).</li>
<li><strong>SELinux</strong> (Security-Enhanced Linux) &mdash; adds <strong>mandatory access control</strong> to Linux, which by default uses discretionary access control. Policy decides what every process may touch, so a compromised service is confined to its allowed files and ports. Modes: <em>enforcing</em> (blocks and logs), <em>permissive</em> (logs only), <em>disabled</em>.</li>
</ul>
<p>File permissions on Linux can be extended with a file-system access control list (<strong>FACL</strong>) to grant rights to more than one user or group.</p>
<p>The point of SELinux in a scenario is that its policy applies <strong>even to root</strong>. If an attacker compromises a web server process running with high privileges, SELinux still limits it to the files, ports and actions the web server policy allows, so the compromise stays contained.</p>
<blockquote><span class="tag">Gotcha</span>Standard Linux permissions are <strong>DAC</strong> (the owner decides). <strong>SELinux adds MAC</strong> (central policy decides). If a question asks how to enforce least privilege on Linux processes regardless of file owner, it's SELinux.</blockquote>
`},
{id:"secprotocols",obj:"4.5",title:"Implementing Secure Protocols",html:`
<p>Three decisions: <strong>protocol selection</strong> (use the encrypted version), <strong>port selection</strong> (the port suggests but doesn't guarantee encryption; verify with a packet capture), and the <strong>transport method</strong> (encrypt everything in the tunnel &mdash; WPA3 on wireless, or a VPN &mdash; when the application itself can't).</p>
<div class="tblwrap"><table><caption>Insecure protocols and their replacements</caption>
<tr><th>Insecure</th><th>Port</th><th>Secure replacement</th><th>Port</th></tr>
<tr><td>Telnet</td><td>23</td><td>SSH</td><td>22</td></tr>
<tr><td>FTP</td><td>20/21</td><td>SFTP (over SSH) / FTPS (over TLS)</td><td>22 / 989&ndash;990</td></tr>
<tr><td>HTTP</td><td>80</td><td>HTTPS</td><td>443</td></tr>
<tr><td>SMTP</td><td>25</td><td>SMTP with TLS</td><td>465 / 587</td></tr>
<tr><td>POP3</td><td>110</td><td>POP3S</td><td>995</td></tr>
<tr><td>IMAP</td><td>143</td><td>IMAPS</td><td>993</td></tr>
<tr><td>LDAP</td><td>389</td><td>LDAPS</td><td>636</td></tr>
<tr><td>SNMPv1/v2c</td><td>161/162</td><td>SNMPv3</td><td>161/162</td></tr>
<tr><td>DNS</td><td>53</td><td>DNSSEC (integrity only), DoH/DoT</td><td>53 / 443 / 853</td></tr>
</table></div>
<p>Other ports worth knowing: RDP 3389, Kerberos 88, RADIUS 1812/1813, TACACS+ 49, NTP 123, SMB 445, syslog 514, DHCP 67/68.</p>
<p>More protocol pairs from the acronym list:</p>
<ul>
<li><strong>RTP vs. SRTP</strong> &mdash; the Real-time Transport Protocol carries voice and video streams in the clear; Secure RTP adds encryption and authentication. Use SRTP for VoIP.</li>
<li><strong>SMTPS</strong> &mdash; SMTP secured with TLS (ports 465/587).</li>
<li><strong>TSIG</strong> (transaction signature) &mdash; uses a shared key to authenticate DNS zone transfers and dynamic updates between DNS servers.</li>
<li><strong>S-HTTP</strong> (SHTTP) &mdash; an old message-level alternative to HTTPS that never caught on; <strong>WTLS</strong> &mdash; wireless TLS from the early mobile WAP era. Both are historical.</li>
<li>All of these ride on <strong>TCP/IP</strong>, the protocol suite of the internet.</li>
</ul>
<div class="tblwrap"><table><caption>RADIUS vs. TACACS+ &mdash; both on the acronym list, and a favourite contrast</caption>
<tr><th></th><th>RADIUS</th><th>TACACS+</th></tr>
<tr><td>Origin</td><td>Open standard &mdash; works across vendors</td><td>Cisco's own, though widely supported</td></tr>
<tr><td>Transport</td><td><strong>UDP</strong> 1812/1813 (older 1645/1646)</td><td><strong>TCP port 49</strong></td></tr>
<tr><td>What is encrypted</td><td>The <strong>password only</strong> &mdash; username and accounting data cross the network in the clear</td><td>The <strong>entire payload</strong></td></tr>
<tr><td>AAA handling</td><td>Authentication and authorization bundled together; accounting is its strong suit</td><td>Authentication, authorization and accounting kept <em>separate</em></td></tr>
<tr><td>Normal use</td><td>Network access &mdash; 802.1X, wireless, VPN and dial-in users</td><td>Device administration &mdash; can authorize individual commands on a router or switch</td></tr>
</table></div>
<p>The separation is what earns TACACS+ its place on network gear: because authorization is a separate exchange, the server can be asked to approve each command an engineer types, so a junior admin is granted read-only show commands and nothing more. RADIUS cannot do that, which is why a scenario about <em>who may run which command on a switch</em> points at TACACS+, while a scenario about <em>letting a user onto the network</em> points at RADIUS.</p>
<blockquote><span class="tag">Gotcha</span><strong>SFTP</strong> runs over SSH on port 22. <strong>FTPS</strong> is FTP wrapped in TLS. They're different protocols despite the similar names. And <strong>DNSSEC signs DNS records for integrity; it does not encrypt them</strong>.</blockquote>
`},
{id:"emailsec",obj:"4.5",title:"Email Security &mdash; SPF, DKIM, DMARC &amp; Gateways",html:`
<p>Email was built with no sender verification, so spoofing is trivial. Three DNS-published records fix that, each building on the last:</p>
<div class="tblwrap"><table><caption>The email authentication stack</caption>
<tr><th>Record</th><th>What it proves</th><th>How</th></tr>
<tr><td><strong>SPF</strong> &mdash; Sender Policy Framework</td><td>The sending <em>server</em> is authorized for this domain</td><td>A DNS TXT record listing the servers allowed to send mail for the domain</td></tr>
<tr><td><strong>DKIM</strong> &mdash; DomainKeys Identified Mail</td><td>The message really came from the domain and <em>wasn't altered</em> in transit</td><td>The sending mail server digitally signs each message; the receiver checks it against the public key published in DNS</td></tr>
<tr><td><strong>DMARC</strong> &mdash; Domain-based Message Authentication, Reporting and Conformance</td><td>What to <em>do</em> when SPF/DKIM fail, and <em>reports</em> back to the domain owner</td><td>A DNS TXT policy: none (monitor), quarantine (spam folder) or reject, plus a reporting address</td></tr>
</table></div>
<p>An email <strong>gateway</strong> sits in front of the mail server (on-premises in the screened subnet, or as a cloud service), checking inbound and outbound mail for spam, malware, phishing and sensitive data before it's delivered.</p>
<p>A domain's <strong>MX</strong> (mail exchange) records tell the world which servers receive its mail; pointing them at the gateway or cloud filter is how inbound mail is forced through it. <strong>S/MIME</strong> (Secure/Multipurpose Internet Mail Extensions) is different from SPF/DKIM/DMARC: it uses each user's certificate to encrypt and sign individual messages end to end.</p>
<blockquote><span class="tag">Gotcha</span>SPF = <strong>which servers</strong>. DKIM = <strong>signature/integrity</strong>. DMARC = <strong>policy and reporting</strong> built on top of the other two. DMARC alone does nothing without SPF or DKIM.</blockquote>
`},
{id:"fim",obj:"4.5",title:"File Integrity Monitoring",html:`
<p><strong>File integrity monitoring (FIM)</strong> watches files that shouldn't change &mdash; OS binaries, system configuration, application executables, the registry &mdash; and alerts when they do. It works by recording a known-good hash of each file and comparing against it. A changed system file is a classic sign of a rootkit or tampering.</p>
<p>Examples: Windows <strong>System File Checker (SFC)</strong> scans protected files on demand and restores good copies; <strong>Tripwire</strong> is the classic real-time FIM tool on Linux; HIPS and EDR agents often include it.</p><p>Attackers often edit or clear log files to hide their tracks, so FIM is worth pointing at security logs and audit configuration as well as system binaries. An alert that a log file shrank or an audit policy changed is a strong sign someone is covering up activity.</p>

`},
{id:"dlp",obj:"4.5",title:"Data Loss Prevention (DLP)",html:`
<p><strong>DLP</strong> identifies sensitive data &mdash; card numbers, SSNs, health records, source code &mdash; and stops it going where it shouldn't. It can block, encrypt, quarantine or just alert.</p>
<div class="tblwrap"><table><caption>Where DLP runs</caption>
<tr><th>Placement</th><th>Watches</th></tr>
<tr><td><strong>Endpoint</strong></td><td>Data in use on the device: copying to USB, printing, uploading. Can disable removable storage entirely</td></tr>
<tr><td><strong>Network</strong></td><td>Data in motion, from an appliance or NGFW</td></tr>
<tr><td><strong>Storage</strong></td><td>Data at rest on file servers and databases, finding sensitive files in the wrong place</td></tr>
<tr><td><strong>Cloud / email</strong></td><td>Uploads to cloud apps and outbound email, the most common leak path</td></tr>
</table></div>
`},
{id:"nac",obj:"4.5",title:"Network Access Control (NAC)",html:`
<p><strong>NAC</strong> decides whether a device may join the network, and on what terms, by checking both identity (usually 802.1X) and <strong>posture</strong>: is antivirus running and current, is the OS patched, is disk encryption on, is the company certificate present?</p>
<ul>
<li><strong>Persistent agent</strong> &mdash; permanently installed, checking continuously.</li>
<li><strong>Dissolvable agent</strong> &mdash; downloaded at connect, runs the check, then removes itself.</li>
<li><strong>Agentless</strong> &mdash; integrated with the directory, checking at login and logout with nothing installed.</li>
</ul>
<p>A device that fails is typically placed on a <strong>quarantine or remediation VLAN</strong> with just enough access to fix itself, then re-checked.</p>
`},
{id:"edrxdr",obj:"4.5",title:"EDR, XDR &amp; User Behavior Analytics",html:`
<p>With over a million new malware variants a day, signature-based antivirus alone can't keep up.</p>
<ul>
<li><strong>EDR</strong> (endpoint detection and response) &mdash; an agent that combines signatures with behavioural analysis, machine learning and process monitoring. It can <em>respond</em> automatically (isolate the host, kill the process, roll back changes) and supports root-cause analysis of how the infection happened.</li>
<li><strong>XDR</strong> (extended detection and response) &mdash; EDR's reach extended across endpoints, network, cloud, email and identity, correlating them so one attack shows up as one incident instead of scattered alerts. Fewer missed detections, fewer false positives, faster investigation.</li>
<li><strong>User behavior analytics (UBA / UEBA)</strong> &mdash; learns a baseline of how each user and device normally behaves and flags deviations: a 3 a.m. login, a sudden bulk download, access to systems the person never uses.</li>
</ul>
<p>Much of this relies on <strong>AI</strong> (artificial intelligence) and machine learning to spot patterns in huge volumes of data. Attackers use AI too: more convincing phishing, deepfake voices and video, and faster vulnerability discovery.</p>
<blockquote><span class="tag">Gotcha</span><strong>EDR = one endpoint's view. XDR = correlated across many sources.</strong> UBA is about <em>people's</em> behaviour, which makes it the answer for insider threats and compromised accounts that pass every signature check.</blockquote>
`},

{id:"provisioning",obj:"4.6",title:"Provisioning, Permissions &amp; Identity Proofing",html:`
<p>IAM (identity and access management) exists to give the right people the right access at the right time, and take it away when that stops being true.</p>
<ul>
<li><strong>Provisioning / de-provisioning user accounts</strong> &mdash; create the account and its access at onboarding; adjust it when someone changes role; disable it promptly at offboarding. Slow de-provisioning is how ex-employees keep access.</li>
<li><strong>Permission assignments and implications</strong> &mdash; grant through groups rather than to individuals, start from least privilege, and watch for <strong>privilege creep</strong>, which courseware also calls <strong>authorization creep</strong> (people collecting access with every role change and never losing any). Every excess permission is something an attacker inherits if the account is compromised, so the counters are scheduled entitlement reviews and an automatic expiry date on any right granted temporarily, so that access meant for one project lapses on its own rather than waiting on someone remembering to remove it.</li>
<li><strong>Identity proofing</strong> &mdash; confirming someone is who they claim before issuing credentials: government ID, in-person checks, background checks, or knowledge-based questions drawn from public and credit records.</li>
<li><strong>Attestation</strong> &mdash; formal confirmation that access is still correct, usually a periodic review where managers sign off on their team's permissions. Also used for a device vouching for its own integrity (hardware attestation via TPM).</li>
</ul>
`},
{id:"sso",obj:"4.6",title:"Federation, SSO, LDAP, SAML &amp; OAuth",html:`
<p><strong>Single sign-on (SSO)</strong> means authenticating once and reaching many systems without logging in again, usually for a set period. <strong>Federation</strong> extends that trust across organizations: you log in to a site with an identity another party manages ("Sign in with Google"). The site trusts the identity provider instead of keeping its own password store.</p>
<div class="tblwrap"><table><caption>The named protocols</caption>
<tr><th>Protocol</th><th>Role</th><th>Key facts</th></tr>
<tr><td><strong>LDAP</strong> &mdash; Lightweight Directory Access Protocol</td><td>Querying and updating a directory (users, groups, devices)</td><td>Based on X.500; entries named by distinguished names like CN=, OU=, DC=. Port 389; LDAPS 636. Active Directory speaks it</td></tr>
<tr><td><strong>SAML</strong> &mdash; Security Assertion Markup Language</td><td><strong>Authentication</strong> and SSO for web apps</td><td>XML-based. The identity provider issues a signed assertion the service provider trusts. Built for browsers, not native mobile apps</td></tr>
<tr><td><strong>OAuth</strong> &mdash; Open Authorization</td><td><strong>Authorization</strong> &mdash; delegated access</td><td>Lets an app act on your behalf with limited scope ("allow this app to read your calendar") using access tokens, without seeing your password. Paired with <strong>OpenID Connect</strong> when authentication is also needed</td></tr>
</table></div>
<p>The SAML flow: user requests the app &rarr; app redirects to the identity provider &rarr; user authenticates there &rarr; identity provider returns a signed assertion &rarr; browser presents it to the app &rarr; access granted.</p>
<p><strong>Interoperability</strong> is the practical constraint: the IAM pieces you choose must work with what you already have. A new VPN concentrator that speaks LDAP fits an Active Directory shop; an app that uses OAuth needs an authentication source that can feed it.</p>
<p>SSO's convenience is also its risk: it concentrates everything behind one credential and one identity provider. If an SSO account is compromised, the attacker reaches every connected application; if the identity provider goes down, nobody can log in to anything. That's why SSO is paired with strong MFA and a highly available identity provider.</p>
<p><strong>PAM is two different things on CompTIA's acronym list.</strong> In an identity topic it can mean <strong>Pluggable Authentication Modules</strong>, the Linux framework that lets any service &mdash; local login, SSH, <em>sudo</em>, a screen locker &mdash; hand authentication over to a shared stack of modules instead of implementing its own. An administrator edits the module stack for a service and every program that uses it changes behaviour at once, which is how account lockout, password quality rules or an MFA step get bolted onto tools that know nothing about any of them. The other PAM, <strong>privileged access management</strong>, is its own objective and its own topic here. The exam will not disambiguate for you: the bullet the question sits under decides it &mdash; Linux authentication points at modules, vaulting and just-in-time admin rights point at privileged access management.</p>
<p>It is worth knowing where a credential actually goes when someone signs in, because that is precisely what a pass-the-hash attack abuses:</p>
<ul>
<li><strong>Windows local sign-in</strong> &mdash; the <strong>LSA</strong> (local security authority, running as the LSASS process) checks the credential against a password hash held in the <strong>SAM</strong> (security accounts manager) database on that machine. Hashes scraped out of LSASS memory are what an attacker replays.</li>
<li><strong>Windows network sign-in</strong> &mdash; the credential goes to a domain controller, which uses <strong>Kerberos</strong> by preference and falls back to <strong>NTLM</strong> only for legacy clients. NTLM is the half that will accept a replayed hash, which is why disabling it shuts the attack down.</li>
<li><strong>Remote sign-in</strong> &mdash; the same checks reached from outside, over a VPN tunnel or a web portal.</li>
<li><strong>Linux</strong> &mdash; account names, UIDs and shells live in <em>/etc/passwd</em>, which every user can read; the password hashes sit separately in <em>/etc/shadow</em>, readable only by root. Splitting the two is what stops any local user from harvesting hashes to crack offline at leisure.</li>
</ul>
<p>LDAP is a named bullet, so know how a directory is shaped. It stores <strong>objects</strong> (users, groups, printers, servers), and the <strong>schema</strong> defines which attributes each type of object is allowed to carry. Every object is identified by a <strong>distinguished name (DN)</strong> &mdash; its full path through the directory, written as comma-separated attribute=value pairs, most specific first:</p>
<div class="tblwrap"><table><caption>Reading a distinguished name</caption>
<tr><th>Pair</th><th>What it names</th></tr>
<tr><td><strong>CN</strong></td><td>Common name &mdash; the object itself (CN=Jane Okafor)</td></tr>
<tr><td><strong>OU</strong></td><td>Organizational unit &mdash; the container it sits in, usually a department (OU=Finance)</td></tr>
<tr><td><strong>O</strong></td><td>Organization &mdash; the company (O=Acme)</td></tr>
<tr><td><strong>C</strong></td><td>Country (C=GB)</td></tr>
<tr><td><strong>DC</strong></td><td>Domain component &mdash; one label of the DNS name, so one DC per label (DC=acme,DC=com)</td></tr>
</table></div>
<p>CN=Jane Okafor,OU=Finance,DC=acme,DC=com therefore reads right to left as a walk down the tree. The leftmost pair on its own is the <strong>relative distinguished name (RDN)</strong>, which only has to be unique inside its own container &mdash; two people called Jane Okafor are no problem so long as they sit in different OUs.</p>
<p>The federation handshake in concrete terms: the user reaches the <strong>service provider</strong> &rarr; is redirected to their own <strong>identity provider</strong> &rarr; authenticates there &rarr; returns carrying a signed <strong>assertion</strong>. The statements inside it about the user &mdash; name, e-mail address, group membership &mdash; are <strong>claims</strong>. A SAML assertion is XML signed with the XML Signature standard and normally carried over HTTPS, so the service provider can confirm both that the assertion came from the identity provider it trusts and that nothing altered it in the browser on the way through.</p>
<blockquote><span class="tag">Gotcha</span><strong>OAuth is authorization, not authentication.</strong> SAML and OpenID Connect authenticate; OAuth delegates access. SSO is the user experience; federation is the trust relationship across organizations.</blockquote>
`},
{id:"kerberos",obj:"4.6",title:"Kerberos &amp; NTLM",html:`
<p><strong>Kerberos</strong> is the ticket-based SSO protocol behind Active Directory logins:</p>
<ol>
<li>The user logs in and the <strong>KDC</strong> (key distribution center, on the domain controller) verifies them and issues a <strong>TGT</strong> (ticket granting ticket).</li>
<li>When the user wants a service, they present the TGT to the KDC and receive a service ticket for that server.</li>
<li>The service ticket is presented to the server; the password is never sent across the network. Tickets expire, and clocks must be in sync.</li>
</ol>
<p><strong>NTLM</strong> (NT LAN Manager) is the older Windows challenge-response protocol, still used as a fallback. It's vulnerable to pass-the-hash and relay attacks; disable it where Kerberos is available.</p>
<p>The KDC is really two services, and an exam question may name them separately:</p>
<ul>
<li><strong>Authentication Service (AS)</strong> &mdash; verifies the user at logon and issues the TGT.</li>
<li><strong>Ticket Granting Service (TGS)</strong> &mdash; takes that TGT and issues a separate service ticket for each resource the user then asks for.</li>
</ul>
<p>Everything Kerberos knows about is a <strong>principal</strong> &mdash; users and services alike &mdash; which is why a file server or a SQL instance needs its own identity in the directory before it can accept tickets at all.</p>
<p>This is also where the clock requirement comes from. The client's opening request is time-stamped and encrypted with a key derived from the user's password hash; the KDC decrypts it with the hash it already holds, which proves the password without the password ever crossing the network, then checks that the time-stamp is recent so a captured request cannot simply be replayed later. If the two clocks differ by more than the tolerance &mdash; five minutes by default &mdash; every genuine request looks like a replay and logons fail across the board.</p>
<blockquote><span class="tag">Gotcha</span>Kerberos needs <strong>time synchronization</strong> (NTP) &mdash; tickets are time-stamped, so skewed clocks break logins. Pass-the-hash targets NTLM; golden-ticket attacks target Kerberos TGTs.</blockquote>
`},
{id:"acmodels",obj:"4.6",title:"Access Control Models",html:`
<div class="tblwrap"><table><caption>Who decides who gets access</caption>
<tr><th>Model</th><th>Decided by</th><th>Recognize it by</th></tr>
<tr><td><strong>Mandatory (MAC)</strong></td><td>The system, via labels set by administrators</td><td>Classification labels (confidential, secret, top secret) and clearances. Users can't change or share access. Military/government; SELinux</td></tr>
<tr><td><strong>Discretionary (DAC)</strong></td><td>The resource's owner</td><td>"The person who created the file decides who can open it." Flexible, weakest control. Standard Windows and Linux file permissions</td></tr>
<tr><td><strong>Role-based (RBAC)</strong></td><td>Job function</td><td>Rights assigned to roles/groups (nurse, HR, manager); users inherit them by joining. Windows groups</td></tr>
<tr><td><strong>Rule-based</strong></td><td>Admin-defined rules applied to everyone</td><td>Conditions that don't depend on who you are: firewall ACLs, "this form only from the corporate network"</td></tr>
<tr><td><strong>Attribute-based (ABAC)</strong></td><td>Many attributes evaluated together</td><td>Combinations of user, resource, action and environment: department + device + location + time + data sensitivity. The most granular; common in zero trust</td></tr>
</table></div>
<ul>
<li><strong>Time-of-day restrictions</strong> &mdash; access only allowed in set hours (lab systems 8&ndash;6, no training-room network overnight). Remember time zones in global organizations.</li>
<li><strong>Least privilege</strong> &mdash; only the access the job requires, nothing standing "just in case". Limits what malware or a stolen account can do.</li>
</ul>
<p><strong>Conditional access</strong> is rule-based control as most organisations actually encounter it. Instead of deciding once at logon and then forgetting about it, the system keeps watching the session &mdash; device health and patch level, location, network, time of day, how sensitive the resource being opened is &mdash; and re-challenges for MFA or suspends the session the moment those conditions stop matching policy. It is the mechanism behind the continuous verification that zero trust asks for.</p>
<p>The everyday form of the same idea is prompting for elevation only at the moment privilege is genuinely needed: <strong>User Account Control (UAC)</strong> on Windows and <strong>sudo</strong> on Linux both let someone work in an ordinary account and step up for one action, which is least privilege made liveable.</p>
<p>Account restrictions worth naming alongside these:</p>
<ul>
