var TOPICS = [
{id:"controls",obj:"1.1",title:"Security Control Categories &amp; Types",html:`
<p>Controls exist to <strong>prevent</strong> security events, <strong>minimize their impact</strong> when they happen, and <strong>limit the damage</strong> afterwards. Every control fits two dimensions: a <strong>category</strong> (who or what enforces it) and a <strong>type</strong> (what job it does). The fastest way to answer a "which category" exam question is to ask <em>who's doing the enforcing</em>.</p>
<p><strong>Categories:</strong></p>
<ul>
<li><strong>Technical</strong> &mdash; enforced by a system: firewall rules, OS policies, antivirus.</li>
<li><strong>Managerial</strong> &mdash; enforced by policy and paperwork: onboarding policy, compliance documentation, standard operating procedures (SOPs).</li>
<li><strong>Operational</strong> &mdash; enforced by people, day to day: security guards, awareness training and lunch-and-learns, awareness posters, patrolling &mdash; and, just as much, the processes those people run: <strong>patch management</strong>, <strong>incident response testing</strong>, <strong>disaster recovery drills</strong>, <strong>configuration management</strong>. Don't let the word "operational" shrink to people in corridors. "Who enforces it" remains the tiebreaker: the written policy is managerial, the human carrying it out month after month is operational, the tool that applies the patch is technical.</li>
<li><strong>Physical</strong> &mdash; enforced by a physical object: locks, fences, badge readers.</li>
</ul>
<p><strong>Types.</strong> The fastest tiebreaker between the first three is <em>when</em> the control acts relative to the attack &mdash; preventive operates <strong>before</strong>, detective <strong>during</strong>, corrective <strong>after</strong>:</p>
<ol>
<li><strong>Preventive</strong> &mdash; stops the access before it happens (firewall rule, guard shack ID check).</li>
<li><strong>Deterrent</strong> &mdash; discourages the attempt without physically stopping it (splash screen, warning signs).</li>
<li><strong>Detective</strong> &mdash; identifies or logs that something happened (log review, motion detector).</li>
<li><strong>Corrective</strong> &mdash; reverses or limits damage after detection and gets the business running again with minimal downtime (restore from a known-good backup after ransomware, fire extinguisher).</li>
<li><strong>Compensating</strong> &mdash; a temporary substitute when you lack the resources or means to apply the ideal control, until a full fix is in place (block traffic while awaiting a patch).</li>
<li><strong>Directive</strong> &mdash; tells someone to act a certain way ("store sensitive files in the protected folder"); relatively weak, since it relies on the person complying and judging correctly what counts as sensitive.</li>
</ol>
<div class="tblwrap"><table><caption>Full matrix, with worked examples</caption>
<tr><th>Type</th><th>Technical</th><th>Managerial</th><th>Operational</th><th>Physical</th></tr>
<tr><td>Preventive</td><td>Firewall rule</td><td>Onboarding policy</td><td>Guard shack ID check</td><td>Door lock</td></tr>
<tr><td>Deterrent</td><td>Login splash screen</td><td>Threat of demotion/dismissal</td><td>Reception desk greeter</td><td>Warning signs</td></tr>
<tr><td>Detective</td><td>System log review</td><td>Reviewing login reports</td><td>Property patrol</td><td>Motion detector</td></tr>
<tr><td>Corrective</td><td>Restore from backup</td><td>Incident-reporting policy</td><td>Contacting law enforcement</td><td>Fire extinguisher</td></tr>
<tr><td>Compensating</td><td>Blocking traffic instead of patching</td><td>Separation of duties</td><td>Multiple guards on duty simultaneously</td><td>Backup power generator</td></tr>
<tr><td>Directive</td><td>Policy forcing encrypted storage</td><td>Compliance policy/training</td><td>Security policy training course</td><td>"Authorized personnel only" sign</td></tr>
</table></div>
<p><strong>IDS vs. IPS is the classic type question.</strong> An intrusion detection system watches and alerts, so it's a <em>detective</em> control. An intrusion prevention system sits inline and drops the malicious traffic, so it's a <em>preventive</em> control. Both are technical. Log monitoring and security audits are detective too: they find a problem after it starts but don't stop it.</p>
<p><strong>Managerial vs. operational</strong> trips people up because both involve people. Managerial controls are decisions and documents that come from leadership: security policies, risk assessments, the choice of which risks to accept. Operational controls are what staff carry out day to day to put those decisions into effect: delivering awareness training, following the incident response procedure, doing guard rounds. A risk assessment is managerial; running the IR playbook during an outbreak is operational.</p>
<p>No single category or type is enough by itself. Defense in depth means stacking them, so a failure in one layer is caught by another. A badge reader (physical, preventive) stops most intruders, the camera (physical, detective) records the one who tailgates, and the incident procedure (operational, corrective) deals with what happens next. Scenario answers that combine layers are usually stronger than ones that rely on a single control.</p>
<p><strong>Security guards look like a contradiction across two topics, and they aren't.</strong> For a 1.1 categorization question a guard is an <em>operational</em> control, because a human being enforcing a rule is the definition of operational; the 1.2 physical-security topic also lists guards because guards are plainly part of physical security <em>as a subject</em>. The two pages answer different questions &mdash; which category does this control belong to, versus what protects the building &mdash; so read the stem before you pick. A 1.1 stem asking you to sort controls into technical, managerial, operational and physical wants operational.</p>
<blockquote><span class="tag">Gotcha</span>A control can honestly land in more than one cell depending on how it's implemented &mdash; the exam question's wording decides the category and type, not the object itself. A camera <em>recording</em> is detective; a camera's mere visible <em>presence</em> is more deterrent.</blockquote>
`},
{id:"cia",obj:"1.2",title:"CIA Triad",html:`
<p>The three security objectives every control ultimately serves. Sometimes called the AIC triad so it isn't confused with the intelligence agency &mdash; same three concepts either way.</p>
<ul>
<li><strong>Confidentiality</strong> &mdash; only the right people can see the data. Provided by encryption, access controls, and extra authentication factors.</li>
<li><strong>Integrity</strong> &mdash; data received is exactly what was sent, unchanged in transit. Provided by hashing, digital signatures, certificates and <strong>non-repudiation</strong>, which Messer files under integrity.</li>
<li><strong>Availability</strong> &mdash; systems stay up and reachable. Provided by fault tolerance, redundancy, and patching.</li>
</ul>
<p>An alternative four-part model uses the mnemonic <strong>PAIN</strong>: <strong>P</strong>rivacy, <strong>A</strong>uthentication, <strong>I</strong>ntegrity, <strong>N</strong>on-repudiation. It isn't a fourth leg added to CIA; it's a different way of slicing the same goals, useful when a question treats non-repudiation as a named security property rather than a side effect of signing.</p>
`},
{id:"nonrepud",obj:"1.2",title:"Non-Repudiation",html:`
<p><strong>Non-repudiation</strong> means the sender can't credibly deny having sent something &mdash; it combines two proofs:</p>
<ol>
<li><strong>Proof of integrity</strong> &mdash; the data wasn't altered (a hash/fingerprint of the data).</li>
<li><strong>Proof of origin</strong> &mdash; it really came from that sender (a digital signature, built from a hash encrypted with the sender's private key).</li>
</ol>
<p>Non-repudiation is really "integrity" plus "we can also prove who sent it" &mdash; a hash alone gives integrity but not origin. Proof of origin is also called <strong>authentication of the message source</strong>.</p>
<p>What makes it <em>non-repudiation</em> rather than just authentication: <strong>anyone</strong>, including a third party, can verify the signature with the sender's public key. The recipient doesn't have to be trusted to vouch for it.</p>
<blockquote><span class="tag">Gotcha</span>Integrity (hashing) proves data wasn't changed; non-repudiation (digital signature) proves <em>who</em> sent it <em>and</em> that it wasn't changed. A hash by itself is never non-repudiation.</blockquote>
`},
{id:"aaa",obj:"1.2",title:"AAA &mdash; Authentication, Authorization, Accounting",html:`
<ol>
<li><strong>Identification</strong> &mdash; you claim an identity (a username).</li>
<li><strong>Authentication</strong> &mdash; you prove that identity (password + factors).</li>
<li><strong>Authorization</strong> &mdash; the system decides what you're allowed to do.</li>
<li><strong>Accounting</strong> &mdash; the system logs what you did and when: login time, data sent and received, logout time. Those records serve <em>two</em> purposes, not one: <strong>monitoring, visibility and reporting</strong> &mdash; who did what, for audit and investigation &mdash; and <strong>billing or chargeback</strong>, metering a department's or a customer's usage so it can be invoiced back. If a stem asks which part of AAA supports billing, the answer is accounting.</li>
</ol>
<p>A classic AAA flow: a client authenticates to a VPN concentrator, which has no user database of its own &mdash; it forwards the credentials to a centralized <strong>AAA server</strong>, which approves or denies, and the concentrator then grants (or refuses) access to internal resources. Devices, not just people, can authenticate too &mdash; a company laptop can carry a CA-issued device certificate so a VPN concentrator can confirm it's a trusted company asset even with nobody typing a password. The device certificate is issued by the organization's CA, whose own certificate is signed by a <strong>root CA</strong>; the concentrator or management software validates the device by checking it chains to that trusted CA.</p>
<p>Access control governs how <strong>subjects</strong> interact with <strong>objects</strong>. A subject is any person, device, or software process that can request access; an object is the resource itself &mdash; a network, server, database, app, or file. Subjects are assigned rights or permissions on objects, and modern implementations of this are called <strong>identity and access management (IAM)</strong> systems, built from exactly those four processes above.</p>
<p>How rights get granted is set by the authorization model. In a <strong>discretionary</strong> model the object's owner allocates rights. In a <strong>mandatory</strong> model rights are predetermined by system-enforced rules and cannot be changed by any user within the system.</p>
<p><strong>Authorization models</strong> solve the scaling problem: instead of assigning rights resource-by-resource to every individual user, you put an abstraction layer &mdash; typically <strong>groups/roles</strong>, though models can also be defined by organization, attributes and other characteristics (more in 4.6) &mdash; between users and resources. Add a user to a group once, and they inherit every permission that group already has, no matter how many resources or users you're managing.</p><p>Not every device can hold a certificate. An HVAC controller, a badge reader, a medical infusion pump or an IP door lock has no user, often no way to install a credential, and no operating system you can join to the domain &mdash; yet it still has to get onto the network. The answer is <strong>endpoint fingerprinting</strong> (device profiling): the NAC or 802.1X infrastructure identifies the device from its observable characteristics &mdash; MAC address and OUI, DHCP options, HTTP user agent, open ports, traffic patterns, the responses it gives to a scan &mdash; builds a profile, and authenticates the device on the strength of that profile rather than on a credential it presents. That profile then drives authorization too: a device fingerprinted as a badge reader is placed on the IoT VLAN and allowed to talk only to its controller. Read it as the standard fallback for the device class that cannot carry a device certificate, and expect scenario questions to describe the device rather than name the technique.</p>

`},
{id:"gap",obj:"1.2",title:"Gap Analysis",html:`
<p><strong>Gap analysis</strong> is a comparison of your current security state against a baseline of where you should be. You measure against a published standard &mdash; common ones are <strong>NIST SP 800-171 Rev. 2</strong> (protecting controlled unclassified information in non-federal systems) and <strong>ISO/IEC 27001</strong> (information security management systems, ISMS) &mdash; or a standard your own organization writes. It's a multi-person project that can take weeks, months or even years.</p>
<p>The baseline usually comes from a <strong>cybersecurity framework</strong>, which guides the selection and configuration of controls so a security program isn't built in a vacuum. The NIST framework organizes everything into five functions: <strong>Identify</strong> (policies, risk evaluation, recommending controls), <strong>Protect</strong> (procure, install, operate and decommission assets securely), <strong>Detect</strong> (ongoing monitoring that controls still work), <strong>Respond</strong> (contain and eradicate threats), and <strong>Recover</strong> (restore systems and data when other controls fail). A gap analysis report scores each section of the framework, lists the missing or poorly configured controls, and recommends remediation &mdash; which is what makes it an externally verifiable statement of compliance.</p>
<ol>
<li>Pick a baseline.</li>
<li>Evaluate people (training, experience, policy awareness) and processes (do existing systems actually follow policy).</li>
<li>Break broad categories into individual controls.</li>
<li>Document the gap between current and target state.</li>
<li>Produce a report with a remediation roadmap, often color-coded red/yellow/green by how far a system is from meeting baseline. Fix <strong>red first</strong>, then yellow, then green. Closing the gaps takes time, money, equipment and change control.</li>
</ol>
<p>Common gaps: weak/shared credentials, untested patch management, violations of least privilege, unenforced acceptable-use policies, poor physical security, configuration drift from weak change management, and poor audit visibility.</p><p>Don't confuse gap analysis with a risk assessment. A gap analysis asks "how far are we from this standard or target state?" and produces a list of missing controls plus a remediation roadmap. A risk assessment asks "what could go wrong, how likely is it, and how bad would it be?" If a scenario says an organization wants to measure itself against ISO 27001 or NIST before an audit, that's a gap analysis.</p>

`},
{id:"zerotrust",obj:"1.2",title:"Zero Trust",html:`
<p><strong>Zero Trust</strong> replaces "trust based on network location" with continuous verification of every user, device, and process, every time, regardless of location. Two planes:</p>
<ul>
<li><strong>Data plane</strong> &mdash; where traffic actually moves: subjects/systems, <strong>implicit trust zones</strong> (trusted, untrusted, DMZ, cloud VPN subnet), and the <strong>Policy Enforcement Point (PEP)</strong> &mdash; the gatekeeper all traffic must pass through (edge router, firewall, SDP gateway, API gateway).</li>
<li><strong>Control plane</strong> &mdash; where the decisions get made, via the <strong>Policy Decision Point (PDP)</strong>, split into:</li>
</ul>
<ol>
<li><strong>Policy Engine (PE)</strong> &mdash; compares the request against policy and decides grant/deny/revoke.</li>
<li><strong>Policy Administrator (PA)</strong> &mdash; takes that decision and relays it to the PEP, issuing the tokens/credentials.</li>
</ol>
<p>Flow: subject requests access from an untrusted zone &rarr; PEP intercepts &rarr; PEP asks the PA &rarr; PA asks the PE to decide &rarr; decision flows back PA &rarr; PEP &rarr; PEP grants or blocks access.</p>
<p>Why it exists: in a traditional network, once you're past the firewall the inside is wide open, so users and malware can move laterally with ease. Zero trust applies to physical devices, virtual ones (virtual switches and firewalls) and cloud controls alike.</p>
<ul>
<li><strong>Adaptive identity</strong> (risk-based authentication) strengthens authentication based on context: the user's relationship to the organization (employee or contractor), physical location, connection type, IP geolocation that doesn't fit (US data requested from an overseas IP), unusual role or a request for sensitive data.</li>
<li><strong>Threat scope reduction</strong> &mdash; shrink how much any one compromised identity or device can reach, for example by <strong>limiting entry points</strong> to in-building or VPN access only.</li>
<li><strong>Policy-driven access control</strong> &mdash; combining all those data points into rules that decide how strong authentication must be and what access is granted.</li>
<li><strong>Implicit trust zones</strong> in practice: traffic from an untrusted zone to a trusted one may be denied automatically, while traffic from the trusted corporate zone to the internal data-center zone is implicitly trusted.</li>
</ul>
<p>The <strong>subjects/systems</strong> are users, processes and applications; the resource they want is the <strong>enterprise resource</strong>. The PEP may be several devices working together, and it <em>doesn't decide</em> anything &mdash; it gathers information and passes it to the PDP.</p>
<blockquote><span class="tag">Gotcha</span>The data plane <em>moves</em> traffic; the control plane <em>manages</em> it (policies, decision logic). If the question is about forwarding packets, that's data plane &mdash; if it's about the rule or decision behind the forwarding, that's control plane. And the <strong>PEP enforces, the PDP decides</strong>.</blockquote>
`},
{id:"physical",obj:"1.2",title:"Physical Security Controls",html:`
<div class="tblwrap"><table><caption>Physical controls, outside in</caption>
<tr><th>Control</th><th>Purpose</th><th>Notes</th></tr>
<tr><td>Bollards / barricades</td><td>Block vehicles, let pedestrians through</td><td>Concrete or high-tech; can be natural, like water with one bridge in</td></tr>
<tr><td>Fencing</td><td>Perimeter deterrence/prevention</td><td>Transparent (see through) or opaque; height + razor wire scale with sensitivity; gate classes I residential, II commercial, III industrial, IV restricted (airports, prisons)</td></tr>
<tr><td>Access control vestibule (mantrap)</td><td>One person (or a controlled group), one door open at a time</td><td>Interlocking doors: opening one locks the other. Stops tailgating; common at data centers</td></tr>
<tr><td>Badges / access cards</td><td>"Something you have" factor</td><td>Photo and name, worn visibly; badge-ins logged centrally</td></tr>
<tr><td>Lighting</td><td>Deterrence + supports camera detail</td><td>More light, more security; the angle matters for facial recognition. Continuous, standby, movable, emergency modes; infrared cameras see without light</td></tr>
<tr><td>CCTV / video surveillance</td><td>Detective (and some deterrent)</td><td>Motion and object detection, facial and licence-plate recognition, central recording; alert if a camera is disabled; watch for "dead spots"</td></tr>
<tr><td>Security guards</td><td>Detective, deterrent, and preventive</td><td>Validate employees and escort visitors; often in pairs for two-person integrity</td></tr>
<tr><td>Sensors</td><td>Detective</td><td>Infrared, microwave, ultrasonic, pressure, electromechanical, electrostatic</td></tr>
</table></div>
<div class="tblwrap"><table><caption>Sensor types</caption>
<tr><th>Sensor</th><th>Detects</th></tr>
<tr><td><strong>Infrared</strong></td><td>Heat/movement over a limited area; common in motion detectors</td></tr>
<tr><td><strong>Microwave</strong></td><td>Movement over a larger area than infrared</td></tr>
<tr><td><strong>Ultrasonic</strong></td><td>Reflected sound waves; also used for collision detection in car parks</td></tr>
<tr><td><strong>Pressure</strong></td><td>A change in force, like someone stepping on a floor mat</td></tr>
</table></div><p>A few more physical-security terms from the acronym list: wiring closets &mdash; the <strong>MDF</strong> (main distribution frame) where outside lines enter and the <strong>IDF</strong>s (intermediate distribution frames) on each floor &mdash; hold switches and patch panels and need locks, access logging and cameras like any server room. <strong>PTZ</strong> (pan-tilt-zoom) cameras can be steered to follow activity, while fixed cameras cover one view. <strong>UAVs</strong> (unmanned aerial vehicles, drones) can be used for aerial reconnaissance of a site, and by defenders for perimeter patrol.</p>

`},
{id:"deception",obj:"1.2",title:"Deception &amp; Disruption Technology",html:`
<p>Turns your own knowledge of attackers against them:</p>
<ul>
<li><strong>Honeypot</strong> &mdash; a single decoy system designed to attract and hold an attacker's attention. Most of what it catches is automated attack tooling, so the value is learning what attackers' automation targets. It's an arms race: attackers learn to spot honeypots, and honeypots get more realistic.</li>
<li><strong>Honeynet</strong> &mdash; multiple honeypots (workstations, servers, routers, firewalls) combined into a decoy network that looks and feels real.</li>
<li><strong>Honeyfile</strong> &mdash; a decoy file (e.g. a fake <code>passwords.txt</code>) that should never legitimately be opened; access triggers an alert.</li>
<li><strong>Honeytoken</strong> &mdash; traceable fake data seeded so that if it ever surfaces elsewhere, you know exactly where the leak came from: fake API credentials left on a public cloud share, fake email addresses, database records, browser cookies, tracking pixels.</li>
</ul>
<p>Why deception tools make such good detectors: no legitimate user or process should ever touch a honeypot, honeyfile or honeytoken. Any interaction at all is suspicious, so the alerts have very few false positives compared with signature- or anomaly-based monitoring. They also buy time, because an attacker working on a decoy isn't working on real assets.</p>
<blockquote><span class="tag">Gotcha</span>A honeypot is one decoy system; a honeynet is many honeypots wired together. A honeyfile/honeytoken is decoy <em>data</em>, not a decoy <em>system</em> &mdash; its job is detecting and tracing a leak, whether the person who took it is an insider or an outsider.</blockquote>
`},
{id:"changebiz",obj:"1.3",title:"Change Management &mdash; Business Process",html:`
<p>The paperwork and approvals before a technician touches anything:</p>
<ol>
<li><strong>Submit</strong> a formal change request: reason, scope, systems affected, schedule.</li>
<li><strong>Approve</strong>: a change control board rates the risk (high/medium/low), weighing the risk of making the change (the fix doesn't work, breaks something else, corrupts data) against the risk of <em>not</em> making it (an open vulnerability, an app going down).</li>
<li>Assign <strong>ownership</strong> &mdash; the data/application owner manages and later tests the change, but usually isn't the one implementing it.</li>
<li>Identify <strong>stakeholders</strong> &mdash; everyone the change touches, often wider than it looks.</li>
<li>Run a <strong>change impact analysis</strong> &mdash; compare current vs. future state, a mini gap analysis.</li>
<li>Use the <strong>RACI model</strong> to assign roles: Responsible (does the work), Accountable (owns the outcome, exactly one person), Consulted (two-way input), Informed (one-way notification).</li>
<li>Test in a <strong>sandbox testing environment</strong> (a copy of production) and document the results. Prepare a <strong>backout/rollback plan</strong> and test it there too; take a <strong>full backup before the change</strong> in case the backout itself fails.</li>
<li>Schedule within a <strong>maintenance window</strong>, following a documented <strong>SOP</strong> (standard operating procedure). Time of year matters as well as time of day: retailers often impose a <strong>change freeze</strong> from Thanksgiving to New Year.</li>
</ol>
<p>Formal change control exists to keep systems up, keep everyone informed and prevent mistakes. After the change, users verify their own systems still work.</p><p><strong>Standard operating procedure (SOP)</strong> &mdash; the change management process itself is written down as a formal, well-documented SOP that everyone can find and follow, usually on the intranet. When the process changes, the SOP is updated to match, so it stays a living document rather than a record of how things used to be done.</p>
<p>The security team should always be a stakeholder in change approval. An impact analysis and test plan should check that <em>security controls still work</em> after the change, not just that the application runs: firewall rules haven't opened extra ports, logs still reach the SIEM, and authentication is still enforced. A change that works but quietly disables a control is still a failed change.</p>
<p>What goes wrong without change management: unapproved, undocumented changes cause configuration drift, unexpected outages and new vulnerabilities that nobody knows to look for. They also make incident response harder, because investigators can't tell a legitimate change from an attacker's change. If an exam scenario describes an outage or exposure caused by someone making an ad hoc change in production, the missing control is formal change management.</p>

`},
{id:"changetech",obj:"1.3",title:"Change Management &mdash; Technical Implications",html:`
<p>What the technician actually deals with:</p>
<ul>
<li><strong>Allow lists</strong> (only named items may run &mdash; restrictive by default) vs. <strong>deny lists</strong>, also called <strong>block lists</strong> (everything may run except named items &mdash; permissive by default, e.g. how antivirus typically works).</li>
<li><strong>Restricted activities</strong> &mdash; staying inside the <strong>documented scope</strong> of the change ticket, with a defined process for when scope must expand mid-change. Anything outside the approved scope is a restricted activity and needs its own approval, not a judgement call at the keyboard.</li>
<li><strong>Downtime</strong> planning: <strong>planned downtime</strong> in a scheduled maintenance window, agreed and announced in advance, as against <strong>unplanned downtime</strong> &mdash; the outage a failure or a botched change hands you. A primary/secondary failover keeps the service up through either in 24/7 environments. Tell users in advance by email or a central change-control calendar.</li>
<li><strong>Service restart</strong> vs. full <strong>application restart</strong> vs. full reboot &mdash; pick the minimum needed. A reboot also proves the system will come back after a power loss.</li>
<li><strong>Legacy applications</strong> &mdash; old, often unsupported, risky to touch; documenting them brings them back into normal support.</li>
<li><strong>Dependencies</strong> &mdash; updating one system may require updating others first, sometimes on entirely different systems (new firewall management software that needs newer firewall firmware).</li>
</ul>
<p>Security side-effects to watch for during a change:</p><ul><li><strong>Allow/deny list edits</strong> &mdash; adding an entry to an allow list widens the attack surface, and a careless deny list entry can block a legitimate security agent or update server.</li><li><strong>Restarts and downtime</strong> &mdash; while a service is restarting, the security tools that depend on it (logging, EDR, IPS) may not be running, which leaves a monitoring gap.</li><li><strong>Legacy applications</strong> &mdash; they often can't support modern settings such as TLS 1.3 or MFA, so they may need compensating controls like network isolation.</li></ul>
<blockquote><span class="tag">Gotcha</span>Allow list = restrictive (default deny, only named items run); deny list = permissive (default allow, only named items are blocked). It reads backwards from what "allow" and "deny" sound like at first glance.</blockquote>
`},
{id:"changedocs",obj:"1.3",title:"Documentation &amp; Version Control",html:`
<p>Changes get tracked in a <strong>CMDB</strong> (configuration management database) as part of a broader <strong>configuration management system (CMS)</strong>. Version control applies to OS builds, app updates, driver/firmware updates, TPM updates, router configurations, registry changes and licensing &mdash; anything you might need to revert.</p>
<p>Documentation goes stale quickly, so <strong>updating it should be a required step of every change</strong>: network diagrams, IP addresses, configurations and procedures.</p><p>Version control is a security control as well as a convenience. It records who changed what and when, which gives you an audit trail. You can compare a running configuration against the approved version to spot unauthorized changes, and you can roll back to a known-good state if a change goes wrong. Up-to-date diagrams matter for the same reason: during an incident, responders working from an old network map will miss the systems and paths the attacker is actually using.</p>

`},
{id:"pki",obj:"1.4",title:"Public Key Infrastructure &amp; Certificates",html:`
<p><strong>PKI</strong> is the whole set of policies, procedures, hardware, and software for creating, distributing, storing, and revoking digital certificates &mdash; the machinery that makes "trust" scalable across the internet. PKI's three core pieces: the <strong>public key</strong> (shareable, does the encrypting), the <strong>private key</strong> (secret, does the decrypting), and <strong>key escrow</strong> &mdash; a trusted third party holds a backup copy of a private key so data can still be recovered if the original key is lost, an employee leaves or changes department, a partner such as a government agency needs to read shared encrypted data, or law enforcement compels access. Escrow can be run by a third party or in-house; it's controversial but keeps data available.</p>
<p>A <strong>digital certificate</strong> bundles a public key with identifying information and a digital signature. Standard format: <strong>X.509</strong>, whose fields include the serial number, version, signature algorithm, issuer, subject name, public key, and validity dates. Buying a certificate really buys the CA's <em>validation</em> that you are who you say.</p>
<p><strong>Where trust comes from:</strong></p>
<ul>
<li><strong>Certificate Authority (CA) model</strong> &mdash; a trusted third party digitally signs certificates; your browser ships with a built-in list of hundreds of trusted CAs.</li>
<li><strong>Web of trust</strong> &mdash; no central CA; individuals sign each other's certificates.</li>
<li><strong>Internal/private CA</strong> &mdash; an organization runs its own CA for internal-only services; every device must have the internal CA's root cert installed to trust it.</li>
<li><strong>Self-signed vs. third-party</strong> &mdash; a self-signed certificate is vouched for by nobody but itself, so browsers warn on it; a third-party certificate is signed by a CA the client already trusts. Self-signed is fine for internal testing, never for public services.</li>
<li><strong>Root of trust</strong> &mdash; the anchor the whole chain hangs from. Every device ships with a store of trusted root certificates, in the browser, the OS, or both; a certificate is trusted only if it chains back to one of those roots. More broadly, a root of trust can be hardware, firmware or software &mdash; an HSM, a secure enclave, or a CA.</li>
</ul>
<div class="tblwrap"><table><caption>CA trust models</caption>
<tr><th>Model</th><th>Structure</th></tr>
<tr><td><strong>Single / enterprise CA</strong></td><td>One CA issues directly to everyone in the organization. Must stay online to serve requests. Typical for small and medium businesses and internal-only PKI.</td></tr>
<tr><td><strong>Hierarchical</strong></td><td>A root CA signs <strong>intermediate</strong> CAs, and the intermediates do the day-to-day issuing. The root is usually kept <em>offline</em> and brought online only briefly, because compromising it would invalidate everything beneath it.</td></tr>
</table></div>
<p>Certificates carry pseudorandom serial numbers and explicit validity dates &mdash; every key has a finite life, because unlimited time favours brute force. Withdrawing a certificate comes in two flavours: <strong>revocation</strong> is permanent and final, while <strong>suspension</strong> (hold) is temporary and can be reversed.</p>
<p><strong>Lifetimes vary by role.</strong> A root certificate may be valid for a decade or more, because replacing it means touching every trust store that holds it. Server and user certificates are issued for roughly a year, so a quietly compromised key has a short shelf life. Certificates are normally <strong>renewed before they expire</strong> rather than left to lapse &mdash; an expired certificate takes a service down just as effectively as a revoked one, and it is a far more common outage cause. When a certificate is withdrawn early the revocation entry also carries a <strong>reason code</strong>: key compromise, superseded, cessation of operation, affiliation changed, certificate hold and so on. That code is what distinguishes a permanent revocation from a reversible suspension. <em>Reason codes are not a named objective bullet; revocation is.</em></p>
<p><strong>Getting a certificate:</strong></p>
<ol>
<li>Generate a key pair and bundle the public key + identity info into a <strong>Certificate Signing Request (CSR)</strong>.</li>
<li>Send the CSR to a CA.</li>
<li>The CA <strong>validates</strong> that you actually control what you're requesting a cert for.</li>
<li>The CA signs the certificate with <em>its</em> private key and returns it.</li>
</ol>
<p><strong>Certificate features:</strong></p>
<ul>
<li><strong>Subject Alternative Name (SAN)</strong> &mdash; an extension listing several specific names or domains on one certificate (<code>example.com</code>, <code>www.example.com</code>, <code>mail.example.org</code>).</li>
<li><strong>Wildcard certificate</strong> &mdash; <code>*.example.com</code> covers every subdomain at one level with one certificate. A wildcard can appear inside a SAN list, which is why the two are often mentioned together.</li>
<li><strong>Certificate Revocation List (CRL)</strong> &mdash; a list of revoked certs hosted by the CA; the browser downloads the whole list to check. The certificate's <strong>CRL distribution point</strong> field tells the browser where to find it. Certificates get revoked when a server is retired or its private key may be compromised.</li>
<li><strong>OCSP</strong> (Online Certificate Status Protocol) &mdash; a real-time status check per certificate with an OCSP responder, more efficient than a CRL. <strong>OCSP stapling</strong> embeds the status in the TLS handshake; it's signed by the CA, so the web server can't fake it. Browser support has been inconsistent.</li>
<li>Real-world example: <strong>Heartbleed</strong> (April 2014, an OpenSSL vulnerability) could leak servers' private keys, which forced mass certificate revocation and reissuance industry-wide.</li>
</ul>
<p>The CSR carries only the public key and identifying details. The private key is generated on the requester's own system and never goes to the CA. If a scenario has someone emailing a private key to a CA or a vendor so a certificate can be issued, the process is broken and that key should be considered compromised.</p>
<p>CRL weakness: clients download the list on a schedule, so a certificate revoked just after the last update is still trusted until the client fetches the next CRL. OCSP shrinks that window by checking a single certificate's status at the moment it's used. If a scenario needs revocation to take effect as quickly as possible, OCSP (ideally with stapling) is the better answer.</p>
<p><strong>Wildcard trade-off:</strong> one *.example.com certificate is cheap and easy to manage, but it covers only one subdomain level (it matches www.example.com, not a.b.example.com). The same private key also sits on every server that uses it, so compromising any one of those servers exposes every subdomain. A SAN certificate lists exact names, which gives tighter scope.</p>
<p>One X.509 field is now a trap: the <strong>common name (CN)</strong>. It was originally where a server put its fully qualified domain name, but the field was free-form and could hold anything at all, so clients stopped relying on it. Browsers today validate the <strong>subject alternative name</strong> extension and <em>ignore CN entirely</em>; a certificate with the right name only in CN will fail. Most CAs still populate CN for compatibility with older software, which is why you will still see it filled in. <em>CN itself is not a named objective bullet</em> &mdash; SAN is &mdash; but CN being deprecated is the whole reason SAN exists.</p>
<p>The hidden cost of self-signed certificates on internal sites is that users get used to clicking through browser certificate warnings. That habit is exactly what an on-path attacker presenting a fake certificate relies on. For internal services, the better fix is an internal CA whose root certificate is pushed to every managed device, so internal sites are trusted and a warning stays meaningful.</p>
<blockquote><span class="tag">Gotcha</span>CRL = pull a whole list and search it yourself (slower). OCSP = ask a direct yes/no about one certificate (faster); OCSP stapling skips even that extra round trip by having the <em>server</em> present a pre-signed status during the handshake.</blockquote>
`},
{id:"certformats",obj:"1.4",title:"Certificate Formats, PKCS &amp; Enrollment",html:`
<ul>
<li><strong>RA</strong> &mdash; registration authority: verifies the identity of whoever requests a certificate before the CA issues it. The CA signs; the RA checks.</li>
<li><strong>SCEP</strong> &mdash; Simple Certificate Enrollment Protocol: automates certificate requests for large numbers of devices, commonly through MDM.</li>
<li><strong>OID</strong> &mdash; object identifier: the numeric identifier that labels each certificate field and extension (key usage, policies).</li>
<li><strong>Recovery agent (also RA)</strong> &mdash; an account authorized to decrypt other users' encrypted data, such as the EFS data recovery agent. Closely related to key escrow.</li>
<li><strong>KEK</strong> &mdash; key encryption key: a key whose only job is encrypting other keys (data encryption keys). Rotating the KEK doesn't require re-encrypting all the data; key management systems and HSMs work this way.</li>
</ul>
<div class="tblwrap"><table><caption>Certificate file formats and standards</caption>
<tr><th>Format</th><th>What it is</th></tr>
<tr><td><strong>PKCS</strong> &mdash; Public Key Cryptography Standards</td><td>A family of standards: PKCS #7 (certificate chains, .p7b), PKCS #10 (the CSR format), PKCS #12 (certificate plus private key bundle)</td></tr>
<tr><td><strong>P12 / PFX</strong></td><td>PKCS #12 file holding a certificate <em>and its private key</em>, password-protected. Used to move a certificate between systems</td></tr>
<tr><td><strong>PEM</strong> &mdash; Privacy Enhanced Mail</td><td>Base64 text with "BEGIN CERTIFICATE" headers (.pem, .crt). Readable in a text editor</td></tr>
<tr><td><strong>DER</strong></td><td>The same certificate in binary form (.der, .cer)</td></tr>
</table></div>
<p><strong>Auto-enrollment</strong> is where a private CA and a public one part company. Inside a Windows domain an internal CA can be set to issue certificates to users and devices automatically: authenticating to Active Directory <em>is</em> the identity check, so a domain-joined laptop collects its certificate without anyone filing a request. A public CA has no such relationship with the requester, so it must establish identity some other way &mdash; proving control of the domain, vetting the organisation, or a full extended validation check &mdash; before it will sign anything. That is the practical difference between internal and third-party registration, and it is why internal PKI scales to thousands of devices cheaply. <em>Auto-enrollment is not a named objective bullet</em>, but it sits directly beside the enrolment mechanisms above.</p>
<blockquote><span class="tag">Gotcha</span>A <strong>.p12/.pfx</strong> file contains the <em>private key</em> &mdash; treat it like a password. PEM and DER normally hold just the certificate (public key). The <strong>RA verifies identity</strong>; the <strong>CA signs</strong>.</blockquote>
`},
{id:"symasym",obj:"1.4",title:"Symmetric vs. Asymmetric Encryption",html:`
<div class="tblwrap"><table>
<tr><th></th><th>Symmetric</th><th>Asymmetric</th></tr>
<tr><td>Keys</td><td>One shared secret key encrypts and decrypts (also called a secret-key or shared-secret algorithm)</td><td>Two mathematically related keys &mdash; public encrypts, private decrypts</td></tr>
<tr><td>Speed</td><td>Fast, low overhead</td><td>Slower, more overhead</td></tr>
<tr><td>Scaling</td><td>Hard past ~10 people/devices</td><td>Scales well &mdash; public key can be posted anywhere</td></tr>
<tr><td>Typical key length</td><td>128 bits+</td><td>3072 bits+</td></tr>
<tr><td>Examples</td><td>AES (Advanced Encryption Standard), DES (Data Encryption Standard, legacy &mdash; avoid)</td><td>RSA-style key pairs, PGP/GPG</td></tr>
<tr><td>Real-world use</td><td>Bulk data encryption</td><td>Key exchange, digital signatures, identity</td></tr>
</table></div>
<p>Both keys in a pair are generated together from randomness and large prime numbers. They're mathematically related, but you <strong>can't derive the private key from the public key</strong>, so the public key can be posted anywhere while the private key stays protected (usually by a password).</p>
<p>The <strong>algorithm is public; only the key is secret</strong> &mdash; like a door lock whose design everyone knows. A public algorithm is <em>more</em> trustworthy because its math can be examined. Keys get longer over time as computers get faster at brute force.</p>
<p>In practice almost every real system uses <strong>both</strong>: asymmetric to safely exchange a fast symmetric session key, then symmetric to actually encrypt the bulk data.</p>
<p>The vocabulary for that combination is worth having. A single algorithm doing exactly one job &mdash; one hash function, one symmetric cipher, one asymmetric cipher &mdash; is a <strong>cryptographic primitive</strong>. Primitives are never used alone in a real protocol; they are assembled into a <strong>cipher suite</strong> that names a key exchange method, a bulk encryption cipher and an integrity mechanism. That is why a TLS connection reports four algorithms in one string rather than simply saying it is encrypted &mdash; each part of the string is a different primitive covering a different job. <em>Neither term is a named bullet in the exam objectives</em>, but it makes the rest of 1.4 much easier to read.</p><p><strong>Key length and keyspace</strong> is a named objective bullet in its own right. The <strong>keyspace</strong> is the total number of possible keys &mdash; roughly 2 to the power of the key size &mdash; so every single extra bit <em>doubles</em> the work a brute-force search has to do. Longer is stronger, but only within the same algorithm family: <strong>a 256-bit ECC key carries roughly the strength of a 3072-bit RSA key</strong> (NIST's equivalence &mdash; both around 128-bit security), because the two rest on different hard problems. Course material often quotes the looser 256-to-2048 pairing, so treat any figure in that range as the same point. That is why ECC is chosen for phones, smart cards and anything limited on power, memory or bandwidth &mdash; comparable strength for a fraction of the key size and the processing. Both RSA and ECC are <strong>trapdoor functions</strong>: easy to compute one way with the public key, and impractical to run backwards without the private key.</p>

`},
{id:"ciphermodes",obj:"1.4",title:"Cipher Modes, Legacy Algorithms &amp; XOR",html:`
<p>A <strong>block cipher</strong> (AES, DES) encrypts fixed-size blocks; a <strong>stream cipher</strong> (RC4) encrypts a byte or bit at a time by combining the data with a keystream. Most of that combining is done with <strong>XOR</strong> (exclusive or): 1 when the two bits differ, 0 when they match. XOR is reversible, which is exactly why it works for encryption &mdash; XOR the ciphertext with the same keystream and you get the plaintext back.</p>
<div class="tblwrap"><table><caption>Block cipher modes of operation</caption>
<tr><th>Mode</th><th>How it works</th><th>Security note</th></tr>
<tr><td><strong>ECB</strong> &mdash; Electronic Code Book</td><td>Each block encrypted independently with the same key</td><td>Identical plaintext blocks give identical ciphertext, so patterns leak. Avoid</td></tr>
<tr><td><strong>CBC</strong> &mdash; Cipher Block Chaining</td><td>Each block is XORed with the previous ciphertext block before encryption; the first uses an initialization vector (IV)</td><td>Hides patterns; blocks must be processed in order</td></tr>
<tr><td><strong>CFB</strong> &mdash; Cipher Feedback</td><td>Turns a block cipher into a self-synchronizing stream cipher</td><td>Can encrypt data smaller than a block</td></tr>
<tr><td><strong>CTR</strong> &mdash; Counter</td><td>Encrypts a counter and XORs the result with the data</td><td>Blocks can be processed in parallel</td></tr>
<tr><td><strong>GCM</strong> &mdash; Galois/Counter Mode</td><td>Counter mode plus built-in authentication</td><td>Confidentiality <em>and</em> integrity in one step; the modern choice (TLS 1.3, WPA3's GCMP)</td></tr>
</table></div>
<div class="tblwrap"><table><caption>Algorithms you should recognize as legacy</caption>
<tr><th>Algorithm</th><th>Type</th><th>Status</th></tr>
<tr><td><strong>DES</strong> &mdash; Data Encryption Standard</td><td>Symmetric block, 56-bit key</td><td>Broken by brute force</td></tr>
<tr><td><strong>3DES</strong> &mdash; Triple DES</td><td>DES applied three times</td><td>Deprecated; slow and superseded by AES</td></tr>
<tr><td><strong>IDEA</strong> &mdash; International Data Encryption Algorithm</td><td>Symmetric block, used in early PGP</td><td>Legacy</td></tr>
<tr><td><strong>RC4</strong> &mdash; Rivest Cipher 4</td><td>Stream cipher</td><td>Broken; used in WEP and old TLS</td></tr>
<tr><td><strong>AES</strong> &mdash; Advanced Encryption Standard</td><td>Symmetric block, 128/192/256-bit keys</td><td>Current standard</td></tr>
</table></div>
<p><em>Taught in class but not named anywhere in the SY0-701 objectives</em> &mdash; recognize these words and move on, don't study them. A <strong>substitution cipher</strong> swaps each letter for another; ROT13 is a Caesar cipher that shifts every letter thirteen places. A <strong>transposition cipher</strong> keeps exactly the same letters and only reorders them. On the quantum side, a <strong>qubit</strong> can hold a mixture of states at once (<strong>superposition</strong>), which is what would let a large quantum computer break RSA and ECC; <strong>post-quantum cryptography</strong> is the name for the replacement algorithms being standardized in anticipation. <strong>Homomorphic encryption</strong> allows calculations to be run on data while it stays encrypted, so whoever does the processing never sees the plaintext. <strong>Lightweight cryptography</strong> covers ciphers designed for constrained devices such as IoT sensors and smart cards.</p>
<blockquote><span class="tag">Gotcha</span><strong>ECB leaks patterns</strong> &mdash; the classic demonstration is an image encrypted in ECB mode whose outline is still visible. If a question asks which mode is insecure because identical blocks encrypt identically, it's ECB. GCM is the one that adds authentication.</blockquote>
`},
{id:"enclocation",obj:"1.4",title:"Encryption by Location &amp; Key Exchange",html:`
<p><strong>By location:</strong></p>
<ul>
<li><strong>At rest</strong>: full-disk or volume (BitLocker, FileVault; see the levels table below), file-level (Windows EFS, the Encrypting File System built into NTFS), or database-level &mdash; transparent (whole DB with a symmetric key, but every search needs decryption) vs. column-level (only sensitive fields like the SSN, so the rest stays searchable); also partition-level and record-level for finer-grained control.</li>
<li><strong>In transit</strong>: HTTPS for browser traffic; VPNs create an encrypted tunnel &mdash; client-based VPNs typically use SSL/TLS, site-to-site VPNs typically use IPsec.</li>
</ul>
<p><strong>Key exchange</strong> solves "how do two parties agree on a secret key over an insecure network":</p>
<ul>
<li><strong>Out-of-band</strong> &mdash; exchange the key through a separate channel entirely (courier, phone call, in person). Too slow for internet use.</li>
<li><strong>In-band</strong> &mdash; exchange it over the same network, protected another way: the client generates a random symmetric <strong>session key</strong>, encrypts it with the server's public key, and the server decrypts it with its private key. Session keys are ephemeral &mdash; a new one every session.</li>
<li><strong>Key exchange algorithms</strong> (Diffie-Hellman style) let both sides independently compute the <em>same</em> symmetric key &mdash; the key itself is never transmitted at all. Mechanically, Bob's private key combined with Alice's public key produces the same value as Alice's private key combined with Bob's public key. It's neither encryption nor hashing. The colour-mixing analogy captures it: both parties end up with a shared colour that an observer watching the exchange cannot reproduce.</li>
<li><strong>Key stretching</strong> (key strengthening) makes brute-forcing dramatically slower by hashing the hash over and over, so every guess costs many operations. <strong>PBKDF2</strong> is the named tool: it applies a pseudorandom function (typically an HMAC) to the password plus a salt, then repeats &mdash; originally a thousand iterations, now hundreds of thousands, because processors got fast.</li>
</ul>
<div class="tblwrap"><table><caption>Diffie-Hellman variants &mdash; static vs. ephemeral</caption>
<tr><th>Variant</th><th>Key pair</th><th>Shared secret</th></tr>
<tr><td><strong>DH / DHKE</strong></td><td>Traditional</td><td>Same one reused every time &mdash; rarely used today</td></tr>
<tr><td><strong>DHE</strong> (ephemeral)</td><td>Traditional</td><td>New one per session &mdash; enables perfect forward secrecy</td></tr>
<tr><td><strong>ECDH</strong></td><td>Elliptic curve</td><td>Same one reused every time</td></tr>
<tr><td><strong>ECDHE</strong></td><td>Elliptic curve</td><td>New one per session &mdash; the preferred modern choice</td></tr>
</table></div>
<p><strong>Perfect forward secrecy</strong> is what the ephemeral variants buy you: because each session uses a different secret, compromising a long-term key later does not let an attacker decrypt traffic they recorded earlier. The contrast is worth having ready: a <strong>plain RSA key exchange has no forward secrecy at all</strong>, because the session key was encrypted with the server's long-term public key &mdash; steal that private key a year later and every captured session from the past year decrypts. An <strong>ephemeral Diffie-Hellman exchange (DHE or ECDHE)</strong> derives a fresh key for each session and discards it, so the same stolen long-term key buys the attacker nothing retrospectively. Elliptic curve is favoured on mobile and IoT hardware because it delivers equivalent strength with far smaller keys &mdash; a 256-bit EC key is roughly comparable to a 3072-bit traditional key, which matters when memory and processing power are limited. You'll meet these in SSH, TLS and IPsec/IKEv2.</p>
<div class="tblwrap"><table><caption>Encryption levels, from broadest to narrowest</caption>
<tr><th>Level</th><th>What gets encrypted</th><th>Example / note</th></tr>
<tr><td><strong>Full disk (FDE)</strong></td><td>The entire physical drive, including the OS and boot data</td><td>BitLocker on the system drive, FileVault. <strong>Self-encrypting drives (SEDs)</strong> do it in the drive's own hardware and can be crypto-erased by destroying the key</td></tr>
<tr><td><strong>Partition</strong></td><td>One partition of a drive, not the whole disk</td><td>A drive with an OS partition and a separate encrypted data partition</td></tr>
<tr><td><strong>Volume</strong></td><td>One logical volume; other volumes stay unencrypted</td><td>BitLocker To Go on a removable drive; an encrypted container that can span disks</td></tr>
<tr><td><strong>File</strong></td><td>Individual files or folders</td><td>Windows EFS</td></tr>
<tr><td><strong>Database</strong></td><td>The whole database (transparent) or chosen columns</td><td>Column-level keeps the rest searchable</td></tr>
<tr><td><strong>Record</strong></td><td>Individual rows/records, each with its own key</td><td>Exposing one key exposes only that record</td></tr>
</table></div>
<p>Elliptic curve cryptography (<strong>ECC</strong>) is the family behind ECDH, ECDHE and ECDSA.</p>
<p>Full-disk encryption protects data only while the device is powered off or locked. Once the system has booted and a user is logged in, the disk is transparently decrypted, so malware or anyone at the unlocked session can read everything. That's why FDE answers a "stolen laptop" scenario, while protecting specific sensitive files from other users or processes on a running system calls for file-level (or database column/record-level) encryption.</p>
<p>Matching the encryption level to the scenario:</p><ul><li>Laptop or phone that could be lost &mdash; full-disk.</li><li>Removable drive or one data area on a shared disk &mdash; volume or partition.</li><li>A few sensitive documents on an otherwise ordinary system &mdash; file.</li><li>Only certain fields, like credit card numbers or SSNs, in a table that must stay searchable &mdash; column- or record-level database encryption.</li><li>Data moving across a network &mdash; transport encryption, also called <strong>communication encryption</strong> (TLS, IPsec), because at-rest encryption does nothing once data leaves the disk.</li></ul>
<blockquote><span class="tag">Gotcha</span>The trailing <strong>E</strong> means <em>ephemeral</em> &mdash; a fresh secret per session, and therefore perfect forward secrecy. Also note RSA can both exchange keys <em>and</em> sign certificates; Diffie-Hellman only does key exchange and cannot sign.</blockquote>
`},
{id:"cryptohw",obj:"1.4",title:"Crypto Hardware",html:`
<div class="tblwrap"><table>
<tr><th>Tool</th><th>Scope</th><th>Purpose</th></tr>
<tr><td><strong>TPM</strong> (Trusted Platform Module)</td><td>One device</td><td>On-motherboard chip: random number generator, key generator, persistent memory with burned-in keys unique to that machine (e.g. BitLocker keys); resists brute-force and dictionary attacks</td></tr>
<tr><td><strong>HSM</strong> (Hardware Security Module)</td><td>Data-center scale</td><td>Clustered, redundant, dedicated hardware for high-volume key storage and crypto acceleration</td></tr>
<tr><td><strong>Key management system</strong></td><td>Organization-wide</td><td>Centralized console, on-premises or cloud: keeps keys separate from the data they protect, ties keys to users, rotates them automatically, logs and reports, and tracks certificate expiry across SSL, SSH, BitLocker, etc.</td></tr>
<tr><td><strong>Secure enclave</strong></td><td>One device</td><td>A separate security processor with its own boot ROM: monitors boot, true random number generator, real-time encryption of memory, and built-in keys that anchor all the device's crypto</td></tr>
</table></div>
<p>Some detail worth carrying into the exam:</p>
<ul>
<li><strong>TPM</strong> was originally a discrete chip on the motherboard; <strong>TPM 2.0</strong> let manufacturers build the capability into the chipset itself. It's what stores the keys behind full-disk encryption and device-bound X.509 certificates &mdash; a device certificate held in a TPM is a common building block of a Zero Trust rollout.</li>
<li><strong>HSMs</strong> are no longer only appliances: they can be virtualized, or shrunk into smart card, MicroSD and USB form factors. Beyond storing keys they generate and manage them, verify certificates, and <em>offload and accelerate</em> SSL/TLS processing from the servers they front.</li>
<li>A <strong>cloud key management service</strong> is the managed version of the same idea &mdash; creating and controlling symmetric and asymmetric keys, integrated with the provider's storage, database and application services.</li>
<li>A <strong>secure enclave</strong> is a dedicated security processor separate from the main CPU (each vendor brands it differently). Its immutable keys are the root of the device's encryption, which is why a lost phone's data stays private. Related technology (trusted execution environments) also walls code and data off from privileged processes on the main CPU.</li>
</ul>
<blockquote><span class="tag">Gotcha</span>TPM secures <em>one</em> device's keys; HSM secures keys for <em>many</em> devices at data-center scale. Don't confuse either with a key management system, which is the software console that organizes keys that may live <em>in</em> a TPM, HSM, or elsewhere.</blockquote>
`},
{id:"hashsig",obj:"1.4",title:"Hashing, Salting &amp; Digital Signatures",html:`
<p>A <strong>hash</strong> turns data of any size into a short, fixed-length fingerprint. Everyday uses: checking a downloaded file against the publisher's hash, and checking a password at login by hashing what was typed and comparing it with the stored hash. It's one-directional &mdash; you cannot reconstruct the original data from the hash, which separates hashing from encryption.</p>
<p>Output is called a <strong>digest</strong> or fingerprint, typically 128 to 512 bits. Two properties define a usable hash:</p>
<ul>
<li><strong>Avalanche effect</strong> &mdash; flipping a single bit of input produces a completely different digest, not a slightly different one.</li>
<li><strong>Collision resistance</strong> &mdash; two different inputs must not produce the same digest. Once collisions become practical the hash can no longer prove integrity.</li>
</ul>
<div class="tblwrap"><table><caption>Hash functions worth recognizing</caption>
<tr><th>Function</th><th>Digest</th><th>Status</th></tr>
<tr><td><strong>MD5</strong></td><td>128-bit</td><td>Deprecated &mdash; collision demonstrated in 1996</td></tr>
<tr><td><strong>SHA-1</strong></td><td>160-bit</td><td>Deprecated for security use</td></tr>
<tr><td><strong>SHA-2</strong> (SHA-256, SHA-512)</td><td>256 / 512-bit</td><td>Current workhorse; SHA-256 shows as 64 hex characters</td></tr>
<tr><td><strong>SHA-3</strong></td><td>224&ndash;512-bit</td><td>Newer standard, different internal design to SHA-2</td></tr>
<tr><td><strong>RIPEMD</strong> / <strong>Whirlpool</strong></td><td>Various</td><td>Less common; Whirlpool is built on AES</td></tr>
</table></div>
<blockquote><span class="tag">Gotcha</span>Because of the <strong>birthday paradox</strong>, a hash is only about as strong as <em>half</em> its bit length against collision attacks. A 512-bit hash gives roughly 256 bits of collision resistance &mdash; which is why digest length is chosen with that halving already assumed.</blockquote>
<p><strong>Password storage</strong>: never store plaintext, never <em>encrypt</em> either &mdash; store a <strong>salted hash</strong>. A <strong>salt</strong> is random data added before hashing so identical passwords produce different stored hashes, which defeats <strong>rainbow tables</strong> (precomputed tables of inputs and their hashes that crack unsalted hashes in seconds) and forces an attacker back to slow brute forcing. Salting fails in two specific ways: a salt that is <em>too short</em>, or a salt that is <em>reused</em> rather than unique per password.</p>
<p><strong>HMAC</strong> (hash-based message authentication code) is a hash combined with a <strong>shared secret key</strong>. Because the key is required to produce a matching value, an HMAC proves two things at once: the data wasn't altered (<em>integrity</em>) and it came from someone holding the key (<em>origin authentication</em>). A plain hash proves only the first. Dynamic routing protocols use HMACs exactly this way &mdash; a router appends an HMAC to each route update, and a peer sharing the key can confirm both that the update is intact and that a legitimate neighbour sent it.</p>
<blockquote><span class="tag">Gotcha</span>Three easily confused mechanisms: a <strong>hash</strong> gives integrity only. An <strong>HMAC</strong> adds a shared secret, giving integrity plus origin authentication &mdash; but both parties hold the same key, so it cannot prove which one sent it. A <strong>digital signature</strong> uses the sender's <em>private</em> key, which only they hold, so it adds true non-repudiation.</blockquote>
<p><strong>Digital signature process</strong> (Alice signs a message to Bob):</p>
<ol>
<li>Alice hashes the plaintext message.</li>
<li>Alice encrypts that hash with <strong>her own private key</strong> &mdash; this encrypted hash is the digital signature.</li>
<li>Alice sends the plaintext message plus the signature to Bob.</li>
<li>Bob decrypts the signature using <strong>Alice's public key</strong>, recovering the original hash.</li>
<li>Bob independently hashes the plaintext he received.</li>
<li>If the two hashes match, Bob has confirmed integrity, authentication and non-repudiation.</li>
</ol>
<p>A signature gives <strong>integrity, authentication and non-repudiation</strong> but <strong>not confidentiality</strong>: the message itself travels in plaintext unless it's also encrypted.</p>
<p>Notice the key usage is the <em>reverse</em> of normal asymmetric encryption: for confidentiality you encrypt with the recipient's <strong>public</strong> key; for a signature you sign with <strong>your own private</strong> key so anyone can verify it with your <strong>public</strong> key.</p>
<p><strong>Salting vs. key stretching</strong> solve different problems and are used together. A salt makes every stored hash unique, which defeats precomputed rainbow tables and stops one cracked hash from revealing everyone who used the same password. Key stretching makes computing <em>each</em> guess slow, which defeats fast brute-force and dictionary attacks. A salted but fast hash can still be brute-forced quickly with GPUs. Salting plus stretching (PBKDF2, bcrypt) is the correct answer for password storage.</p>
<p>A <strong>pepper</strong> is the third ingredient, and it defends against a different failure. Like a salt it is added to the password before hashing, but unlike a salt it is a single <em>secret</em> value held <strong>separately from the password database</strong> &mdash; in application configuration, an environment variable, or an HSM. Salts are stored right next to the hashes they belong to, so an attacker who dumps the database has everything needed to start guessing; the pepper is not in that dump, so the stolen database alone will not reproduce the hashes. Salt defeats rainbow tables, stretching makes each guess slow, pepper makes the stolen file insufficient on its own. Pepper is not on CompTIA's acronym list &mdash; treat it as enrichment that sharpens what a salt is and isn't, not as an objective term you'll be asked to define.</p>
<blockquote><span class="tag">Gotcha</span>Hashing alone = integrity only. Hashing + encrypting that hash with the sender's private key = digital signature = integrity <strong>and</strong> non-repudiation.</blockquote>
`},
{id:"sigalgs",obj:"1.4",title:"Signature Algorithms &amp; Checksums",html:`
<div class="tblwrap"><table><caption>Named algorithms</caption>
<tr><th>Algorithm</th><th>Purpose</th><th>Note</th></tr>
<tr><td><strong>RSA</strong></td><td>Encryption, key exchange <em>and</em> signatures</td><td>Large keys (3072-bit+)</td></tr>
<tr><td><strong>DSA</strong> &mdash; Digital Signature Algorithm</td><td>Signatures only</td><td>Cannot encrypt</td></tr>
<tr><td><strong>ECDSA</strong> &mdash; Elliptic Curve DSA</td><td>Signatures using elliptic curves</td><td>Much smaller keys for the same strength; common in TLS certificates and code signing</td></tr>
<tr><td><strong>CRC</strong> &mdash; Cyclical Redundancy Check</td><td>Detects <em>accidental</em> errors in transmission or storage</td><td>Not a security control &mdash; an attacker can change data and recompute the CRC</td></tr>
</table></div>
<p>RIPEMD's name comes from <strong>RACE</strong> (Research and Development in Advanced Communications Technologies in Europe), the project that produced it.</p>
<blockquote><span class="tag">Gotcha</span>A <strong>CRC or checksum detects accidents, not attacks</strong>. Only a cryptographic hash, an HMAC or a signature gives tamper protection.</blockquote>
`},
{id:"obfsblock",obj:"1.4",title:"Obfuscation &amp; Blockchain",html:`
<p><strong>Obfuscation</strong> hides data in plain sight rather than mathematically protecting it &mdash; reversible if you know the trick, which is why it's "security through obscurity," not a substitute for real cryptography.</p>
<ul>
<li><strong>Steganography</strong> (Greek for "concealed writing") &mdash; hiding data inside other data: an image (the carrier is called the <strong>covertext</strong>), audio, video, or network traffic. Printer <strong>machine identification codes</strong> (tiny yellow dots) are a real-world example. Strictly it isn't cryptography at all &mdash; nothing is scrambled and no key is involved, the message is simply concealed.</li>
<li><strong>Tokenization</strong> &mdash; replace sensitive data with a meaningless substitute (a token) that only the issuing system can map back to the real value. Mobile payment tokens are the classic example: a token service issues tokens to the phone, the phone sends one over NFC at checkout, and the token server looks up the real card. Each token works <strong>once</strong>, so a captured one can't be replayed, and it can cross the network without encryption or hashing.</li>
<li><strong>Data masking</strong> &mdash; show only part of the sensitive value, e.g. a receipt showing <code>**** **** **** 2512</code>. The weakness is <em>inference</em>: enough partial values can still narrow down the original, which is why tokenization is generally the stronger choice.</li>
</ul>
<p><strong>Blockchain</strong> is a distributed, append-only, open public ledger anyone participating can view and help maintain: every participant holds a copy, and updates propagate to everyone. Transactions are grouped into blocks; each block includes a <strong>hash</strong> covering its contents, and each block also carries the previous block's hash, chaining them together, so tampering with a past transaction invalidates that block's hash and every hash after it &mdash; and participants who see an invalid hash reject the block. That property has a name: <strong>immutability</strong>. Once a block is accepted into the chain its contents cannot be changed without every other participant noticing, which is why a blockchain is described as tamper-evident. Examples include payment processing, cryptocurrency transfers and property title records. Uses beyond cryptocurrency: digital identity, supply-chain tracking, digital voting.</p>
<p>Data masking is also used outside receipts and screens. It builds realistic <em>test and development</em> datasets: real names, addresses and account numbers are replaced with fake values that keep the same format, so developers can work with believable data without seeing real PII. Tokenization is the payment industry's favourite because systems that store only tokens don't hold real card numbers, which shrinks the scope of PCI DSS compliance.</p>
<p>Steganography typically works by changing the least significant bits of image pixels or audio samples. The change is too small to see or hear, but it can carry a hidden message. Encryption hides what a message <em>says</em>; steganography hides that a message <em>exists</em>. They can be combined, with data encrypted first and then hidden, which also makes steganography a data exfiltration technique that DLP tools may miss.</p>
<p>Steganography is one instance of a broader idea: a <strong>covert channel</strong> &mdash; any communication path that moves data where nobody is looking for it. Hiding a message in a carrier file is the obvious case, but the same reasoning applies to unused fields in a protocol header, to data smuggled inside DNS queries, or even to the <em>timing</em> of otherwise ordinary packets. Covert channels are awkward to defend against because inspection tools examine content, and a covert channel's content is perfectly legitimate &mdash; the payload lives in where or when it was sent, not in what it says. <em>The term is not a named objective bullet</em>; steganography is.</p>
<p>Masking and tokenization are two routes to one goal: <strong>de-identification</strong> &mdash; strip or replace the values that point at a particular person, while leaving the record useful for analysis. A dataset with names and card numbers removed but purchase dates and amounts intact still answers the business questions, and it no longer holds the values that would turn a breach into a notifiable one. The caveat is that de-identification is a matter of degree rather than a yes-or-no state: combine enough surviving fields and individuals can sometimes be re-identified, which is the inference weakness already noted for masking. <em>De-identification is not a named objective bullet</em>; data masking and tokenization both are.</p>
<blockquote><span class="tag">Gotcha</span>Obfuscation hides data by making it hard to <em>find or recognize</em>; encryption makes it mathematically impossible to read without a key, even in plain view. A token has no mathematical relationship to the real value at all.</blockquote>
`}
];

var GOTCHAS_TABLE = `
<div class="tblwrap"><table><caption>Every pink callout, collected for a final pass</caption>
<tr><th>Pair</th><th>The distinction</th></tr>
<tr><td>Preventive vs. deterrent</td><td>Preventive physically stops access; deterrent only discourages the attempt</td></tr>
<tr><td>Integrity (hash) vs. non-repudiation (signature)</td><td>Hash proves data wasn't changed; a signature additionally proves who sent it</td></tr>
<tr><td>Data plane vs. control plane</td><td>Data plane moves traffic; control plane makes the rules/decisions behind the move</td></tr>
<tr><td>Honeypot vs. honeynet vs. honeyfile/honeytoken</td><td>One decoy system vs. a network of decoys vs. decoy data that traces a leak</td></tr>
<tr><td>PEP vs. PDP</td><td>The enforcement point gathers and enforces; the decision point (policy engine + administrator) decides</td></tr>
<tr><td>Allow list vs. deny list (also called block list)</td><td>Allow list = restrictive, default-deny; deny list / block list = permissive, default-allow &mdash; same thing under two names</td></tr>
<tr><td>Symmetric vs. asymmetric encryption</td><td>One shared key vs. two mathematically related keys; symmetric is faster, asymmetric scales better</td></tr>
<tr><td>SAN vs. wildcard</td><td>A list of specific names on one cert vs. <code>*.domain</code> covering every subdomain at one level</td></tr>
<tr><td>Digital signature and confidentiality</td><td>A signature gives integrity, authentication and non-repudiation &mdash; never confidentiality</td></tr>
<tr><td>CRL vs. OCSP (stapling)</td><td>CRL = download the whole revocation list; OCSP = ask about one cert in real time; stapling embeds that answer in the handshake</td></tr>
<tr><td>TPM vs. HSM</td><td>TPM secures one device; HSM secures many devices at data-center scale</td></tr>
<tr><td>Hashing vs. digital signature</td><td>Hash = fingerprint/integrity only; signature = hash encrypted with the sender's private key = integrity + non-repudiation</td></tr>
<tr><td>Obfuscation vs. encryption</td><td>Obfuscation hides data from casual view; encryption makes it mathematically unreadable without the key</td></tr>
<tr><td>Confidentiality vs. integrity controls</td><td>Confidentiality: encryption, access controls, extra auth factors; Integrity: hashing, digital signatures, certificates</td></tr>
<tr><td>ECB vs. CBC vs. GCM</td><td>Identical blocks leak patterns vs. blocks chained with an IV vs. counter mode with built-in authentication</td></tr>
<tr><td>RA vs. CA</td><td>Registration authority verifies identity; certificate authority signs the certificate</td></tr>
<tr><td>P12/PFX vs. PEM/DER</td><td>Bundle with the private key vs. the certificate alone (text or binary)</td></tr>
<tr><td>CRC vs. hash</td><td>Detects accidental errors vs. detects tampering</td></tr>
<tr><td>Salt vs. pepper</td><td>A salt is random, unique per password and stored <em>with</em> the hash; a pepper is secret, shared and held <em>separately</em> from the database &mdash; so a stolen database is not enough to reproduce the hashes</td></tr>
<tr><td>CN vs. SAN</td><td>Common name is the deprecated legacy field for a server's FQDN and could hold anything; browsers now validate the subject alternative name and ignore CN, though CAs still fill CN in for compatibility</td></tr>
<tr><td>RSA vs. ECC key length</td><td>A 256-bit ECC key is roughly an RSA key of 2048&ndash;3072 bits (NIST says 3072) &mdash; comparable strength &mdash; ECC gets there with a far smaller key, which is why it suits phones, smart cards and IoT</td></tr>
<tr><td>RSA key exchange vs. ECDHE</td><td>RSA key exchange has <em>no</em> forward secrecy &mdash; a private key stolen later decrypts recorded past sessions; ECDHE generates a fresh key per session, so old traffic stays shut</td></tr>
</table></div>
<p style="font-size:13px;color:var(--text-muted);">Per the legend rules, keep this list under 10% of your own notes when you transfer any of this &mdash; if everything's a gotcha, nothing is.</p>
`;

/* build a plain-text search index once */
var SEARCH_INDEX = {};
(function buildIndex(){
  var scratch = document.createElement("div");
  TOPICS.forEach(function(t){
    scratch.innerHTML = t.title + " " + t.html;
    SEARCH_INDEX[t.id] = (scratch.textContent || "").toLowerCase();
  });
})();

var activeTab = "all";
var query = "";
var openIds = {};

var tabsEl = document.getElementById("tabs");
function buildTabs(){
  tabsEl.innerHTML = "";
  TAB_ORDER.forEach(function(k){
    var b = document.createElement("button");
    b.className = "tab" + (activeTab === k && !query ? " active" : "");
    b.textContent = TAB_LABEL[k];
    b.setAttribute("role","tab");
    b.addEventListener("click", function(){
      activeTab = k;
      searchInput.value = "";
      query = "";
      clearBtn.hidden = true;
      render();
    });
    tabsEl.appendChild(b);
  });
}

var searchInput = document.getElementById("search");
var clearBtn = document.getElementById("clear-search");
searchInput.addEventListener("input", function(){
  query = searchInput.value.trim().toLowerCase();
  clearBtn.hidden = query.length === 0;
  render();
});
clearBtn.addEventListener("click", function(){
  searchInput.value = "";
  query = "";
  clearBtn.hidden = true;
  render();
});

var listEl = document.getElementById("topiclist");
var emptyEl = document.getElementById("empty-state");
var notesEl = document.getElementById("results-note");

function matchingTopics(){
  if(query){
    return TOPICS.filter(function(t){ return SEARCH_INDEX[t.id].indexOf(query) !== -1; });
  }
  if(activeTab === "all") return TOPICS;
  if(activeTab === "gotchas") return [];
  return TOPICS.filter(function(t){ return t.obj === activeTab; });
}

function topicCard(t, forceOpen){
  var isOpen = !!openIds[t.id] || forceOpen;
  var div = document.createElement("div");
  div.id = "t-" + t.id;
  div.className = "topic" + (isOpen ? " open" : "");
  var badge = OBJ_TITLE[t.obj] ? t.obj : "";
  div.innerHTML =
    '<button class="topic-head" type="button">' +
      '<h2>' + t.title + '</h2>' +
      '<span style="display:flex;align-items:center;gap:8px;">' +
        (badge ? '<span class="topic-badge">' + badge + '</span>' : '') +
        '<span class="chev">&#9656;</span>' +
      '</span>' +
    '</button>' +
    '<div class="topic-body">' + t.html + '</div>';
  div.querySelector(".topic-head").addEventListener("click", function(){
    var nowOpen = !div.classList.contains("open");
    div.classList.toggle("open", nowOpen);
    openIds[t.id] = nowOpen;
  });
  return div;
}

function render(){
  buildTabs();
  listEl.innerHTML = "";
  notesEl.hidden = true;
  emptyEl.hidden = true;

  if(activeTab === "gotchas" && !query){
    var card = document.createElement("div");
    card.className = "topic open";
    card.innerHTML =
      '<button class="topic-head" type="button"><h2>Domain 1 Gotchas &mdash; quick-scan compare cards</h2>' +
      '<span class="chev">&#9656;</span></button>' +
      '<div class="topic-body">' + GOTCHAS_TABLE + '</div>';
    card.querySelector(".topic-head").addEventListener("click", function(){
      card.classList.toggle("open");
    });
    listEl.appendChild(card);
    return;
  }

  var matches = matchingTopics();

  if(query){
    notesEl.hidden = false;
    notesEl.textContent = matches.length + (matches.length === 1 ? ' result for "' : ' results for "') + searchInput.value.trim() + '"';
  }

  if(matches.length === 0){
    emptyEl.hidden = false;
    return;
  }

  matches.forEach(function(t, i){
    var forceOpen = !!query && matches.length <= 6;
    listEl.appendChild(topicCard(t, forceOpen));
  });

  if(!query && matches.length > 0 && Object.keys(openIds).length === 0){
    listEl.firstChild.classList.add("open");
  }
}

render();

/* open a topic when arriving from a link like notebook.html#topic-id */
function openFromHash(){
  var h = decodeURIComponent((location.hash || "").replace(/^#/, ""));
  if(!h || !TOPICS.some(function(t){ return t.id === h; })) return;
  activeTab = "all"; query = ""; searchInput.value = ""; clearBtn.hidden = true;
  openIds = {}; openIds[h] = true;
  render();
  var el = document.getElementById("t-" + h);
  if(!el) return;
  setTimeout(function(){
    var bar = document.querySelector(".topbar");
    var y = el.getBoundingClientRect().top + window.pageYOffset - (bar ? bar.offsetHeight : 0) - 12;
    window.scrollTo(0, Math.max(0, y));
  }, 50);
}
openFromHash();
window.addEventListener("hashchange", openFromHash);
})();
</script>
